[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flameclyffe-ml"
version = "0.1.0"
description = "Review-gated PyTorch laboratory for Flameclyffe and Terra Aeterna engines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary project code; third-party models retain their own licences." }
authors = [{ name = "Rowan and Flameclyffe collaborators" }]
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
]

[project.scripts]
flameclyffe-living-engine = "flameclyffe_ml.living_engine.__main__:main"

[project.optional-dependencies]
torch = [
  "torch>=2.3,<3",
  "captum>=0.7,<1",
]
semantic = [
  "torch>=2.3,<3",
  "sentence-transformers>=3,<6",
]
vision = [
  "torch>=2.3,<3",
  "transformers>=4.41,<5",
  "pillow>=10,<12",
]
audio = [
  "torch>=2.3,<3",
  "transformers>=4.41,<5",
  "torchcodec>=0.1,<1",
]
service = [
  "fastapi[standard]>=0.115,<1",
]
visual-lab = [
  "pygame-ce>=2.5,<3",
  "moderngl>=5.10,<6",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flameclyffe_ml"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
markers = [
  "service: tests requiring the FastAPI service extra",
  "heavy: tests requiring optional model, GPU, or visual dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "fastapi.*",
  "starlette.*",
  "numpy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["flameclyffe_ml"]

[tool.coverage.report]
show_missing = true
skip_covered = true
