<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Shoreline Lab</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#020611;color:#eafcff;font-family:system-ui}canvas{position:fixed;inset:0}.hud{position:fixed;left:24px;bottom:24px;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);padding:14px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.12)}h1{margin:0 0 6px;font-size:1.2rem}.tiny{opacity:.8;font-size:.9rem}</style></head><body><canvas id='c'></canvas><div class='hud'><h1>Terra Aeterna · Shoreline Lab</h1><div class='tiny'>Bioluminescent coast prototype. Move the mouse across the water.</div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let w,h,mx=0.5,my=0.5,r=[];function rs(){w=c.width=innerWidth;h=c.height=innerHeight}addEventListener('resize',rs);rs();for(let i=0;i<220;i++)r.push({x:Math.random(),y:.45+Math.random()*.45,s:Math.random()*2+1,p:Math.random()*6.28});addEventListener('pointermove',e=>{mx=e.clientX/w;my=e.clientY/h});function draw(t){t/=1000;x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#081426');g.addColorStop(.55,'#0a2235');g.addColorStop(1,'#020611');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='rgba(220,235,255,.9)';x.beginPath();x.arc(w*.8,h*.22,40,0,7);x.fill();x.fillStyle='#d9e6ef';for(let i=0;i<w;i+=6){let y=h*.68+Math.sin(i*.01+t*.4)*8;x.fillRect(i,y,6,h-y)}for(const p of r){let px=p.x*w,py=p.y*h+Math.sin(t+p.p)*10;let d=Math.hypot(px-mx*w,py-my*h);let glow=Math.max(0,1-d/220);x.fillStyle=`rgba(90,255,220,${0.15+glow*0.8})`;x.beginPath();x.arc(px,py,p.s+glow*3,0,7);x.fill()}x.strokeStyle='rgba(120,255,230,.25)';for(let k=1;k<4;k++){x.beginPath();for(let i=0;i<w;i+=8){let y=h*.72+Math.sin(i*.008+t*.8+k)*12+k*8+(mx-.5)*12;x.lineTo(i,y)}x.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></body></html>
