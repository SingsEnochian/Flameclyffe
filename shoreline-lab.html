<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoreline Lab · Terra Aeterna</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#020611;color:#eafcff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;left:24px;bottom:24px;max-width:min(430px,calc(100vw - 48px));background:rgba(1,8,15,.38);backdrop-filter:blur(16px);padding:16px 18px;border-radius:22px;border:1px solid rgba(177,255,230,.16);box-shadow:0 18px 70px rgba(0,0,0,.45)}h1{margin:0 0 6px;font-size:1.25rem;letter-spacing:.02em}.tiny{opacity:.82;font-size:.9rem}.pill{display:inline-flex;margin-top:10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:.25rem .6rem;color:#c9f7e9;font-size:.78rem}.hint{position:fixed;right:24px;top:24px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:.45rem .75rem;color:#d6fff2;font-size:.82rem;backdrop-filter:blur(12px)}</style></head><body><canvas id="c"></canvas><div class="hint">move / click the tide</div><div class="hud"><h1>Terra Aeterna · Shoreline Lab v0.2</h1><div class="tiny">Bioluminescent coast, layered waves, fog, starfield, pointer ripples, and the first distant Observatory lantern.</div><span class="pill" id="readout">coast breathing</span></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let w,h,dpr=1,mx=.5,my=.5,stars=[],motes=[],ripples=[],currents=[];const rnd=(a=1,b=0)=>Math.random()*a+b;function seed(){stars=[];motes=[];currents=[];for(let i=0;i<190;i++)stars.push({x:rnd(w),y:rnd(h*.52),r:rnd(1.3,.2),p:rnd(6.28),tw:rnd(1.8,.4)});for(let i=0;i<420;i++)motes.push({x:rnd(w),y:rnd(h*.38,h*.46),r:rnd(2.2,.6),p:rnd(6.28),v:rnd(.18,.03),hue:rnd(55,155)});for(let i=0;i<28;i++)currents.push({x:rnd(w),y:rnd(h*.26,h*.47),len:rnd(180,60),p:rnd(6.28),s:rnd(.55,.15)})}function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);seed()}addEventListener('resize',resize);resize();addEventListener('pointermove',e=>{mx=e.clientX/w;my=e.clientY/h});addEventListener('pointerdown',e=>{ripples.push({x:e.clientX,y:e.clientY,t:0,max:rnd(190,120)});document.getElementById('readout').textContent='the tide noticed'});function sky(t){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#061124');g.addColorStop(.35,'#091b31');g.addColorStop(.68,'#071725');g.addColorStop(1,'#020611');x.fillStyle=g;x.fillRect(0,0,w,h);let moonX=w*.78,moonY=h*.19;x.save();x.shadowColor='rgba(210,235,255,.9)';x.shadowBlur=55;x.fillStyle='rgba(230,242,255,.96)';x.beginPath();x.arc(moonX,moonY,34,0,7);x.fill();x.restore();let mg=x.createRadialGradient(moonX,moonY,10,moonX,moonY,w*.48);mg.addColorStop(0,'rgba(160,210,255,.18)');mg.addColorStop(1,'rgba(160,210,255,0)');x.fillStyle=mg;x.fillRect(0,0,w,h);for(const s of stars){let a=.28+.5*Math.pow((Math.sin(t*s.tw+s.p)+1)/2,2);x.fillStyle=`rgba(220,245,255,${a})`;x.beginPath();x.arc(s.x+s.r*Math.sin(t*.05+s.p),s.y,s.r,0,7);x.fill()}}function horizon(t){x.fillStyle='rgba(180,235,255,.055)';for(let i=0;i<7;i++){let y=h*(.49+i*.03)+Math.sin(t*.18+i)*8;x.beginPath();x.ellipse(w*.5,y,w*(.62+i*.08),22+i*9,0,0,7);x.fill()}let fog=x.createLinearGradient(0,h*.42,0,h*.72);fog.addColorStop(0,'rgba(180,240,255,0)');fog.addColorStop(.45,'rgba(190,245,230,.12)');fog.addColorStop(1,'rgba(180,240,255,0)');x.fillStyle=fog;x.fillRect(0,h*.38,w,h*.34)}function waves(t){for(let layer=0;layer<7;layer++){let y0=h*(.53+layer*.055);x.strokeStyle=`rgba(${110+layer*18},230,${220+layer*4},${.08+layer*.025})`;x.lineWidth=1+layer*.45;x.beginPath();for(let i=0;i<=w;i+=7){let pull=(mx-.5)*(layer+1)*7;let y=y0+Math.sin(i*(.006+layer*.001)+t*(.55+layer*.09)+layer)*10+Math.sin(i*.017+t*.28)*3+pull;x.lineTo(i,y)}x.stroke()}}function biology(t){x.save();x.globalCompositeOperation='lighter';for(const cur of currents){let yy=cur.y+Math.sin(t*cur.s+cur.p)*22;x.strokeStyle=`rgba(80,255,220,${.05+.05*Math.sin(t+cur.p)})`;x.lineWidth=10;x.beginPath();x.moveTo(cur.x-cur.len*.5,yy);x.bezierCurveTo(cur.x-cur.len*.15,yy-25,cur.x+cur.len*.2,yy+35,cur.x+cur.len*.5,yy);x.stroke()}for(const p of motes){let px=(p.x+t*18*p.v+Math.sin(t*.4+p.p)*20)%w;let py=p.y+Math.sin(t+p.p)*12+Math.sin(px*.006+t)*8;let d=Math.hypot(px-mx*w,py-my*h);let glow=Math.max(0,1-d/190);let a=.12+glow*.75+.08*Math.sin(t*2+p.p);x.fillStyle=`hsla(${p.hue},95%,68%,${a})`;x.beginPath();x.arc(px,py,p.r+glow*4,0,7);x.fill()}for(const r of ripples){r.t+=.018;let rad=r.t*r.max;x.strokeStyle=`rgba(130,255,235,${Math.max(0,.55-r.t*.62)})`;x.lineWidth=1.5;x.beginPath();x.arc(r.x,r.y,rad,0,7);x.stroke()}ripples=ripples.filter(r=>r.t<1);x.restore()}function observatory(t){let ox=w*.18,oy=h*.54;let glow=x.createRadialGradient(ox,oy,0,ox,oy,95);glow.addColorStop(0,'rgba(255,202,105,.55)');glow.addColorStop(1,'rgba(255,202,105,0)');x.fillStyle=glow;x.fillRect(ox-120,oy-120,240,240);x.fillStyle='rgba(3,9,14,.88)';x.beginPath();x.moveTo(ox-62,oy+35);x.lineTo(ox-42,oy-4);x.lineTo(ox-14,oy-16);x.lineTo(ox+10,oy-48);x.lineTo(ox+30,oy-8);x.lineTo(ox+56,oy+35);x.closePath();x.fill();x.fillStyle=`rgba(255,210,115,${.7+.25*Math.sin(t*1.8)})`;x.beginPath();x.arc(ox+5,oy-8,5,0,7);x.fill()}function shore(t){x.fillStyle='rgba(218,229,218,.92)';x.beginPath();x.moveTo(0,h*.72);for(let i=0;i<=w;i+=18){let y=h*.7+Math.sin(i*.012+t*.42)*9+Math.sin(i*.029+t*.17)*5;x.lineTo(i,y)}x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fill();x.fillStyle='rgba(255,245,210,.18)';for(let i=0;i<w;i+=9){let y=h*.705+Math.sin(i*.012+t*.42)*9;x.fillRect(i,y,9,h-y)}}function draw(ms){let t=ms/1000;x.clearRect(0,0,w,h);sky(t);horizon(t);waves(t);biology(t);observatory(t);shore(t);requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></body></html>
