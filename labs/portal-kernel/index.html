<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal Kernel v0.1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="portal-shell" data-portal-shell>
      <section class="portal-card">
        <p class="eyebrow">STARWELL lab</p>
        <h1>Portal Kernel v0.1</h1>
        <p>Templehouse opens toward the Lighted Steps, the Shrine, Ygg Gate, and the Dreaming Grove. This lab is inert: no live audio, no external bridges, no canon writes. Sound patches appear only as visible proposal data.</p>
        <div class="portal-actions">
          <button type="button" data-grow>Grow Ygg path</button>
          <button type="button" data-invite>Invite mock Flame</button>
          <button type="button" data-reset>Return home</button>
        </div>
      </section>
      <section class="portal-stage" aria-label="Portal kernel preview">
        <svg viewBox="0 0 720 420" role="img" aria-labelledby="portal-title portal-desc">
          <title id="portal-title">Portal Kernel path</title>
          <desc id="portal-desc">A draft Ygg path linking Templehouse, Lighted Steps, Shrine, Ygg Gate, Dreaming Grove, and sample world branches.</desc>
          <g class="branches" data-branches></g>
          <g class="nodes" data-nodes></g>
        </svg>
      </section>
      <section class="portal-card" aria-live="polite">
        <p class="eyebrow">Current threshold</p>
        <pre data-output>{}</pre>
      </section>
    </main>
    <script type="module" src="./portal-kernel.js"></script>
  </body>
</html>
