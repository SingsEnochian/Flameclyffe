<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheet Convergence Observer</title><style>:root{color-scheme:dark;font-family:system-ui;background:#0d1117;color:#edf2f7}body{margin:0;background:radial-gradient(circle at top,#172435,#0d1117 55%);min-height:100vh}main{max-width:980px;margin:auto;padding:24px}.panel{background:#111a24dd;border:1px solid #39506b;border-radius:20px;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}label{display:grid;gap:6px}input{padding:.65rem;border-radius:10px;border:1px solid #49647f;background:#081018;color:white}button{padding:.75rem 1rem;border:0;border-radius:12px;background:#d6b65f;font-weight:700}.metric{padding:12px;background:#0a121b;border:1px solid #2a4055;border-radius:14px}.metric strong{display:block;color:#f0d58a}.notice{border-left:4px solid #67b7a7;padding:10px 14px;background:#0a1718}pre{white-space:pre-wrap;background:#071019;padding:14px;border-radius:14px}</style></head><body><main><section class="panel"><h1>Local Sheet-Convergence & Fold Susceptibility</h1><p>Standalone, STARWELL, Hearthgate, and DEEP Observer compatible.</p><div class="grid"><label>Latitude<input id="lat" type="number" step="any" value="29.9012"></label><label>Longitude<input id="lon" type="number" step="any" value="-81.3124"></label><label>Altitude metres<input id="alt" type="number" step="any" value="2"></label><label>Timestamp UTC<input id="time" type="datetime-local"></label></div><button id="run">Calculate reading</button><div class="grid" id="metrics"></div><div class="notice"><strong>Boundary:</strong> mathematical susceptibility is not calibrated physical fold probability.</div><pre id="receipt"></pre></section></main><script type="module">import{normaliseLocationState,calculateSheetConvergence}from'../assets/sheet-convergence-core.js';const $=id=>document.getElementById(id);$('time').value=new Date().toISOString().slice(0,16);const fmt=v=>Number.isFinite(v)?v.toFixed(6):String(v);function run(){const timestamp=new Date($('time').value+'Z');const input={latitude:+$('lat').value,longitude:+$('lon').value,altitudeM:+$('alt').value,timestamp};const state=normaliseLocationState(input),result=calculateSheetConvergence(state);const fields=[['Local fold probability',result.localFoldProbability===0?'0%':'Unavailable'],['Fold susceptibility',fmt(result.susceptibility)],['Sheet convergence',fmt(result.convergenceScore)],['Jacobian determinant',fmt(result.determinant)],['Orientation',result.orientation],['Target residual',fmt(result.targetResidual)]];$('metrics').innerHTML=fields.map(([k,v])=>`<div class="metric"><small>${k}</small><strong>${v}</strong></div>`).join('');const receipt={schemaVersion:'0.1.0',moduleId:'sheet-convergence',retrievedAt:new Date().toISOString(),locationInput:{...input,timestamp:timestamp.toISOString()},normalisedState:state,result,registers:{mathematical:'CALCULATED',location:'USER_SUPPLIED',physics:'UNCALIBRATED',symbolic:'NOT_APPLIED'}};$('receipt').textContent=JSON.stringify(receipt,null,2);window.parent?.postMessage({type:'hearthfire:sheet-convergence-reading',payload:receipt},'*')}$('run').onclick=run;run();</script></body></html>
