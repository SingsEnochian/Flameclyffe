function moonInfo(date=new Date()){const syn=29.530588853, known=Date.UTC(2000,0,6,18,14), days=(date.getTime()-known)/86400000, age=((days%syn)+syn)%syn, illum=(1-Math.cos(TAU*age/syn))/2*100;let name='New Moon';if(age<1.845)name='New Moon';else if(age<5.536)name='Waxing Crescent';else if(age<9.228)name='First Quarter';else if(age<12.919)name='Waxing Gibbous';else if(age<16.611)name='Full Moon';else if(age<20.302)name='Waning Gibbous';else if(age<23.994)name='Last Quarter';else if(age<27.684)name='Waning Crescent';return{age,illumination:Math.round(illum),name,glyph:MOON_GLYPHS[name]||'○'}}
function skyFromTime(date=new Date()){const h=date.getHours();if(h>=5&&h<8)return'Dawn';if(h>=8&&h<18)return'Day';if(h>=18&&h<21)return'Dusk';return'Night'}
function skyFromWeather(code,isDay){if([95,96,99].includes(code))return'Storm';if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return'Rain';return isDay===0?'Night':skyFromTime()}
function recomputeFromWeather(w={}){const kp=Number(D.kp||0), bz=Number(D.bz||0), cloud=Number(w.cloud_cover??D.cloud??0), precip=Number(w.precipitation??0), hum=Number(w.relative_humidity_2m??D.humidity??0), wind=Number(w.wind_speed_10m??D.wind??0), pressure=Number(w.pressure_msl??D.pressure??1013), isDay=Number(w.is_day??(skyFromTime()==='Day'?1:0));D.cloud=cloud;D.humidity=hum;D.wind=wind;D.pressure=pressure;D.temp=typeof w.temperature_2m==='number'?w.temperature_2m:D.temp;D.P=clamp(.48+(pressure-1013)/90+(isDay?.04:-.02));D.C=clamp(.66-cloud/210-precip/10+(kp<3?.07:-.04));D.R=clamp(.32+wind/60+Math.abs(bz)/50);D.E=clamp(.24+precip/8+hum/260+kp/14+(bz<0?Math.abs(bz)/40:0));D.A=clamp(.42+(isDay?.18:-.04)+(100-cloud)/260);D.dpdt=D.R;D.sky=skyFromWeather(Number(w.weather_code??0),isDay)}

function updateDerived(){if(!D.backend?.moon){const m=moonInfo();D.moonIllum=m.illumination;D.moonName=m.name}D.M=clamp(D.moonIllum/100);calcTheory(performance.now())}
function payload(reason='tick'){updateDerived();return{version:'deep-observer-state-v3',reason,field:{P:D.P,C:D.C,R:D.R,E:D.E,M:D.M,A:D.A,T:D.T,H:D.H,dpdt:D.dpdt},charge:D.charge,filters:{...FILTERS},entries:[{t:new Date().toISOString(),d:{location:D.location,locationSource:D.locationSource,timezone:D.timezone,localTime:new Date().toLocaleString(),sky:D.sky,weather:{temperature_2m:D.temp,humidity:D.humidity,cloud:D.cloud,pressure_msl:D.pressure,wind_speed_10m:D.wind},moon:{illumination:D.moonIllum,name:D.moonName,glyph:MOON_GLYPHS[D.moonName]||'○'},kp:D.kp,bz:D.bz,bt:D.bt,backendGeneratedAt:D.backend?.generated_at||null}}],theory:{T:D.T,H:D.H,posture:'observed/rendered, not proof'},source:'STARWELL glyph / DEEP Observer'}}

function applyBackend(data){D.backend=data;lastBackendLoad=new Date().toLocaleTimeString();if(data.field)Object.assign(D,Object.fromEntries(['P','C','R','E','M','A','T','H','dpdt'].filter(k=>typeof data.field[k]==='number').map(k=>[k,clamp(data.field[k])])));if(data.moon){D.moonIllum=Number(data.moon.illumination??D.moonIllum);D.moonName=data.moon.name||D.moonName}if(data.space_weather){D.kp=Number(data.space_weather.kp?.value??D.kp);D.bz=Number(data.space_weather.solar_wind?.bz??D.bz);D.bt=Number(data.space_weather.solar_wind?.bt??D.bt)}if(data.weather?.current){recomputeFromWeather(data.weather.current)}if(!D.location&&data.location){D.location={lat:data.location.lat,lon:data.location.lon,label:data.location.label};D.locationSource='backend-cache'}D.linked=true;publish('backend-cache');updateUI()}

function cacheLocation(pos,source='browser-geolocation'){const c=pos.coords||pos;D.location={lat:+c.latitude.toFixed(5),lon:+c.longitude.toFixed(5),accuracy:Math.round(c.accuracy||0)};D.locationSource=source;D.lastSync=new Date().toISOString();try{localStorage.setItem('deep_observer_location',JSON.stringify({location:D.location,source:D.locationSource,lastSync:D.lastSync,timezone:D.timezone}))}catch(e){}fetchLocalWeather(D.location.lat,D.location.lon).then(w=>{recomputeFromWeather(w.current||{});publish('location-weather-sync');updateUI()}).catch(()=>{publish('location-sync');updateUI()})}

function buildGeo(){geoNodes=[];geoEdges=[];for(let i=0;i<9;i++){const a=i/9*TAU-Math.PI/2,cur=Math.floor(i/3);geoNodes.push({x:Math.cos(a)*NINE_R,y:Math.sin(a)*NINE_R,cur,pulse:i*.7,speed:.0007+i*.00003,size:2.6+(cur===0?.7:cur===1?.55:.65),col:CURR_COL[cur]})}for(let i=0;i<6;i++){const a=i/6*TAU-Math.PI/2+Math.PI/6,cur=Math.floor(i/2)%3;geoNodes.push({x:Math.cos(a)*SIX_R,y:Math.sin(a)*SIX_R,cur,pulse:i*1.05,speed:.001+i*.00004,size:3.0,col:CURR_COL[cur]})}for(let i=0;i<3;i++){const a=i/3*TAU-Math.PI/2;geoNodes.push({x:Math.cos(a)*THREE_R,y:Math.sin(a)*THREE_R,cur:i,pulse:i*2.09,speed:.0015,size:4.4,col:CURR_COL[i]})}for(let i=0;i<9;i++){geoEdges.push([i,(i+1)%9],[i,(i+3)%9],[i,(i+4)%9])}for(let i=0;i<6;i++){geoEdges.push([9+i,9+(i+1)%6],[9+i,9+(i+2)%6])}for(let i=0;i<3;i++){geoEdges.push([9+i,9+i+3],[15+i,15+(i+1)%3])}for(let i=0;i<9;i++)geoEdges.push([i,9+Math.round(i*(6/9))%6]);for(let i=0;i<6;i++)geoEdges.push([9+i,15+geoNodes[9+i].cur]);const set=new Set(geoEdges.map(e=>Math.min(e[0],e[1])+'-'+Math.max(e[0],e[1])));geoEdges=[...set].map(k=>k.split('-').map(Number));edgeBurstPhase=geoEdges.map(()=>({phase:Math.random()*TAU,speed:.7+Math.random()*.8,dash:4+Math.random()*8,gap:6+Math.random()*14}))}
function drawRing(time){const T=FILTERS.theory?D.T:0,H=FILTERS.horizon?D.H:0;rc.clearRect(0,0,408,408);const R=197,p=.5+.5*Math.sin(time*.0007);rc.save();rc.translate(204,204);rc.rotate(time*(.0001+T*.000025+H*.000035));for(const rr of [R,R-5]){rc.beginPath();rc.arc(0,0,rr,0,TAU);rc.strokeStyle='rgba(190,180,125,'+((.06+p*.03+T*.025+H*.04)*BLOOM)+')';rc.lineWidth=.45+H*.35;rc.stroke()}for(let i=0;i<36;i++){const a=i/36*TAU,main=i%4===0,inner=R-(main?10:i%2===0?6:3);rc.beginPath();rc.moveTo(Math.cos(a)*(R+1),Math.sin(a)*(R+1));rc.lineTo(Math.cos(a)*inner,Math.sin(a)*inner);rc.strokeStyle='rgba(200,170,90,'+((main?.42+H*.06:.06)*BLOOM)+')';rc.lineWidth=main?1.1:.35;rc.stroke()}if(FILTERS.horizon)for(let i=0;i<9;i++){const q=(time*.00016+i*.23)%1,a=i/9*TAU-Math.PI/2+time*.00018,rr=R+2+q*9,x=Math.cos(a)*rr,y=Math.sin(a)*rr,g=rc.createRadialGradient(x,y,0,x,y,2+H*3);g.addColorStop(0,'rgba(190,210,255,'+((1-q)*(.08+H*.12)*BLOOM)+')');g.addColorStop(1,'rgba(190,210,255,0)');rc.beginPath();rc.arc(x,y,2+H*3,0,TAU);rc.fillStyle=g;rc.fill()}rc.restore()}
function drawField(time){fc.clearRect(0,0,380,380);if(!FILTERS.field)return;const t=time*.001,T=FILTERS.theory?D.T:0,H=FILTERS.horizon?D.H:0,breath=.92+D.P*.16+T*.015+H*.01,coh=clamp(.3+D.C*.7+T*.04),att=(.35+D.A*.55+T*.08+H*.05)*BLOOM;CURRENTS.forEach((cur,ci)=>{const [r,g,b]=cur.col;for(let k=0;k<6;k++){const age=(t*cur.freq*(32+T*4+H*3)+k*18)%100;if(age>80)continue;const prog=age/80,rr=[THREE_R,SIX_R,NINE_R][ci]*breath*(.36+prog*.95),alpha=att*(1-prog)*(1-prog)*(coh+.12);if(alpha<.008)continue;fc.beginPath();fc.arc(C,C,rr+Math.sin(t*3.7+ci+k)*.008*D.E*rr,0,TAU);fc.strokeStyle='rgba('+r+','+g+','+b+','+alpha+')';fc.lineWidth=1.0-prog*.55+T*.08+H*.06;fc.stroke()}});parts.forEach(p=>{const cur=CURRENTS[p.ci];p.angle+=p.speed*(.45+D.R*.9+T*.16+H*.10);const pr=p.target*breath*(1+Math.sin(t*cur.freq*2+p.phase)*.04),x=C+Math.cos(p.angle)*pr,y=C+Math.sin(p.angle)*pr,[r,g,b]=cur.col,gr=fc.createRadialGradient(x,y,0,x,y,p.size*(2.0+T*.7+H*.6));gr.addColorStop(0,'rgba('+r+','+g+','+b+','+(p.opacity*(.38+D.A*.28)*BLOOM)+')');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');fc.beginPath();fc.arc(x,y,p.size*(2.0+T*.7+H*.6),0,TAU);fc.fillStyle=gr;fc.fill()});if(Math.random()<.014+H*.004&&parts.length<24)spawnPart()}
function drawGeo(time){gc.clearRect(0,0,380,380);if(!FILTERS.geometry)return;const T=FILTERS.theory?D.T:0,H=FILTERS.horizon?D.H:0,breath=.92+D.P*.16+T*.015+H*.012,line=clamp(.30+D.C*.44+T*.10),pulse=.5+.5*Math.sin(time*(.0008+D.dpdt*.002)*1500);geoRot+=.00022*(.4+D.P*1.4);gc.save();gc.translate(C,C);gc.rotate(geoRot);if(FILTERS.horizon){gc.beginPath();gc.arc(0,0,NINE_R*breath*(1.22+H*.045),0,TAU);gc.strokeStyle='rgba(160,190,255,'+((.018+H*.07)*BLOOM)+')';gc.lineWidth=2+H*2.2;gc.stroke()}const scaled=geoNodes.map(n=>({...n,sx:n.x*breath,sy:n.y*breath}));geoEdges.forEach((e,i)=>{const a=scaled[e[0]],b=scaled[e[1]],bp=edgeBurstPhase[i],ca=a.col,cb=b.col,r=Math.round((ca[0]+cb[0])/2),g=Math.round((ca[1]+cb[1])/2),bl=Math.round((ca[2]+cb[2])/2),burst=.5+.5*Math.sin(time*.0012*bp.speed+bp.phase+T+H),alpha=line*(.05+burst*.13+T*.035+H*.035)*BLOOM,off=-((time*(.035+T*.01+H*.008)*bp.speed+bp.phase*30)%(bp.dash+bp.gap));gc.beginPath();gc.moveTo(a.sx,a.sy);gc.lineTo(b.sx,b.sy);gc.setLineDash([bp.dash,bp.gap]);gc.lineDashOffset=off;gc.strokeStyle='rgba('+r+','+g+','+bl+','+alpha+')';gc.lineWidth=.65+T*.08+H*.10;gc.stroke();gc.setLineDash([])});scaled.forEach(n=>{const np=.5+.5*Math.sin(time*n.speed+n.pulse+T+H),sz=n.size+np*1.5+T*.25+H*.22,[r,g,b]=n.col,gr=gc.createRadialGradient(n.sx,n.sy,0,n.sx,n.sy,sz*(2.6+T*.35+H*.35));gr.addColorStop(0,'rgba('+r+','+g+','+b+','+((.34+np*.18)*(.55+D.A*.45)*BLOOM)+')');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');gc.beginPath();gc.arc(n.sx,n.sy,sz*(2.6+T*.35+H*.35),0,TAU);gc.fillStyle=gr;gc.fill();gc.beginPath();gc.arc(n.sx,n.sy,sz*.72,0,TAU);gc.fillStyle='rgba('+Math.min(r+55,255)+','+Math.min(g+55,255)+','+Math.min(b+40,255)+',.72)';gc.fill()});const cg=gc.createRadialGradient(0,0,0,0,0,30+pulse*5+D.charge*5+T*3+H*4);cg.addColorStop(0,'rgba(255,248,220,.45)');cg.addColorStop(.25,'rgba(225,200,120,.12)');cg.addColorStop(1,'rgba(26,128,96,0)');gc.beginPath();gc.arc(0,0,30+pulse*5+D.charge*5+T*3+H*4,0,TAU);gc.fillStyle=cg;gc.fill();gc.restore()}
const MOONS=[{col:[136,152,200],r:10,a:145,b:46,sp:.00044,ph:0},{col:[106,148,90],r:14,a:163,b:52,sp:.00027,ph:2.09},{col:[210,200,175],r:22,a:184,b:60,sp:.00015,ph:4.19,ring:true},{col:[200,200,210],r:17,a:210,b:68,sp:.00009,ph:1.05,luna:true},{col:[60,120,180],r:26,a:238,b:78,sp:.000035,ph:3.3,earth:true}];
function drawMoons(time){mc.clearRect(0,0,380,380);if(!FILTERS.moons&&!FILTERS.earth)return;const ms=.82+D.moonIllum/100*.22;MOONS.forEach(m=>{if(m.earth&&!FILTERS.earth)return;if(!m.earth&&!FILTERS.moons)return;const [r,g,b]=m.col,ang=time*m.sp+m.ph,mx=C+Math.cos(ang)*m.a*ms*.5,my=C+Math.sin(ang)*m.b*ms*.5,mz=Math.sin(ang),sz=m.r*(.88+mz*.12)*ms,op=(m.earth?.24+mz*.08:.48+mz*.18)*BLOOM;mc.save();mc.translate(C,C);if(m.earth)mc.setLineDash([3,6]);mc.beginPath();mc.ellipse(0,0,m.a*ms*.5,m.b*ms*.5,0,0,TAU);mc.strokeStyle='rgba('+r+','+g+','+b+','+(m.earth?.04:.035)+')';mc.stroke();mc.setLineDash([]);mc.restore();if(m.ring){mc.save();mc.translate(mx,my);mc.rotate(.18);mc.beginPath();mc.ellipse(0,0,sz*2.3,sz*.58,0,0,TAU);mc.strokeStyle='rgba('+r+','+g+','+b+','+(op*.7)+')';mc.lineWidth=2;mc.stroke();mc.restore()}const gr=mc.createRadialGradient(mx,my,0,mx,my,sz*2.1);gr.addColorStop(0,'rgba('+r+','+g+','+b+','+op+')');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');mc.beginPath();mc.arc(mx,my,sz*2.1,0,TAU);mc.fillStyle=gr;mc.fill();mc.beginPath();mc.arc(mx,my,sz*.72,0,TAU);mc.fillStyle='rgba('+r+','+g+','+b+','+(op*1.4)+')';mc.fill()})}
function drawTop(){tc.clearRect(0,0,380,380);const [sr,sg,sb]=SKY_TINT[D.sky]||SKY_TINT.Night,gr=tc.createRadialGradient(C,C,0,C,C,C);gr.addColorStop(0,'rgba('+sr+','+sg+','+sb+','+(.018+D.A*.010)+')');gr.addColorStop(1,'rgba('+sr+','+sg+','+sb+',0)');tc.beginPath();tc.arc(C,C,C,0,TAU);tc.fillStyle=gr;tc.fill();for(let i=ripples.length-1;i>=0;i--){const rp=ripples[i];rp.r+=rp.sp;const prog=rp.r/rp.max,alpha=rp.op*(1-prog)*(1-prog)*BLOOM;if(alpha<.004){ripples.splice(i,1);continue}tc.beginPath();tc.arc(rp.x,rp.y,rp.r,0,TAU);tc.strokeStyle='rgba('+rp.col.join(',')+','+alpha+')';tc.lineWidth=1.1;tc.stroke()}}
function spawnPart(){const ci=Math.floor(Math.random()*3),cur=CURRENTS[ci],target=[THREE_R,SIX_R,NINE_R][ci]+(Math.random()-.5)*20;parts.push({ci,angle:Math.random()*TAU,target,speed:(.005+D.R*.008)*(Math.random()>.5?1:-1)*cur.freq*.35,size:1+Math.random()*1.3,opacity:.25+Math.random()*.55,phase:Math.random()*TAU})}
function onTouch(ev){const rect=topC.getBoundingClientRect(),scale=topC.width/rect.width,x=((ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left)*scale,y=((ev.touches?ev.touches[0].clientY:ev.clientY)-rect.top)*scale;if(Math.hypot(x-C,y-C)>C)return;D.charge=clamp(D.charge+.08);ripples.push({x,y,r:0,max:60+Math.random()*22,sp:1.6,op:.55,col:[220,200,130]});publish('sigil-touch')}
function loop(time){drawRing(time);drawField(time);drawGeo(time);drawMoons(time);drawTop();D.charge*=.997;if(time-lastPublish>15000){publish('interval');lastPublish=time}requestAnimationFrame(loop)}
function boot(){buildStars();buildGeo();for(let i=0;i<16;i++)spawnPart();initFilters();loadCachedLocation();pollShared();loadBackend();setInterval(loadBackend,600000);setInterval(pollShared,8000);setInterval(()=>{if(!D.backend?.weather?.current?.weather_code)D.sky=skyFromTime();updateUI()},1000);topC.addEventListener('mousedown',onTouch);topC.addEventListener('touchstart',e=>{e.preventDefault();onTouch(e)},{passive:false});updateUI();publish('boot');requestAnimationFrame(loop)}
window.DEEP_OBSERVER={getState:()=>payload('api-get'),publish,syncLocation,setFilter,applyDeepState:applyDeep,loadBackend,emit:event=>{try{const list=JSON.parse(localStorage.getItem('deep_observer_event_buffer')||'[]');list.push({t:Date.now(),event});localStorage.setItem('deep_observer_event_buffer',JSON.stringify(list.slice(-80)));window.dispatchEvent(new CustomEvent('deep-observer-emit',{detail:event}))}catch(e){}}};
boot();
