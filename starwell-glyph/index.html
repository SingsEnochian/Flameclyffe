function buildGeo(){geoNodes=[];geoEdges=[];for(let i=0;i<9;i++){const a=i/9*TAU-Math.PI/2,cur=Math.floor(i/3);geoNodes.push({x:Math.cos(a)*NINE_R,y:Math.sin(a)*NINE_R,layer:9,cur,pulse:i*.698,pulseSpeed:.0007+i*.00003,size:3+(cur===0?1.2:cur===1?.8:1),col:CURR_COL[cur]})}for(let i=0;i<6;i++){const a=i/6*TAU-Math.PI/2+Math.PI/6,cur=Math.floor(i/2)%3;geoNodes.push({x:Math.cos(a)*SIX_R,y:Math.sin(a)*SIX_R,layer:6,cur,pulse:i*1.047,pulseSpeed:.001+i*.00004,size:3.5,col:CURR_COL[cur]})}for(let i=0;i<3;i++){const a=i/3*TAU-Math.PI/2;geoNodes.push({x:Math.cos(a)*THREE_R,y:Math.sin(a)*THREE_R,layer:3,cur:i,pulse:i*2.094,pulseSpeed:.0015,size:5.5,col:CURR_COL[i]})}for(let i=0;i<9;i++){geoEdges.push({a:i,b:(i+1)%9},{a:i,b:(i+3)%9},{a:i,b:(i+4)%9})}const n6=9,n3=15;for(let i=0;i<6;i++){geoEdges.push({a:n6+i,b:n6+(i+1)%6},{a:n6+i,b:n6+(i+2)%6})}for(let i=0;i<3;i++){geoEdges.push({a:n6+i,b:n6+i+3},{a:n3+i,b:n3+(i+1)%3})}for(let i=0;i<9;i++)geoEdges.push({a:i,b:n6+Math.round(i*(6/9))%6});for(let i=0;i<6;i++)geoEdges.push({a:n6+i,b:n3+geoNodes[n6+i].cur});const es=new Set(geoEdges.map(e=>Math.min(e.a,e.b)+'-'+Math.max(e.a,e.b)));geoEdges=[...es].map(k=>{const [a,b]=k.split('-').map(Number);return{a,b}}).filter(e=>e.a!==e.b);edgeBurstPhase=geoEdges.map(()=>({phase:Math.random()*TAU,speed:.7+Math.random()*.8,dashLen:4+Math.random()*8,gapLen:6+Math.random()*14}))}

ath.min(b+50,255)+','+(alpha*2.55)+')');lg.addColorStop(1,'rgba('+r+','+g+','+b+','+(alpha*1.8)+')');gc.beginPath();gc.moveTo(na.sx,na.sy);gc.lineTo(nb.sx,nb.sy);gc.setLineDash([bp.dashLen,bp.gapLen]);gc.lineDashOffset=off;gc.strokeStyle=lg;gc.lineWidth=.9+T*.2+H*.25;gc.stroke();gc.setLineDash([])});scaled.forEach((n,i)=>{const np=Math.sin(time*n.pulseSpeed+n.pulse+T+H)*.5+.5,sz=n.size+np*2.5+T*.6+H*.45,[r,g,b]=n.col,lunar=(i%3===Math.round(D.M*3)%3)?D.M*.3:0,gr=gc.createRadialGradient(n.sx,n.sy,0,n.sx,n.sy,sz*(5+T+H));gr.addColorStop(0,'rgba('+r+','+g+','+b+','+((.45+np*.3)*glowMult+lunar+T*.08+H*.06)+')');gr.addColorStop(.5,'rgba('+r+','+g+','+b+','+(.06*np+T*.02+H*.02)+')');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');gc.beginPath();gc.arc(n.sx,n.sy,sz*(5+T*.5+H*.5),0,TAU);gc.fillStyle=gr;gc.fill();gc.beginPath();gc.arc(n.sx,n.sy,sz,0,TAU);gc.fillStyle='rgba('+Math.min(r+55,255)+','+Math.min(g+55,255)+','+Math.min(b+40,255)+','+(.8+np*.2)+')';gc.fill()});[52,32,18,9,3].forEach((rad,i)=>{const cols=[[80,90,170],[26,128,96],[190,155,80],[225,200,120],[255,248,220]],aas=[.04,.1,.28,.65,.92],cg=gc.createRadialGradient(0,0,0,0,0,rad+pulse*(i<2?12:4)+D.charge*8+T*6+H*8);cg.addColorStop(0,'rgba('+cols[i].join(',')+','+(aas[i]+pulse*.05+D.charge*.07+T*.04+H*.05)+')');cg.addColorStop(1,'rgba('+cols[i].join(',')+',0)');gc.beginPath();gc.arc(0,0,rad+pulse*(i<2?12:4)+D.charge*8+T*6+H*8,0,TAU);gc.fillStyle=cg;gc.fill()});gc.beginPath();gc.arc(0,0,2+T*1.1+H*1.2,0,TAU);gc.fillStyle='rgba(255,250,230,.96)';gc.fill();if(bzD>.05&&Math.random()<bzD*.008){const n=geoNodes[Math.floor(Math.random()*geoNodes.length)];if(n&&!n._dist){n._dist=bzD*8;n._da=Math.random()*TAU;n._dd=.88}}geoNodes.forEach(n=>{if(n._dist){n.x+=Math.cos(n._da)*n._dist*.15;n.y+=Math.sin(n._da)*n._dist*.15;n._dist*=n._dd;if(Math.abs(n._dist)<.01)delete n._dist}});gc.restore();updateUI()}
let parts=[];function spawnPart(){const ci=Math.floor(Math.random()*3),cur=CURRENTS[ci],r=[THREE_R,SIX_R,NINE_R][ci]+(Math.random()-.5)*20;parts.push({ci,angle:Math.random()*TAU,targetR:r,speed:(.006+D.R*.012)*(Math.random()>.5?1:-1)*cur.freq*.35,size:1.2+Math.random()*2,opacity:.3+Math.random()*.7,phase:Math.random()*TAU})}function initParts(){parts=[];for(let i=0;i<18;i++)spawnPart()}function drawField(time){if(!FILTERS.field){fc.clearRect(0,0,FW,FW);return}const T=visualT(time),H=visualH(time);fc.clearRect(0,0,FW,FW);const t=time*.001,breath=.92+D.P*.16+T*.02+H*.015,coh=clamp(.3+D.C*.7+T*.06),attention=.5+D.A*.8+T*.12+H*.08,pulse=.0008+D.dpdt*.002;CURRENTS.forEach((cur,ci)=>{const [r,g,b]=cur.col;for(let k=0;k<7;k++){const age=(t*cur.freq*(38+T*6+H*4)+k*16)%100;if(age>80)continue;const prog=age/80,base=[THREE_R,SIX_R,NINE_R][ci]*breath,rr=base*(.3+prog*1.1),alpha=attention*(1-prog)*(1-prog)*(coh+.15)*(.45+Math.sin(t*pulse*1500+cur.phase)*.25);if(alpha<.01)continue;fc.beginPath();fc.arc(FCX,FCY,rr+Math.sin(t*3.7+ci*1.2+k)*.012*D.E*rr,0,TAU);fc.strokeStyle='rgba('+r+','+g+','+b+','+alpha+')';fc.lineWidth=1.4-prog*.8+T*.18+H*.12;fc.stroke()}});parts.forEach(p=>{const cur=CURRENTS[p.ci];p.angle+=p.speed*(.5+D.R*1.2+T*.25+H*.18)*(1+D.P*.5);const pr=p.targetR*breath*(1+Math.sin(t*cur.freq*2+p.phase)*.06),x=FCX+Math.cos(p.angle)*pr,y=FCY+Math.sin(p.angle)*pr,[r,g,b]=cur.col,gr=fc.createRadialGradient(x,y,0,x,y,p.size*(3.5+T+H));gr.addColorStop(0,'rgba('+r+','+g+','+b+','+(p.opacity*(.6+D.A*.5+T*.2+H*.15))+')');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');fc.beginPath();fc.arc(x,y,p.size*(3.5+T+H),0,TAU);fc.fillStyle=gr;fc.fill()});if(Math.random()<.02+T*.008+H*.006&&parts.length<30)spawnPart()}
const MOONS=[{name:'Nysa',col:[136,152,200],r:10,oA:145,oB:46,sp:.00044,ph:0},{name:'Sylva',col:[106,148,90],r:14,oA:163,oB:52,sp:.00027,ph:2.09},{name:'Aurelia',col:[210,200,175],r:22,oA:184,oB:60,sp:.00015,ph:4.19,ring:true},{name:'Luna',col:[200,200,210],r:17,oA:210,oB:68,sp:.00009,ph:1.05,luna:true},{name:'Earth',col:[60,120,180],r:28,oA:238,oB:78,sp:.000035,ph:3.3,earth:true}];let moonRot=0;function drawMoons(time){mc.clearRect(0,0,380,380);if(!FILTERS.moons&&!FILTERS.earth)return;const T=visualT(time),H=visualH(time),C=190,ms=.82+D.moonIllum/100*.22+T*.015+H*.015;moonRot+=.00007;MOONS.forEach(m=>{if(m.earth&&!FILTERS.earth)return;if(!m.earth&&!FILTERS.moons)return;const [r,g,b]=m.col,ang=time*m.sp+m.ph,mx=C+Math.cos(ang+moonRot)*m.oA*ms*.5,my=C+Math.sin(ang+moonRot)*m.oB*ms*.5,mz=Math.sin(ang+moonRot),sz=m.r*(.88+mz*.12)*ms,op=m.earth?.3+mz*.1:.6+mz*.25;mc.save();mc.translate(C,C);mc.rotate(moonRot);if(m.earth)mc.setLineDash([3,6]);mc.beginPath();mc.ellipse(0,0,m.oA*ms*.5,m.oB*ms*.5,0,0,TAU);mc.strokeStyle='rgba('+r+','+g+','+b+','+(m.earth?.08:m.luna?.08:.05+D.M*.03+T*.01+H*.01)+')';mc.lineWidth=m.luna?.5:.4;mc.stroke();mc.setLineDash([]);mc.restore();if(m.ring){mc.save();mc.translate(mx,my);mc.rotate(.18);mc.beginPath();mc.ellipse(0,0,sz*2.6,sz*.65,0,0,TAU);mc.strokeStyle='rgba('+r+','+g+','+b+','+(op*.35+T*.03+H*.03)+')';mc.lineWidth=3;mc.stroke();mc.restore()}const mg=mc.createRadialGradient(mx,my,0,mx,my,sz*3.5);mg.addColorStop(0,'rgba('+r+','+g+','+b+','+(m.earth?op*.18:op*.3+T*.02+H*.02)+')');mg.addColorStop(1,'rgba('+r+','+g+','+b+',0)');mc.beginPath();mc.arc(mx,my,sz*3.5,0,TAU);mc.fillStyle=mg;mc.fill();const md=mc.createRadialGradient(mx-sz*.25,my-sz*.25,0,mx,my,sz);md.addColorStop(0,'rgba('+Math.min(r+45,255)+','+Math.min(g+45,255)+','+Math.min(b+45,255)+','+(op*.9)+')');md.addColorStop(.7,'rgba('+r+','+g+','+b+','+(op*.8)+')');md.addColorStop(1,'rgba('+Math.max(r-25,0)+','+Math.max(g-25,0)+','+Math.max(b-25,0)+','+(op*.6)+')');mc.beginPath();mc.arc const ripples=[];function drawTop(time){tc.clearRect(0,0,380,380);const T=visualT(time),H=visualH(time),C=190;if(D.linked){const [sr,sg,sb]=SKY_TINT[D.sky]||SKY_TINT.Night,tg=tc.createRadialGradient(C,C,0,C,C,C);tg.addColorStop(0,'rgba('+sr+','+sg+','+sb+','+(.04*(.6+D.A*.5+T*.18+H*.12))+')');tg.addColorStop(1,'rgba('+sr+','+sg+','+sb+',0)');tc.beginPath();tc.arc(C,C,C,0,TAU);tc.fillStyle=tg;tc.fill()}for(let i=ripples.length-1;i>=0;i--){const rp=ripples[i];rp.r+=rp.sp;const prog=rp.r/rp.maxR,alpha=rp.op*(1-prog)*(1-prog);if(alpha<.004){ripples.splice(i,1);continue}tc.beginPath();tc.arc(rp.x,rp.y,rp.r,0,TAU);tc.strokeStyle='rgba('+rp.col.join(',')+','+alpha+')';tc.lineWidth=1.5;tc.stroke()}}
function onTouch(cx,cy){const rect=topC.getBoundingClientRect(),scale=topC.width/rect.width,x=(cx-rect.left)*scale,y=(cy-rect.top)*scale,C=190;if(Math.hypot(x-C,y-C)>C)return;const bs=.92+D.P*.16;let closest=CURRENTS[0],minD=9999;CURRENTS.forEach((c,i)=>{const angle=i/3*TAU-Math.PI/2+geoRot,nx=C+Math.cos(angle)*THREE_R*bs,ny=C+Math.sin(angle)*THREE_R*bs,d=Math.hypot(x-nx,y-ny);if(d<minD){minD=d;closest=c}});D.charge=clamp(D.charge+.08);ripples.push({x,y,r:0,maxR:70+Math.random()*30,sp:1.8,op:.65,col:closest.col});setTimeout(()=>ripples.push({x,y,r:0,maxR:40,sp:2.4,op:.35,col:closest.col}),70);geoNodes.forEach(n=>{const dist=Math.hypot(n.x*bs-(x-C),n.y*bs-(y-C));if(dist<100){n._dist=(1-dist/100)*9;n._da=Math.atan2(n.y-(y-C),n.x-(x-C));n._dd=.88}});try{window.DEEP_OBSERVER&&window.DEEP_OBSERVER.emit({type:'sigil_press',realm:'starwell-369-horizon',x:x-C,y:y-C,xNorm:x/topC.width,yNorm:y/topC.height,timestamp:Date.now(),T:D.T,H:D.H,filters:{...FILTERS},layer:'3-6-9-theory-horizon'})}catch(e){}}
topC.addEventListener('mousedown',e=>onTouch(e.clientX,e.clientY));topC.addEventListener('touchstart',e=>{e.preventDefault();onTouch(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
function loop(time){drawBg(time);drawRing(time);drawField(time);drawGeo(time);drawMoons(time);drawTop(time);D.charge*=.997;requestAnimationFrame(loop)}
