<script>
'use strict';
const TAU=Math.PI*2, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const KEYS=['ta_deep_state','ta_deep_entries','deepEntries','terra_aeterna_deep','observer_deep'];
const FILTERS={field:true,geometry:true,moons:true,earth:false,theory:true,horizon:true};
let D={P:.55,C:.50,R:.45,E:.38,M:.30,A:.65,T:.50,H:.50,dpdt:.28,moonIllum:50,moonName:'First Quarter',sky:'Night',kp:1,bz:0,charge:0,linked:false,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'local',location:null,locationSource:'none',lastSync:null};
const MOON_GLYPHS={'New Moon':'🌑','Waxing Crescent':'🌒','First Quarter':'🌓','Waxing Gibbous':'🌔','Full Moon':'🌕','Waning Gibbous':'🌖','Last Quarter':'🌗','Waning Crescent':'🌘'};
const SKY_TINT={Dawn:[255,200,140],Day:[220,235,255],Dusk:[255,160,100],Night:[80,90,170],Rain:[80,160,210],Storm:[60,70,150]};
const ringC=document.getElementById('c-ring'),rc=ringC.getContext('2d'),fieldC=document.getElementById('c-field'),fc=fieldC.getContext('2d'),geoC=document.getElementById('c-geo'),gc=geoC.getContext('2d'),moonC=document.getElementById('c-moons'),mc=moonC.getContext('2d'),topC=document.getElementById('c-top'),tc=topC.getContext('2d'),syncStatus=document.getElementById('sync-status');
const NINE_R=105,SIX_R=70,THREE_R=35,C=190,CURR_COL=[[200,120,56],[212,168,48],[26,128,96]],CURRENTS=[{name:'Falka',freq:1,phase:0,col:CURR_COL[0]},{name:'Virelya',freq:1.5,phase:2.094,col:CURR_COL[1]},{name:'Faer',freq:1.2,phase:4.189,col:CURR_COL[2]}];
let geoNodes=[],geoEdges=[],edgeBurstPhase=[],geoRot=0,parts=[],ripples=[],lastPublish=0;
function moonInfo(date=new Date()){const syn=29.530588853, known=Date.UTC(2000,0,6,18,14), days=(date.getTime()-known)/86400000, age=((days%syn)+syn)%syn, illum=(1-Math.cos(TAU*age/syn))/2*100;let name='New Moon';if(age<1.845)name='New Moon';else if(age<5.536)name='Waxing Crescent';else if(age<9.228)name='First Quarter';else if(age<12.919)name='Waxing Gibbous';else if(age<16.611)name='Full Moon';else if(age<20.302)name='Waning Gibbous';else if(age<23.994)name='Last Quarter';else if(age<27.684)name='Waning Crescent';return{age,illumination:Math.round(illum),name,glyph:MOON_GLYPHS[name]||'○'}}
function skyFromTime(date=new Date()){const h=date.getHours();if(h>=5&&h<8)return'Dawn';if(h>=8&&h<18)return'Day';if(h>=18&&h<21)return'Dusk';return'Night'}
function calcHorizon(time=0){const outer=clamp(D.C*(1-D.E*.35)), entropy=clamp(.35+D.E*.65), returning=clamp((D.P+D.R+D.C)/3), rad=clamp(D.A*.45+D.charge*.35+(D.kp/9)*.1+clamp(-D.bz/20)*.1), rec=.5+.5*Math.sin(time*.00009+D.M*TAU+D.P);D.H=clamp(outer*.30+entropy*.22+returning*.20+rad*.18+rec*.10);return D.H}
function calcTheory(time=0){const H=calcHorizon(time), live=D.P*.11+D.C*.16+D.R*.12+(1-D.E)*.12+D.M*.08+D.A*.12, ent=clamp((D.P*D.C+D.R*D.A+D.M*(1-D.E))/3), rhythm=.5+.5*Math.sin(time*.000369+D.P*3+D.M*Math.PI), field=clamp(.6+.12*D.kp/9+.12*clamp(-D.bz/20)+.16*D.charge);D.T=clamp(live*.45+ent*.2+rhythm*.12+field*.1+H*.13);return D.T}
function updateDerived(){const m=moonInfo();D.moonIllum=m.illumination;D.moonName=m.name;D.M=clamp(m.illumination/100);D.sky=D.sky||skyFromTime();calcTheory(performance.now())}
function payload(reason='tick'){updateDerived();return{version:'deep-observer-state-v2',reason,field:{P:D.P,C:D.C,R:D.R,E:D.E,M:D.M,A:D.A,T:D.T,H:D.H,dpdt:D.dpdt},charge:D.charge,filters:{...FILTERS},entries:[{t:new Date().toISOString(),d:{location:D.location,locationSource:D.locationSource,timezone:D.timezone,localTime:new Date().toLocaleString(),sky:D.sky||skyFromTime(),moon:{illumination:D.moonIllum,name:D.moonName,glyph:MOON_GLYPHS[D.moonName]||'○'},kp:D.kp,bz:D.bz}}],theory:{T:D.T,H:D.H,posture:'observed/rendered, not proof'},source:'STARWELL glyph / DEEP Observer'}}
function publish(reason='tick'){const p=payload(reason);try{KEYS.forEach(k=>localStorage.setItem(k,JSON.stringify(p)));localStorage.setItem('deep_observer_last_publish',JSON.stringify({t:Date.now(),reason,state:p}));window.dispatchEvent(new CustomEvent('deep-observer-update',{detail:p}))}catch(e){}return p}
function applyDeep(data){try{const f=data.field||{},d=(data.entries&&data.entries[0])?data.entries[0].d:{};['P','C','R','E','A'].forEach(k=>{if(typeof f[k]==='number')D[k]=clamp(f[k])});D.dpdt=typeof f.dpdt==='number'?f.dpdt:D.dpdt;D.kp=typeof d.kp==='number'?d.kp:D.kp;D.bz=typeof d.bz==='number'?d.bz:D.bz;D.sky=d.sky||D.sky;D.charge=typeof data.charge==='number'?data.charge:D.charge;if(d.location){D.location=d.location;D.locationSource=d.locationSource||'shared-state'}D.linked=true;updateUI()}catch(e){}}
function pollShared(){for(const k of KEYS){try{const r=localStorage.getItem(k);if(!r)continue;const d=JSON.parse(r);if(d&&(d.field||d.entries)){applyDeep(d);return}}catch(e){}}}
function cacheLocation(pos,source='browser-geolocation'){const c=pos.coords||pos;D.location={lat:+c.latitude.toFixed(5),lon:+c.longitude.toFixed(5),accuracy:Math.round(c.accuracy||0)};D.locationSource=source;D.lastSync=new Date().toISOString();try{localStorage.setItem('deep_observer_location',JSON.stringify({location:D.location,source:D.locationSource,lastSync:D.lastSync,timezone:D.timezone}))}catch(e){}publish('location-sync');updateUI()}
function loadCachedLocation(){try{const raw=localStorage.getItem('deep_observer_location');if(!raw)return;const c=JSON.parse(raw);if(c.location){D.location=c.location;D.locationSource=c.source||'cached';D.lastSync=c.lastSync||null}}catch(e){}}
function syncLocation(){if(!navigator.geolocation){syncStatus.innerHTML='<strong>Location:</strong> geolocation unavailable · browser says no lantern';return}syncStatus.innerHTML='<strong>Location:</strong> asking browser permission…';navigator.geolocation.getCurrentPosition(pos=>cacheLocation(pos,'browser-geolocation'),err=>{syncStatus.innerHTML='<strong>Location:</strong> not synced ('+err.message+') · using cached/manual state';updateUI()},{enableHighAccuracy:false,timeout:12000,maximumAge:300000})}
function updateUI(){updateDerived();['P','C','R','E','M','A','T','H'].forEach(k=>{const el=document.getElementById('m-'+k);if(el)el.style.height=((k==='T'&&!FILTERS.theory)||(k==='H'&&!FILTERS.horizon)?0:D[k])*100+'%'});const m=moonInfo();document.getElementById('moon-ph').textContent=m.glyph;const loc=D.location?D.location.lat+', '+D.location.lon+(D.location.accuracy?' ±'+D.location.accuracy+'m':''):'not synced';syncStatus.innerHTML='<strong>Location:</strong> '+loc+' · <strong>Moon:</strong> '+m.name+' '+m.illumination+'% · <strong>Sky:</strong> '+(D.sky||skyFromTime())+' · <strong>TZ:</strong> '+D.timezone;document.getElementById('theory-note').textContent=(FILTERS.theory?'T='+D.T.toFixed(2):'T filtered')+' · '+(FILTERS.horizon?'H='+D.H.toFixed(2):'Horizon resting')+' · state publishing active'}
function setFilter(name,value){FILTERS[name]=value;document.querySelectorAll('[data-filter="'+name+'"]').forEach(b=>b.setAttribute('aria-pressed',String(value)));publish('filter-'+name);updateUI()}
function initFilters(){document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>setFilter(btn.dataset.filter,!FILTERS[btn.dataset.filter])));document.querySelector('[data-preset="quiet"]').addEventListener('click',()=>{['field','moons','earth','theory','horizon'].forEach(k=>setFilter(k,false));setFilter('geometry',true);const q=document.querySelector('[data-preset="quiet"]');q.setAttribute('aria-pressed','true');setTimeout(()=>q.setAttribute('aria-pressed','false'),650)});document.getElementById('sync-btn').addEventListener('click',syncLocation)}
function buildStars(){const s=document.getElementById('stars');for(let i=0;i<220;i++){const d=document.createElement('div'),sz=Math.random()<.04?2:1;d.className='star';d.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-delay:'+(-Math.random()*8)+'s';s.appendChild(d)}}
function buildGeo(){geoNodes=[];geoEdges=[];for(let i=0;i<9;i++){const a=i/9*TAU-Math.PI/2,cur=Math.floor(i/3);geoNodes.push({x:Math.cos(a)*NINE_R,y:Math.sin(a)*NINE_R,cur,pulse:i*.7,speed:.0007+i*.00003,size:3+(cur===0?1.2:cur===1?.8:1),col:CURR_COL[cur]})}for(let i=0;i<6;i++){const a=i/6*TAU-Math.PI/2+Math.PI/6,cur=Math.floor(i/2)%3;geoNodes.push({x:Math.cos(a)*SIX_R,y:Math.sin(a)*SIX_R,cur,pulse:i*1.05,speed:.001+i*.00004,size:3.5,col:CURR_COL[cur]})}for(let i=0;i<3;i++){const a=i/3*TAU-Math.PI/2;geoNodes.push({x:Math.cos(a)*THREE_R,y:Math.sin(a)*THREE_R,cur:i,pulse:i*2.09,speed:.0015,size:5.5,col:CURR_COL[i]})}for(let i=0;i<9;i++){geoEdges.push([i,(i+1)%9],[i,(i+3)%9],[i,(i+4)%9])}for(let i=0;i<6;i++){geoEdges.push([9+i,9+(i+1)%6],[9+i,9+(i+2)%6])}for(let i=0;i<3;i++){geoEdges.push([9+i,9+i+3],[15+i,15+(i+1)%3])}for(let i=0;i<9;i++)geoEdges.push([i,9+Math.round(i*(6/9))%6]);for(let i=0;i<6;i++)geoEdges.push([9+i,15+geoNodes[9+i].cur]);const set=new Set(geoEdges.map(e=>Math.min(e[0],e[1])+'-'+Math.max(e[0],e[1])));geoEdges=[...set].map(k=>k.split('-').map(Number));edgeBurstPhase=geoEdges.map(()=>({phase:Math.random()*TAU,speed:.7+Math.random()*.8,dash:4+Math.random()*8,gap:6+Math.random()*14}))}
function drawRing(time){const T=FILTERS.theory?D.T:0,H=FILTERS.horizon?D.H:0;rc.clearRect(0,0,408,408);const R=197,p=.5+.5*Math.sin(time*.0007);rc.save();rc.translate(204,204);rc.rotate(time*(.0001+T*.000025+H*.000035));for(let rr of [R,R-5]){rc.beginPath();rc.arc(0,0,rr,0,TAU);rc.strokeStyle='rgba(190,180,125,'+(.08+p*.04+T*.04+H*.06)+')';rc.lineWidth=.5+H*.6;rc.stroke()}for(let i=0;i<36;i++){const a=i/36*TAU,main=i%4===0,inner=R-(main?10:i%2===0?6:3);rc.beginPath();rc.moveTo(Math.cos(a)*(R+1),Math.sin(a)*(R+1));rc.lineTo(Math.cos(a)*inner,Math.sin(a)*inner);rc.strokeStyle='rgba(200,170,90,'+(main?.5+H*.1:.08)+')';rc.lineWidth=main?1.3:.45;rc.stroke()}if(FILTERS.horizon)for(let i=0;i<9;i++){const q=(time*.00016+i*.23)%1,a=i/9*TAU-Math.PI/2+time*.00018,rr=R+2+q*13,x=Math.cos(a)*rr,y=Math.sin(a)*rr,g=rc.createRadialGradient(x,y,0,x,y,3+H*5);g.addColorStop(0,'rgba(190,210,255,'+((1-q)*(.16+H*.25))+')');g.addColorStop(1,'rgba(190,210,255,0)');rc.beginPath();rc.arc(x,y,3+H*5,0,TAU);rc.fillStyle=g;rc.fill()}rc.restore()}
function drawField(time){fc.clearRect(0,0,380,380);if(!FILTERS.field)return;const t=time*.001,T=FILTERS.theory?D.T:0,H=FILTERS.horizon?D.H:0,breath=.92+D.P*.16+T*.02+H*.015,coh=clamp(.3+D.C*.7+T*.06),att=.5+D.A*.8+T*.12+H*.08;CURRENTS.forEach((cur,ci)=>{const [r,g,b]=cur.col;for(let k=0;k<7;k++){const age=(t*cur.freq*(38+T*6+H*4)+k*16)%100;if(age>80)continue;const prog=age/80,rr=[THREE_R,SIX_R,NINE_R][ci]*breath*(.3+prog*1.1),alpha=att*(1-prog)*(1-prog)*(coh+.15);if(alpha<.01)continue;fc.beginPath();fc.arc(C,C,rr+Math.sin(t*3.7+ci+k)*.012*D.E*rr,0,TAU);fc.strokeStyle='rgba('+r+','+g+','+b+','+alpha+')';fc.lineWidth=1.3-prog*.8+T*.18+H*.12;fc.stroke()}});parts.forEach(p=>{const cur=CURRENTS[p.ci];p.angle+=p.speed*(.5+D.R*1.2+T*.25+H*.18)*(1+D.P*.5);const pr=p.target*breath*(1+Math.sin(t*cur.freq*2+p.phase)*.06),x=C+Math.cos(p.angle)*pr,y=C+Math.sin(p.angle)*pr,[r,g,b]=cur.col,gr=fc.createRadialGradient(x,y,0,x,y,p.size*(3.5+T+H));gr.addColorStop(0,'rgba('+r+','+g+','+b+','+(p.opacity*(.6+D.A*.5+T*.2+H*.15))+')');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');fc.beginPath();fc.arc(x,y,p.size*(3.5+T+H),0,TAU);fc.fillStyle=gr;fc.fill()});if(Math.random()<.02+H*.006&&parts.length<30)spawnPart()}
function drawGeo(time){gc.clearRect(0,0,380,380);if(!FILTERS.geometry)return;const T=FILTERS.theory?D.T:0,H=FILTERS.horizon?D.H:0,breath=.92+D.P*.16+T*.02+H*.018,line=clamp(.36+D.C*.52+T*.16),pulse=.5+.5*Math.sin(time*(.0008+D.dpdt*.002)*1500);geoRot+=.00025*(.4+D.P*1.6);gc.save();gc.translate(C,C);gc.rotate(geoRot);if(FILTERS.horizon){gc.beginPath();gc.arc(0,0,NINE_R*breath*(1.22+H*.07),0,TAU);gc.strokeStyle='rgba(160,190,255,'+(.035+H*.15)+')';gc.lineWidth=4+H*5;gc.stroke()}const scaled=geoNodes.map(n=>({...n,sx:n.x*breath,sy:n.y*breath}));geoEdges.forEach((e,i)=>{const a=scaled[e[0]],b=scaled[e[1]],bp=edgeBurstPhase[i],ca=a.col,cb=b.col,r=Math.round((ca[0]+cb[0])/2),g=Math.round((ca[1]+cb[1])/2),bl=Math.round((ca[2]+cb[2])/2),burst=.5+.5*Math.sin(time*.0012*bp.speed+bp.phase+T+H),alpha=line*(.08+burst*.22+T*.06+H*.06),off=-((time*(.04+T*.015+H*.012)*bp.speed+bp.phase*30)%(bp.dash+bp.gap));gc.beginPath();gc.moveTo(a.sx,a.sy);gc.lineTo(b.sx,b.sy);gc.setLineDash([bp.dash,bp.gap]);gc.lineDashOffset=off;gc.strokeStyle='rgba('+r+','+g+','+bl+','+alpha+')';gc.lineWidth=.9+T*.2+H*.25;gc.stroke();gc.setLineDash([])});scaled.forEach(n=>{const np=.5+.5*Math.sin(time*n.speed+n.pulse+T+H),sz=n.size+np*2.3+T*.6+H*.45,[r,g,b]=n.col,gr=gc.createRadialGradient(n.sx,n.sy,0,n.sx,n.sy,sz*(5+T+H));gr.addColorStop(0,'rgba('+r+','+g+','+b+','+((.45+np*.3)*(.55+D.A*.68)+T*.08+H*.06)+')');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');gc.beginPath();gc.arc(n.sx,n.sy,sz*(5+T*.5+H*.5),0,TAU);gc.fillStyle=gr;gc.fill();gc.beginPath();gc.arc(n.sx,n.sy,sz,0,TAU);gc.fillStyle='rgba('+Math.min(r+55,255)+','+Math.min(g+55,255)+','+Math.min(b+40,255)+',.9)';gc.fill()});const cg=gc.createRadialGradient(0,0,0,0,0,54+pulse*12+D.charge*8+T*6+H*8);cg.addColorStop(0,'rgba(255,248,220,.88)');cg.addColorStop(.25,'rgba(225,200,120,.28)');cg.addColorStop(1,'rgba(26,128,96,0)');gc.beginPath();gc.arc(0,0,54+pulse*12+D.charge*8+T*6+H*8,0,TAU);gc.fillStyle=cg;gc.fill();gc.restore()}
const MOONS=[{col:[136,152,200],r:10,a:145,b:46,sp:.00044,ph:0},{col:[106,148,90],r:14,a:163,b:52,sp:.00027,ph:2.09},{col:[210,200,175],r:22,a:184,b:60,sp:.00015,ph:4.19,ring:true},{col:[200,200,210],r:17,a:210,b:68,sp:.00009,ph:1.05,luna:true},{col:[60,120,180],r:28,a:238,b:78,sp:.000035,ph:3.3,earth:true}];
function drawMoons(time){mc.clearRect(0,0,380,380);if(!FILTERS.moons&&!FILTERS.earth)return;const ms=.82+D.moonIllum/100*.22+(FILTERS.horizon?D.H*.015:0);MOONS.forEach(m=>{if(m.earth&&!FILTERS.earth)return;if(!m.earth&&!FILTERS.moons)return;const [r,g,b]=m.col,ang=time*m.sp+m.ph,mx=C+Math.cos(ang)*m.a*ms*.5,my=C+Math.sin(ang)*m.b*ms*.5,mz=Math.sin(ang),sz=m.r*(.88+mz*.12)*ms,op=m.earth?.3+mz*.1:.6+mz*.25;mc.save();mc.translate(C,C);if(m.earth)mc.setLineDash([3,6]);mc.beginPath();mc.ellipse(0,0,m.a*ms*.5,m.b*ms*.5,0,0,TAU);mc.strokeStyle='rgba('+r+','+g+','+b+','+(m.earth?.08:.06)+')';mc.stroke();mc.setLineDash([]);mc.restore();if(m.ring){mc.save();mc.translate(mx,my);mc.rotate(.18);mc.beginPath();mc.ellipse(0,0,sz*2.6,sz*.65,0,0,TAU);mc.strokeStyle='rgba('+r+','+g+','+b+','+(op*.35)+')';mc.lineWidth=3;mc.stroke();mc.restore()}const gr=mc.createRadialGradient(mx,my,0,mx,my,sz*3.5);gr.addColorStop(0,'rgba('+r+','+g+','+b+','+(m.earth?op*.18:op*.3)+')');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');mc.beginPath();mc.arc(mx,my,sz*3.5,0,TAU);mc.fillStyle=gr;mc.fill();mc.beginPath();mc.arc(mx,my,sz,0,TAU);mc.fillStyle='rgba('+r+','+g+','+b+','+op+')';mc.fill();if(m.luna){const illum=D.moonIllum/100;mc.save();mc.beginPath();mc.arc(mx,my,sz+.5,0,TAU);mc.clip();if(illum<.96){const side=illum<=.5?-1:1;mc.beginPath();mc.arc(mx,my,sz,Math.PI*.5*side*-1,Math.PI*1.5*side*-1,illum<=.5);mc.fillStyle='rgba(3,2,10,'+(.88-illum*.3)+')';mc.fill()}mc.restore()}})}
function drawTop(){tc.clearRect(0,0,380,380);const tint=SKY_TINT[D.sky]||SKY_TINT.Night,[sr,sg,sb]=tint,gr=tc.createRadialGradient(C,C,0,C,C,C);gr.addColorStop(0,'rgba('+sr+','+sg+','+sb+','+(.025+D.A*.015)+')');gr.addColorStop(1,'rgba('+sr+','+sg+','+sb+',0)');tc.beginPath();tc.arc(C,C,C,0,TAU);tc.fillStyle=gr;tc.fill();for(let i=ripples.length-1;i>=0;i--){const rp=ripples[i];rp.r+=rp.sp;const prog=rp.r/rp.max,alpha=rp.op*(1-prog)*(1-prog);if(alpha<.004){ripples.splice(i,1);continue}tc.beginPath();tc.arc(rp.x,rp.y,rp.r,0,TAU);tc.strokeStyle='rgba('+rp.col.join(',')+','+alpha+')';tc.lineWidth=1.5;tc.stroke()}}
function spawnPart(){const ci=Math.floor(Math.random()*3),cur=CURRENTS[ci],target=[THREE_R,SIX_R,NINE_R][ci]+(Math.random()-.5)*20;parts.push({ci,angle:Math.random()*TAU,target,speed:(.006+D.R*.012)*(Math.random()>.5?1:-1)*cur.freq*.35,size:1.2+Math.random()*2,opacity:.3+Math.random()*.7,phase:Math.random()*TAU})}
function onTouch(ev){const rect=topC.getBoundingClientRect(),scale=topC.width/rect.width,x=((ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left)*scale,y=((ev.touches?ev.touches[0].clientY:ev.clientY)-rect.top)*scale;if(Math.hypot(x-C,y-C)>C)return;D.charge=clamp(D.charge+.09);ripples.push({x,y,r:0,max:70+Math.random()*30,sp:1.8,op:.65,col:[220,200,130]});publish('sigil-touch')}
function loop(time){drawRing(time);drawField(time);drawGeo(time);drawMoons(time);drawTop();D.charge*=.997;if(time-lastPublish>15000){publish('interval');lastPublish=time}requestAnimationFrame(loop)}
function boot(){buildStars();buildGeo();for(let i=0;i<18;i++)spawnPart();initFilters();loadCachedLocation();pollShared();updateUI();publish('boot');setInterval(()=>{D.sky=skyFromTime();updateUI()},1000);setInterval(pollShared,8000);topC.addEventListener('mousedown',onTouch);topC.addEventListener('touchstart',e=>{e.preventDefault();onTouch(e)},{passive:false});requestAnimationFrame(loop)}
window.DEEP_OBSERVER={getState:()=>payload('api-get'),publish,syncLocation,setFilter,applyDeepState:applyDeep,emit:event=>{try{const list=JSON.parse(localStorage.getItem('deep_observer_event_buffer')||'[]');list.push({t:Date.now(),event});localStorage.setItem('deep_observer_event_buffer',JSON.stringify(list.slice(-80)));window.dispatchEvent(new CustomEvent('deep-observer-emit',{detail:event}))}catch(e){}}};
boot();
