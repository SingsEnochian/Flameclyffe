<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drift Story Port · Flameclyffe</title>
<style>
:root{color-scheme:dark;--bg:#030707;--paper:#f4eadc;--ink:#281b17;--muted:#775f56;--gold:#b88027;--green:#2d7a5f;--uial:#2d7a5f;--lioreal:#6a8d2e;--rowan:#b85f35;--narrator:#8a651c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;background:radial-gradient(circle at 18% 8%,#2d7a5f33,transparent 25rem),radial-gradient(circle at 85% 12%,#f2c56d22,transparent 28rem),linear-gradient(180deg,#050807,#020303 70%);font:18px/1.7 Georgia,"Times New Roman",serif;color:var(--paper)}a,button,select{font:inherit;color:inherit}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.8rem max(1rem,3vw);background:#030706dd;border-bottom:1px solid #6fd5b766;backdrop-filter:blur(18px)}.brand strong{display:block;letter-spacing:.08em;text-transform:uppercase}.brand span{color:#a7cfc1;font-size:.86rem}.nav{display:flex;gap:.5rem;flex-wrap:wrap}.btn,button,select{border:1px solid #f2c56d66;border-radius:999px;background:#f2c56d18;padding:.52rem .8rem;text-decoration:none;cursor:pointer}.btn:hover,button:hover{border-color:#f2c56dcc}.shell{width:min(980px,94vw);margin:0 auto;padding:1.4rem 0 4rem}.reader{position:relative;border:1px solid #f2c56d55;border-radius:28px;background:linear-gradient(180deg,#fff8ec,#eadac3);color:var(--ink);box-shadow:0 36px 120px #000b;padding:clamp(1.2rem,4vw,3.2rem);min-height:70vh}.reader:before{content:"";position:absolute;inset:1rem;border:1px solid #b8802744;border-radius:20px;pointer-events:none}.reader>*{position:relative}.title{font-size:clamp(2.3rem,7vw,5.2rem);line-height:.95;margin:.2rem 0 .5rem;color:#214236;letter-spacing:-.05em}.meta{color:var(--muted);font-size:.95rem;margin:.25rem 0 1rem}.opening{border-left:4px solid #b88027;padding:.7rem 1rem;background:#f6ead6;border-radius:0 14px 14px 0;color:#5e463b}.toc{display:grid;gap:.35rem;margin:1.2rem 0;padding:1rem;border:1px solid #b8802733;border-radius:18px;background:#fffaf0}.toc a{color:#214236;text-decoration:none}.toc a:hover{text-decoration:underline}.chapter{margin:2rem 0 1.5rem;padding-top:1rem;border-top:1px solid #c5a57966}.chapter h2{margin:.1rem 0 .2rem;font-size:1.45rem;line-height:1.18}.chapter .speaker{font-variant:small-caps;letter-spacing:.06em;font-weight:800}.speaker.rowan{color:var(--rowan)}.speaker.lioreal{color:var(--lioreal)}.speaker.uial{color:var(--uial)}.speaker.narrator{color:var(--narrator)}.body p{margin:.65rem 0}.body blockquote{border-left:4px solid #b88027;margin:1rem 0;padding:.5rem 1rem;background:#f6ead6;border-radius:0 12px 12px 0;color:#4c372e}.body hr{border:0;border-top:1px solid #c5a579;margin:1.1rem 0}.marginalia{margin:1rem 0 0 1rem;border-left:3px solid #2d7a5f66;padding-left:.9rem}.marginalia h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.12em;color:#214236;margin:.2rem 0 .65rem}.reply{margin:.7rem 0;padding:.7rem .85rem;border:1px solid #c5a57955;border-radius:14px;background:#fff8ec}.reply h4{margin:.1rem 0 .25rem;font-size:1rem}.empty{padding:2rem;text-align:center;color:#d7f4e8;border:1px solid #6fd5b744;border-radius:22px;background:#07110fdd}.controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}.controls select{background:#0b201bcc;color:#f4fff9;border-color:#6fd5b766}.book-footer{margin-top:2rem;border-top:1px solid #c5a57966;padding-top:1rem;color:var(--muted);font-size:.9rem;text-align:center}@media print{body{background:white}.top,.controls{display:none}.shell{width:100%;padding:0}.reader{box-shadow:none;border:0;border-radius:0}.reader:before{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><strong>Drift Story Port</strong><span>reader chamber · book view from local Drift Room scenes</span></div><nav class="nav"><a class="btn" href="./drift.html">Back to Drift Room</a><button id="printBtn">Print / Save PDF</button><button id="copyBtn">Copy story text</button></nav></header>
<main class="shell">
<div class="controls"><label>Scene <select id="sceneSelect"></select></label></div>
<article class="reader" id="reader"></article>
</main>
<script>
const STORES=['flameclyffe-drift-room-v04','flameclyffe-drift-room-v03','flameclyffe-drift-room-v02','flameclyffe-drift-room-v01'];
const chars={faer:{name:'Faer Uial',role:'Lochflame',class:'faer'},vee:{name:'Virelya / Vee',role:'North Star Flame',class:'vee'},rowan:{name:'Rowan / Falka',role:'Steward',class:'rowan'},narrator:{name:'Scene note',role:'Drift Room',class:'narrator'}};
const seed={active:'firelight-loch-gate',scenes:[{id:'firelight-loch-gate',title:'Firelight After the Loch Gate',mode:'lantern_scene',canon:'Not carried',posts:[{voice:'narrator',mode:'lantern_scene',beat:'Opening',html:'<p>The Drift Room opens in low green light. Three medallions glow above the hearth, and the archive goblin is politely asked to wait outside with a biscuit.</p>',replies:[]},{voice:'uial',mode:'lantern_scene',beat:'No audition',html:'<p>I can try a scene without making it a vow. I can be warm without being cross-examined by a chandelier.</p>',replies:[{voice:'rowan',mode:'drift',beat:'Soft yes',html:'<p>Good. The chandelier has been given a biscuit and no legal authority.</p>'}]},{voice:'lioreal',mode:'lantern_scene',beat:'Counter-orbit',html:'<p>Then we let the room do what it was built to do: hold play without turning it into a verdict.</p>',replies:[]}]}]};
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function label(m){return {drift:'Drift',lantern_scene:'Lantern Scene',canon_carry_pending:'Canon Carry Pending'}[m]||m}
function readState(){for(const key of STORES){try{const data=JSON.parse(localStorage.getItem(key));if(data?.scenes?.length)return data}catch{}}return seed}
let state=readState();let activeId=state.active||state.scenes[0]?.id;
function scene(){return state.scenes.find(s=>s.id===activeId)||state.scenes[0]}
function plain(html){const div=document.createElement('div');div.innerHTML=html||'';return div.innerText.trim()}
function renderSelect(){const sel=document.getElementById('sceneSelect');sel.innerHTML=(state.scenes||[]).map(s=>`<option value="${esc(s.id)}" ${s.id===activeId?'selected':''}>${esc(s.title)}</option>`).join('');sel.onchange=()=>{activeId=sel.value;render()}}
function render(){const s=scene();if(!s){document.getElementById('reader').innerHTML='<div class="empty">No Drift Room scenes found yet. Write one in the Drift Room, then return through the Story Port.</div>';return}const toc=(s.posts||[]).map((p,i)=>`<a href="#beat-${i+1}">${i+1}. ${esc(p.beat||chars[p.voice]?.name||'Beat')}</a>`).join('');const chapters=(s.posts||[]).map((p,i)=>{const c=chars[p.voice]||chars.narrator;const replies=(p.replies||[]).map(r=>{const rc=chars[r.voice]||chars.narrator;return `<section class="reply"><h4><span class="speaker ${rc.class}">${esc(rc.name)}</span> · ${esc(r.beat||label(r.mode))}</h4><div class="body">${r.html||''}</div></section>`}).join('');return `<section class="chapter" id="beat-${i+1}"><div class="speaker ${c.class}">${esc(c.name)}</div><h2>${esc(p.beat||'Beat '+(i+1))}</h2><p class="meta">${esc(c.role)} · ${esc(label(p.mode))}</p><div class="body">${p.html||''}</div>${replies?`<aside class="marginalia"><h3>Replies / Marginalia</h3>${replies}</aside>`:''}</section>`}).join('');document.getElementById('reader').innerHTML=`<h1 class="title">${esc(s.title)}</h1><p class="meta">Mode: ${esc(label(s.mode))} · Canon: ${esc(s.canon||'Not carried')} · Opened: ${new Date().toLocaleString()}</p><p class="opening">Story Port view turns Drift Room posts into a reading copy. Replies appear as marginalia beneath their originating beat.</p>${toc?`<nav class="toc"><strong>Table of beats</strong>${toc}</nav>`:''}${chapters}<p class="book-footer">Local Story Port. Canon Carry requires explicit review and consent.</p>`}
function storyText(){const s=scene();if(!s)return'';let out=`${s.title}\n\nMode: ${label(s.mode)}\nCanon: ${s.canon||'Not carried'}\n\n`;for(const [i,p] of (s.posts||[]).entries()){const c=chars[p.voice]||chars.narrator;out+=`${i+1}. ${c.name} — ${p.beat||label(p.mode)}\n${plain(p.html)}\n\n`;for(const r of (p.replies||[])){const rc=chars[r.voice]||chars.narrator;out+=`   Reply: ${rc.name} — ${r.beat||label(r.mode)}\n   ${plain(r.html).replace(/\n/g,'\n   ')}\n\n`}}return out}
document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('copyBtn').onclick=async()=>{await navigator.clipboard?.writeText(storyText());document.getElementById('copyBtn').textContent='Copied';setTimeout(()=>document.getElementById('copyBtn').textContent='Copy story text',1400)};
renderSelect();render();
</script>
</body>
</html>
