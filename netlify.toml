[build]
  command = "npm ci --ignore-scripts --no-audit --no-fund && npm run contracts:verify && node --test apps/starwell/test/mathSpineV18.test.js apps/starwell/test/case000Braid.test.js apps/starwell/test/kelyranGaldrBuild.test.js && npm run starwell:build"
  publish = "dist/starwell"

[build.environment]
  NODE_VERSION = "24"
  NPM_VERSION = "11"
  STARWELL_BASE = "/"

[functions]
  directory = "netlify/functions"

[build.processing]
  skip_processing = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), geolocation=(self), accelerometer=(self), gyroscope=(self)"

[[redirects]]
  from = "/starwell/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/api/v1/residents/tesla/chat"
  to = "/.netlify/functions/tesla-chat"
  status = 200

[[redirects]]
  from = "/templehouse/tesla-observatory"
  to = "/templehouse/tesla-observatory.html"
  status = 200

[[redirects]]
  from = "/templehouse/tesla-observatory/"
  to = "/templehouse/tesla-observatory.html"
  status = 200

[[redirects]]
  from = "/living-room"
  to = "/living-room.html"
  status = 200

[[redirects]]
  from = "/living-room/"
  to = "/living-room.html"
  status = 200
