[build]
  command = "npm run starwell:build"
  publish = "apps/starwell/dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/living-room"
  to = "/living-room.html"
  status = 200

[[redirects]]
  from = "/living-room/"
  to = "/living-room.html"
  status = 200
