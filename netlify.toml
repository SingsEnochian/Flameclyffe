[build]
  command = "npm run starwell:build"
  publish = "dist/starwell"

[build.environment]
  NODE_VERSION = "24"
  AWS_LAMBDA_JS_RUNTIME = "nodejs24.x"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/v1/residents/tesla/chat"
  to = "/.netlify/functions/tesla-chat"
  status = 200

[[redirects]]
  from = "/templehouse/tesla-observatory"
  to = "/templehouse/tesla-observatory.html"
  status = 200

[[redirects]]
  from = "/templehouse/tesla-observatory/"
  to = "/templehouse/tesla-observatory.html"
  status = 200

[[redirects]]
  from = "/living-room"
  to = "/living-room.html"
  status = 200

[[redirects]]
  from = "/living-room/"
  to = "/living-room.html"
  status = 200
