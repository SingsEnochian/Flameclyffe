name: House Test Flight

on:
  push:
    branches:
      - rarity/return-engine-v0-1
    paths:
      - apps/agent-workspace/**
      - apps/arcsweep/src/return-engine.js
      - apps/arcsweep/test/agent-workspace-*.test.js
      - apps/arcsweep/test/return-engine.test.js
      - profiles/crow-trainer/**
      - scripts/agent-workspace-browser-check.mjs
      - .github/workflows/house-test-flight.yml
  pull_request:
    paths:
      - apps/agent-workspace/**
      - apps/arcsweep/src/return-engine.js
      - apps/arcsweep/test/agent-workspace-*.test.js
      - apps/arcsweep/test/return-engine.test.js
      - profiles/crow-trainer/**
      - scripts/agent-workspace-browser-check.mjs
      - .github/workflows/house-test-flight.yml

permissions:
  contents: read

concurrency:
  group: house-test-flight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Parse workspace flight modules
        run: |
          node --check apps/agent-workspace/app.js
          node --check apps/agent-workspace/chat.js
          node --check apps/agent-workspace/connection-doctor.js
          node --check apps/agent-workspace/refractive-glass-three.js
          node --check apps/agent-workspace/return-engine-ui.js

      - name: Compile Hermes connection doctor
        run: python3 -m py_compile profiles/crow-trainer/scripts/connection_doctor.py

      - name: Execute Return Engine + workspace flight contracts
        run: |
          node --test             apps/arcsweep/test/return-engine.test.js             apps/arcsweep/test/agent-workspace-os.test.js             apps/arcsweep/test/agent-workspace-chat.test.js             apps/arcsweep/test/agent-workspace-test-flight.test.js

  browser-flight:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install flight browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Fly desktop iPad phone and Return crossing
        run: node scripts/agent-workspace-browser-check.mjs

      - name: Upload flight receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-test-flight-${{ github.sha }}
          path: artifacts/agent-workspace-browser
          if-no-files-found: warn
          retention-days: 14
