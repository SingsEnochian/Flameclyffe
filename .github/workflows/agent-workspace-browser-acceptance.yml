name: House Workspace Browser Acceptance

on:
  push:
    branches:
      - rarity/agent-workspace-os-v0-1
      - main
    paths:
      - apps/agent-workspace/**
      - scripts/agent-workspace-browser-check.mjs
      - .github/workflows/agent-workspace-browser-acceptance.yml
  pull_request:
    paths:
      - apps/agent-workspace/**
      - scripts/agent-workspace-browser-check.mjs
      - .github/workflows/agent-workspace-browser-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-workspace-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run responsive House Workspace acceptance
        run: node scripts/agent-workspace-browser-check.mjs

      - name: Upload browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-workspace-browser-${{ github.sha }}
          path: artifacts/agent-workspace-browser
          if-no-files-found: warn
          retention-days: 14
