name: Ox Alpha Secret Bridge Probe

on:
  push:
    branches:
      - ops/oxalpha-secret-bridge-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HFTOKEN: ${{ secrets.HFTOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          node <<'NODE'
          const names = ['HFTOKEN', 'HF_TOKEN', 'SUPABASE_ACCESS_TOKEN', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_DB_PASSWORD'];
          const result = Object.fromEntries(names.map((name) => [name, Boolean(String(process.env[name] || '').trim())]));
          console.log(JSON.stringify(result));
          if (!(result.HFTOKEN || result.HF_TOKEN)) console.log('OA_BRIDGE_BLOCKER=HF_SECRET_MISSING');
          if (!result.SUPABASE_ACCESS_TOKEN) console.log('OA_BRIDGE_BLOCKER=SUPABASE_MANAGEMENT_SECRET_MISSING');
          NODE
