name: ML Lab

on:
  push:
    paths:
      - 'ml-lab/**'
      - '.github/workflows/ml-lab.yml'
  pull_request:
    paths:
      - 'ml-lab/**'
      - '.github/workflows/ml-lab.yml'

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ml-lab/pyproject.toml

      - name: Install laboratory and service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './ml-lab[dev,service]'

      - name: Lint
        run: ruff check ml-lab
        continue-on-error: true

      - name: Type check
        run: mypy ml-lab/src

      - name: Test
        working-directory: ml-lab
        run: pytest --cov=flameclyffe_ml --cov-report=term-missing

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: ml-lab/.coverage
          retention-days: 7
