name: Hearthgate Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/starwell-server/**"
      - "apps/starwell/**"
      - "starwell/deep-observer/schemas/**"
      - "config/engine-name-authority.json"
      - "scripts/deny-stale-engine-contracts.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/hearthgate-windows-installer.yml"
  push:
    branches:
      - main
    tags:
      - "hearthgate-v*"
    paths:
      - "apps/starwell-server/**"
      - "apps/starwell/**"
      - "starwell/deep-observer/schemas/**"
      - "config/engine-name-authority.json"
      - "scripts/deny-stale-engine-contracts.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/hearthgate-windows-installer.yml"

permissions:
  contents: write

concurrency:
  group: hearthgate-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build Windows x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    defaults:
      run:
        working-directory: apps/starwell-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/starwell-server/package-lock.json

      - name: Verify Node and npm contract
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $nodeMajor = [int]((node --version).TrimStart('v').Split('.')[0])
          $npmMajor = [int]((npm --version).Split('.')[0])
          if ($nodeMajor -ne 24) {
            throw "Expected Node 24, received $(node --version)."
          }
          if ($npmMajor -ne 11) {
            throw "Expected npm 11, received $(npm --version)."
          }
          node --version
          npm --version

      - name: Install locked STARWELL dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deny stale engine and naming contracts
        working-directory: ${{ github.workspace }}
        run: npm run contracts:verify

      - name: Test and build packaged STARWELL framework
        working-directory: ${{ github.workspace }}
        env:
          STARWELL_BASE: /starwell/
        run: |
          npm run starwell:test
          npm run starwell:build

      - name: Install locked Hearthgate dependencies
        run: npm ci

      - name: Test local security boundary
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Stage STARWELL inside Hearthgate
        run: npm run stage:starwell

      - name: Prepare deterministic installer assets
        run: npm run prepare:assets

      - name: Run packaging preflight
        run: npm run check:packaging

      - name: Build unsigned NSIS installer
        run: npm run electron:build:win

      - name: Verify installer and compression-release package
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -Path "dist-electron" -Filter "Hearthgate-Setup-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Hearthgate installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small: $($installer.Length) bytes."
          }

          $resourcesRoot = "dist-electron/win-unpacked/resources"
          $asar = "$resourcesRoot/app.asar"
          $unpackedRoot = "$resourcesRoot/app.asar.unpacked"
          $starwellRoot = "$unpackedRoot/public/starwell"
          $required = @(
            $asar,
            "$starwellRoot/index.html",
            "$starwellRoot/glyph-studio/index.html",
            "$starwellRoot/arcsweep-continuity/index.html",
            "$starwellRoot/world-tone-approval/index.html",
            "$starwellRoot/modules/bifrost-arcsweep.module.json",
            "$starwellRoot/schemas/premaq-state-v2.schema.json",
            "$starwellRoot/schemas/bifrost-temporal-state-v1.schema.json",
            "$starwellRoot/schemas/world-tone-approval.schema.json",
            "$starwellRoot/schemas/ipad-somatic-haptic-receipt.schema.json",
            "$unpackedRoot/server-secure.js",
            "$unpackedRoot/security/local-boundary.js",
            "$unpackedRoot/fontforge/server.js"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Packaged installer is missing required Hearthgate file: $path"
            }
          }

          foreach ($page in @(
            @{ Name = "STARWELL"; Path = "$starwellRoot/index.html" },
            @{ Name = "Glyph Studio"; Path = "$starwellRoot/glyph-studio/index.html" },
            @{ Name = "Arcsweep"; Path = "$starwellRoot/arcsweep-continuity/index.html" }
          )) {
            $html = Get-Content -Raw -Path $page.Path
            if (-not $html.Contains('/starwell/')) {
              throw "Packaged $($page.Name) entry does not use the /starwell/ asset base."
            }
          }

          $somaticHtml = Get-Content -Raw -Path "$starwellRoot/world-tone-approval/index.html"
          if (-not $somaticHtml.Contains('ROWAN APPROVAL GATE')) {
            throw "Packaged somatic gate does not expose Rowan's persistent approval action."
          }

          $secureServerSource = Get-Content -Raw -Path "$unpackedRoot/server-secure.js"
          $securityBoundarySource = Get-Content -Raw -Path "$unpackedRoot/security/local-boundary.js"
          if (-not $secureServerSource.Contains('127.0.0.1')) {
            throw "Packaged core server does not enforce loopback binding."
          }
          if (-not $securityBoundarySource.Contains('HEARTHGATE_ORIGIN_DENIED')) {
            throw "Packaged local-origin boundary is missing."
          }

          $manifest = Get-Content -Raw -Path "$starwellRoot/modules/bifrost-arcsweep.module.json" | ConvertFrom-Json
          if ($manifest.moduleId -ne 'bifrost-arcsweep') {
            throw "Packaged Bifröst manifest has the wrong moduleId."
          }
          if ($manifest.engine.formalism -ne 'temporal-compression-release-state-machine') {
            throw "Packaged Bifröst manifest does not execute the compression-release formalism."
          }
          if ($manifest.engine.physicalClaim -ne $false) {
            throw "Packaged Bifröst manifest violates the physical-claim boundary."
          }
          if ($manifest.authorityContract.collapseExists -ne $false) {
            throw "Packaged Bifröst manifest reintroduces collapse."
          }
          if ($manifest.authorityContract.releaseFeedsNextCompression -ne $true) {
            throw "Packaged Bifröst manifest breaks compression of the release."
          }
          if ($manifest.authorityContract.toneApproval -ne 'rowan-human-calibration-owner') {
            throw "Packaged Bifröst manifest removes Rowan tone-approval authority."
          }
          if ($manifest.installContract.verifySomaticRoute -ne 'world-tone-approval/index.html') {
            throw "Packaged Bifröst manifest omits the somatic approval route."
          }

          $somaticSchema = Get-Content -Raw -Path "$starwellRoot/schemas/ipad-somatic-haptic-receipt.schema.json" | ConvertFrom-Json
          if ($somaticSchema.title -ne 'Hearthgate iPad Somatic Haptic Receipts') {
            throw "Packaged iPad somatic receipt schema is invalid."
          }

          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Set-Content -Path "dist-electron/SHA256SUMS.txt" -Encoding ascii

          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_bytes=$($installer.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_sha256=$($hash.Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          @"
          ## Hearthgate Windows installer

          - Node: ``$(node --version)``
          - npm: ``$(npm --version)``
          - File: ``$($installer.Name)``
          - Size: $([math]::Round($installer.Length / 1MB, 2)) MB
          - SHA-256: ``$($hash.Hash)``
          - Formalism: compression → release → compression of the release
          - Somatic gate: packaged and Rowan-owned
          - Naming authority: Rowan, fail-closed
          - Security: loopback-only services and restricted origins
          - Signing: unsigned development build
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer artefact
        uses: actions/upload-artifact@v7
        with:
          name: hearthgate-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 21
          path: |
            apps/starwell-server/dist-electron/Hearthgate-Setup-*.exe
            apps/starwell-server/dist-electron/*.blockmap
            apps/starwell-server/dist-electron/latest*.yml
            apps/starwell-server/dist-electron/SHA256SUMS.txt

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/hearthgate-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_NAME: ${{ steps.verify.outputs.installer_name }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            "dist-electron/$($env:INSTALLER_NAME)",
            "dist-electron/SHA256SUMS.txt"
          )
          $files += @(Get-ChildItem -Path "dist-electron" -Filter "*.blockmap" -File | ForEach-Object { $_.FullName })

          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Hearthgate $tag" --generate-notes
          }
