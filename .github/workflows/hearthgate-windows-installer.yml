name: Hearthgate Windows Installer
run-name: Hearthgate Windows · ${{ github.event.pull_request.head.sha || github.sha }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/starwell-server/**"
      - "apps/starwell/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hearthgate-windows-installer.yml"
  push:
    branches:
      - main
    tags:
      - "hearthgate-v*"
    paths:
      - "apps/starwell-server/**"
      - "apps/starwell/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hearthgate-windows-installer.yml"

permissions:
  contents: write

concurrency:
  group: hearthgate-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build Windows x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      HEARTHGATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEARTHGATE_EVENT_SHA: ${{ github.sha }}
      HEARTHGATE_SOURCE_REF: ${{ github.head_ref || github.ref_name }}

    defaults:
      run:
        working-directory: apps/starwell-server

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEARTHGATE_SOURCE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/starwell-server/package-lock.json

      # The current root package-lock is an incomplete stub: it names direct
      # dependencies but contains no resolved package records. `npm ci` must
      # reject that state. Keep CI non-mutating until a complete root lockfile
      # is regenerated and committed; Hearthgate below remains fully locked.
      - name: Install STARWELL dependencies
        working-directory: ${{ github.workspace }}
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Test and build packaged STARWELL framework
        working-directory: ${{ github.workspace }}
        env:
          STARWELL_BASE: /starwell/
        run: |
          npm run starwell:test
          npm run starwell:build

      - name: Install locked Hearthgate dependencies
        run: npm ci

      - name: Stage STARWELL inside Hearthgate
        run: npm run stage:starwell

      - name: Embed build identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-Content -Raw -Path "package.json" | ConvertFrom-Json
          $identity = [ordered]@{
            version = [string]$package.version
            sourceCommit = [string]$env:HEARTHGATE_SOURCE_SHA
            eventCommit = [string]$env:HEARTHGATE_EVENT_SHA
            sourceRef = [string]$env:HEARTHGATE_SOURCE_REF
            runId = [string]$env:GITHUB_RUN_ID
            runNumber = [string]$env:GITHUB_RUN_NUMBER
            builtAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $identity | ConvertTo-Json | Set-Content -Path "build-info.json" -Encoding utf8
          Write-Host "Embedded Hearthgate $($identity.version) from $($identity.sourceCommit), run $($identity.runNumber)."

      - name: Run packaging preflight
        run: npm run check:packaging

      - name: Build unsigned NSIS installer
        run: npm run electron:build:win

      - name: Verify installer and write checksum
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -Path "dist-electron" -Filter "Hearthgate-Setup-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Hearthgate installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small: $($installer.Length) bytes."
          }

          $unpackedRoot = "dist-electron/win-unpacked/resources/app"
          $unpackedPackagePath = Join-Path $unpackedRoot "package.json"
          $unpackedBuildInfoPath = Join-Path $unpackedRoot "build-info.json"
          $unpackedGrovePath = Join-Path $unpackedRoot "routes/grove-chat.routes.js"
          $unpackedServerPath = Join-Path $unpackedRoot "server.js"
          foreach ($requiredPath in @($unpackedPackagePath, $unpackedBuildInfoPath, $unpackedGrovePath, $unpackedServerPath)) {
            if (-not (Test-Path $requiredPath)) {
              throw "Packaged installer is missing required runtime file: $requiredPath"
            }
          }

          $sourcePackage = Get-Content -Raw -Path "package.json" | ConvertFrom-Json
          $packagedPackage = Get-Content -Raw -Path $unpackedPackagePath | ConvertFrom-Json
          $packagedBuildInfo = Get-Content -Raw -Path $unpackedBuildInfoPath | ConvertFrom-Json
          if ([string]$packagedPackage.version -ne [string]$sourcePackage.version) {
            throw "Packaged version $($packagedPackage.version) does not match source version $($sourcePackage.version)."
          }
          if ([string]$packagedBuildInfo.version -ne [string]$sourcePackage.version) {
            throw "Embedded build version $($packagedBuildInfo.version) does not match source version $($sourcePackage.version)."
          }
          if ([string]$packagedBuildInfo.sourceCommit -ne [string]$env:HEARTHGATE_SOURCE_SHA) {
            throw "Embedded source commit $($packagedBuildInfo.sourceCommit) does not match expected $($env:HEARTHGATE_SOURCE_SHA)."
          }

          $groveSource = Get-Content -Raw -Path $unpackedGrovePath
          if (-not $groveSource.Contains("process.env.HEARTHGATE_DATA_DIR")) {
            throw "Packaged Grove route does not use HEARTHGATE_DATA_DIR."
          }
          if ($groveSource -match 'public[''"]\s*,\s*[''"]uploads') {
            throw "Packaged Grove route still targets the read-only public/uploads directory."
          }

          $serverSource = Get-Content -Raw -Path $unpackedServerPath
          if (-not $serverSource.Contains("app.use('/uploads', express.static(uploadsDir))")) {
            throw "Packaged core does not serve uploads from the writable data directory."
          }

          $unpackedStarwell = "dist-electron/win-unpacked/resources/app/public/starwell/index.html"
          $unpackedGlyphStudio = "dist-electron/win-unpacked/resources/app/public/starwell/glyph-studio/index.html"
          if (-not (Test-Path $unpackedStarwell)) {
            throw "Packaged installer is missing STARWELL framework entry: $unpackedStarwell"
          }
          if (-not (Test-Path $unpackedGlyphStudio)) {
            throw "Packaged installer is missing Glyph Studio entry: $unpackedGlyphStudio"
          }
          $starwellHtml = Get-Content -Raw -Path $unpackedStarwell
          $glyphHtml = Get-Content -Raw -Path $unpackedGlyphStudio
          if (-not $starwellHtml.Contains('/starwell/')) {
            throw "Packaged STARWELL entry does not use the /starwell/ asset base."
          }
          if (-not $glyphHtml.Contains('/starwell/')) {
            throw "Packaged Glyph Studio entry does not use the /starwell/ asset base."
          }

          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Set-Content -Path "dist-electron/SHA256SUMS.txt" -Encoding ascii

          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_bytes=$($installer.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_sha256=$($hash.Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          @"
          ## Hearthgate Windows installer

          - File: ``$($installer.Name)``
          - Size: $([math]::Round($installer.Length / 1MB, 2)) MB
          - SHA-256: ``$($hash.Hash)``
          - Source commit: ``$($packagedBuildInfo.sourceCommit)``
          - Packaged version: ``$($packagedPackage.version)``
          - Runtime gate: writable Grove uploads verified in win-unpacked
          - Framework: bundled STARWELL + Glyph Studio
          - Font compiler: local FontForge sidecar adapter
          - Signing: unsigned development build
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer artefact
        uses: actions/upload-artifact@v4
        with:
          name: hearthgate-windows-${{ env.HEARTHGATE_SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 21
          path: |
            apps/starwell-server/dist-electron/Hearthgate-Setup-*.exe
            apps/starwell-server/dist-electron/*.blockmap
            apps/starwell-server/dist-electron/latest*.yml
            apps/starwell-server/dist-electron/SHA256SUMS.txt

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/hearthgate-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_NAME: ${{ steps.verify.outputs.installer_name }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            "dist-electron/$($env:INSTALLER_NAME)",
            "dist-electron/SHA256SUMS.txt"
          )
          $blockmaps = @(Get-ChildItem -Path "dist-electron" -Filter "*.blockmap" -File | ForEach-Object { $_.FullName })
          $files += $blockmaps

          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Hearthgate $tag" --generate-notes
          }
