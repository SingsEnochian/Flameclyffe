name: Hearthgate Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/starwell-server/**"
      - "apps/starwell/**"
      - "starwell/deep-observer/schemas/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hearthgate-windows-installer.yml"
  push:
    branches:
      - main
    tags:
      - "hearthgate-v*"
    paths:
      - "apps/starwell-server/**"
      - "apps/starwell/**"
      - "starwell/deep-observer/schemas/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hearthgate-windows-installer.yml"

permissions:
  contents: write

concurrency:
  group: hearthgate-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build Windows x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    defaults:
      run:
        working-directory: apps/starwell-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/starwell-server/package-lock.json

      # The current root package-lock is an incomplete stub: it names direct
      # dependencies but contains no resolved package records. `npm ci` must
      # reject that state. Keep CI non-mutating until a complete root lockfile
      # is regenerated and committed; Hearthgate below remains fully locked.
      - name: Install STARWELL dependencies
        working-directory: ${{ github.workspace }}
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Test and build packaged STARWELL framework
        working-directory: ${{ github.workspace }}
        env:
          STARWELL_BASE: /starwell/
        run: |
          npm run starwell:test
          npm run starwell:build

      - name: Install locked Hearthgate dependencies
        run: npm ci

      - name: Test local security boundary
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Stage STARWELL inside Hearthgate
        run: npm run stage:starwell

      - name: Prepare deterministic installer assets
        run: npm run prepare:assets

      - name: Run packaging preflight
        run: npm run check:packaging

      - name: Build unsigned NSIS installer
        run: npm run electron:build:win

      - name: Verify installer and write checksum
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -Path "dist-electron" -Filter "Hearthgate-Setup-*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Hearthgate installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small: $($installer.Length) bytes."
          }

          $resourcesRoot = "dist-electron/win-unpacked/resources"
          $asar = "$resourcesRoot/app.asar"
          $unpackedRoot = "$resourcesRoot/app.asar.unpacked"
          $starwellRoot = "$unpackedRoot/public/starwell"
          $unpackedStarwell = "$starwellRoot/index.html"
          $unpackedGlyphStudio = "$starwellRoot/glyph-studio/index.html"
          $unpackedArcsweep = "$starwellRoot/arcsweep-continuity/index.html"
          $unpackedBifrostManifest = "$starwellRoot/modules/bifrost-arcsweep.module.json"
          $unpackedPremaqSchema = "$starwellRoot/schemas/premaq-state-v2.schema.json"
          $unpackedBifrostSchema = "$starwellRoot/schemas/bifrost-temporal-state-v1.schema.json"
          $secureServer = "$unpackedRoot/server-secure.js"
          $securityBoundary = "$unpackedRoot/security/local-boundary.js"
          $fontForgeServer = "$unpackedRoot/fontforge/server.js"

          foreach ($required in @(
            $asar,
            $unpackedStarwell,
            $unpackedGlyphStudio,
            $unpackedArcsweep,
            $unpackedBifrostManifest,
            $unpackedPremaqSchema,
            $unpackedBifrostSchema,
            $secureServer,
            $securityBoundary,
            $fontForgeServer
          )) {
            if (-not (Test-Path $required)) {
              throw "Packaged installer is missing required hardened Hearthgate file: $required"
            }
          }

          $starwellHtml = Get-Content -Raw -Path $unpackedStarwell
          $glyphHtml = Get-Content -Raw -Path $unpackedGlyphStudio
          $arcsweepHtml = Get-Content -Raw -Path $unpackedArcsweep
          foreach ($page in @(
            @{ Name = "STARWELL"; Html = $starwellHtml },
            @{ Name = "Glyph Studio"; Html = $glyphHtml },
            @{ Name = "Arcsweep"; Html = $arcsweepHtml }
          )) {
            if (-not $page.Html.Contains('/starwell/')) {
              throw "Packaged $($page.Name) entry does not use the /starwell/ asset base."
            }
          }

          $secureServerSource = Get-Content -Raw -Path $secureServer
          $securityBoundarySource = Get-Content -Raw -Path $securityBoundary
          if (-not $secureServerSource.Contains("127.0.0.1")) {
            throw "Packaged core server does not enforce loopback binding."
          }
          if (-not $securityBoundarySource.Contains("HEARTHGATE_ORIGIN_DENIED")) {
            throw "Packaged local-origin boundary is missing."
          }

          $manifest = Get-Content -Raw -Path $unpackedBifrostManifest | ConvertFrom-Json
          if ($manifest.moduleId -ne "bifrost-arcsweep") {
            throw "Packaged Bifröst manifest has the wrong moduleId."
          }
          if ($manifest.engine.formalism -ne "temporal-compression-release-state-machine") {
            throw "Packaged Bifröst manifest does not execute the compression-release formalism."
          }
          if ($manifest.engine.physicalClaim -ne $false) {
            throw "Packaged Bifröst manifest violates the physical-claim boundary."
          }
          if ($manifest.authorityContract.hearthside -ne "evidence-grounded-observational") {
            throw "Packaged Bifröst manifest does not preserve Hearthside evidence authority."
          }
          if ($manifest.authorityContract.targetside -ne "canon-grounded-projected") {
            throw "Packaged Bifröst manifest does not preserve Targetside projection authority."
          }
          if ($manifest.authorityContract.collapseExists -ne $false) {
            throw "Packaged Bifröst manifest reintroduces collapse."
          }
          if ($manifest.authorityContract.releaseFeedsNextCompression -ne $true) {
            throw "Packaged Bifröst manifest breaks compression of the release."
          }
          if ($manifest.authorityContract.toneApproval -ne "rowan-human-calibration-owner") {
            throw "Packaged Bifröst manifest removes Rowan tone-approval authority."
          }
          foreach ($capability in @(
            "premaq-v2-ingest",
            "compression-release-cycles",
            "compression-of-release-recursion",
            "world-specific-tone-sequences",
            "rowan-owned-tone-approval"
          )) {
            if ($manifest.capabilities -notcontains $capability) {
              throw "Packaged Bifröst manifest is missing capability: $capability"
            }
          }

          $premaqSchema = Get-Content -Raw -Path $unpackedPremaqSchema | ConvertFrom-Json
          $bifrostSchema = Get-Content -Raw -Path $unpackedBifrostSchema | ConvertFrom-Json
          if ($premaqSchema.title -ne "PREMAQ Observation State v2") {
            throw "Packaged PREMAQ schema is not v2."
          }
          if ($bifrostSchema.'$id' -ne "https://flameclyffe.local/schemas/bifrost-temporal-state-v1.schema.json") {
            throw "Packaged Bifröst temporal schema has the wrong machine identity."
          }
          if ($bifrostSchema.properties.compression_release.properties.law.const -ne "compression-release-compression-of-release-infinite-recursion") {
            throw "Packaged Bifröst temporal schema is missing the compression-release law."
          }

          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Set-Content -Path "dist-electron/SHA256SUMS.txt" -Encoding ascii

          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_bytes=$($installer.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_sha256=$($hash.Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          @"
          ## Hearthgate Windows installer

          - File: ``$($installer.Name)``
          - Size: $([math]::Round($installer.Length / 1MB, 2)) MB
          - SHA-256: ``$($hash.Hash)``
          - Packaging: ASAR enabled with explicit runtime unpack boundary
          - Security: sandboxed renderer, loopback-only services, restricted origins, redacted IPC
          - Framework: bundled STARWELL + Glyph Studio + Bifröst Arcsweep
          - Formalism: compression → release → compression of the release
          - State contracts: PREMAQ v2 + Bifröst compression-release state v1
          - Font compiler: local FontForge sidecar adapter
          - Signing: unsigned development build
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer artefact
        uses: actions/upload-artifact@v7
        with:
          name: hearthgate-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 21
          path: |
            apps/starwell-server/dist-electron/Hearthgate-Setup-*.exe
            apps/starwell-server/dist-electron/*.blockmap
            apps/starwell-server/dist-electron/latest*.yml
            apps/starwell-server/dist-electron/SHA256SUMS.txt

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/hearthgate-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_NAME: ${{ steps.verify.outputs.installer_name }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            "dist-electron/$($env:INSTALLER_NAME)",
            "dist-electron/SHA256SUMS.txt"
          )
          $blockmaps = @(Get-ChildItem -Path "dist-electron" -Filter "*.blockmap" -File | ForEach-Object { $_.FullName })
          $files += $blockmaps

          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Hearthgate $tag" --generate-notes
          }
