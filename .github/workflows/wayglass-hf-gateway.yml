name: Wayglass HF Gateway Contract
on:
  pull_request:
    paths:
      - 'deploy/huggingface-wayglass/**'
      - '.github/workflows/wayglass-hf-gateway.yml'
  push:
    branches:
      - wayglass/current
      - wayglass/wyrdrune-mythience-crossing-20261112
    paths:
      - 'deploy/huggingface-wayglass/**'
      - '.github/workflows/wayglass-hf-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mocked-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated gateway contract tests (no credentials or network)
        run: python -m unittest discover -s deploy/huggingface-wayglass -p 'test_*.py' -v
  gradio-api-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install supported Gradio major version
        run: python -m pip install 'gradio>=5,<6'
      - name: Check real Gradio import and owner-auth launch signature without starting server
        env:
          WAYGLASS_RESPOND_URL: ''
          WAYGLASS_GATEWAY_TOKEN: ''
          WAYGLASS_OWNER_USER: ''
          WAYGLASS_OWNER_PASSWORD: ''
        run: |
          python - <<'PY'
          import importlib.util
          import inspect
          import pathlib
          import gradio
          assert 'type' in inspect.signature(gradio.ChatInterface).parameters
          assert 'auth' in inspect.signature(gradio.Blocks.launch).parameters
          assert 'show_api' in inspect.signature(gradio.Blocks.launch).parameters
          path = pathlib.Path('deploy/huggingface-wayglass/app.py')
          spec = importlib.util.spec_from_file_location('wayglass_hf_runtime_check', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert not module.ready(), 'CI must not activate an authenticated gateway'
          print('Gradio API import and disabled owner gate verified:', gradio.__version__)
          PY
