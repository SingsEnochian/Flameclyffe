name: Hearthfire Agent Fleet

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agents/**'
      - 'scripts/agents/**'
      - 'docs/agents/**'
      - '.github/workflows/hearthfire-agent-fleet.yml'
      - '.nvmrc'
      - 'package.json'
      - 'apps/starwell-server/package.json'
  schedule:
    # GitHub cron is UTC. Running at both 07:00 and 08:00 with a New York
    # local-time guard preserves 03:00 across daylight-saving changes.
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: hearthfire-agent-fleet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-contracts:
    name: Validate agent contracts and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out Flameclyffe
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Validate JSON contracts
        shell: bash
        run: |
          node -e "for (const file of process.argv.slice(1)) JSON.parse(require('fs').readFileSync(file, 'utf8')); console.log('Agent JSON contracts parsed successfully.')" \
            agents/hearthfire-agent-registry.json \
            agents/hearthfire-source-registry.json \
            agents/rowan-steward-approval-query.json \
            agents/constellation-router.json \
            agents/failure-clinic-taxonomy.json \
            agents/self-improvement-policy.json

      - name: Check agent script syntax
        shell: bash
        run: |
          node --check scripts/agents/run-hearthfire-agent-fleet.mjs
          node --check scripts/agents/run-trust-gate.mjs
          node --check scripts/agents/run-release-radar.mjs
          node --check scripts/agents/classify-failure.mjs

      - name: Run trust gate in validation mode
        env:
          HEARTHFIRE_AGENT_OUT: generated/hearthfire-agent-validation
        run: node scripts/agents/run-trust-gate.mjs

      - name: Upload validation receipts
        uses: actions/upload-artifact@v4
        with:
          name: hearthfire-agent-validation-${{ github.sha }}
          path: generated/hearthfire-agent-validation/
          if-no-files-found: error
          retention-days: 21

  daily-ingest:
    name: 03:00 Eastern evidence run
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Flameclyffe
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Resolve 03:00 America/New_York guard
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "local_date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch accepted."
            exit 0
          fi
          LOCAL_HOUR=$(TZ=America/New_York date +%H)
          LOCAL_DATE=$(TZ=America/New_York date +%F)
          echo "local_hour=$LOCAL_HOUR" >> "$GITHUB_OUTPUT"
          echo "local_date=$LOCAL_DATE" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_HOUR" = "03" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "3 a.m. Eastern window accepted."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC trigger. Local hour is $LOCAL_HOUR."
          fi

      - name: Run agent and Constellation trust gate
        if: steps.guard.outputs.run == 'true'
        run: node scripts/agents/run-trust-gate.mjs

      - name: Run approved live-signal harvest
        if: steps.guard.outputs.run == 'true'
        env:
          HEARTHFIRE_LAT: ${{ vars.HEARTHFIRE_LAT || '30.04' }}
          HEARTHFIRE_LON: ${{ vars.HEARTHFIRE_LON || '-81.40' }}
          HEARTHFIRE_LOCATION_LABEL: ${{ vars.HEARTHFIRE_LOCATION_LABEL || 'NE Florida approximate' }}
        run: node scripts/agents/run-hearthfire-agent-fleet.mjs

      - name: Run dependency release radar in proposal-only mode
        if: steps.guard.outputs.run == 'true'
        run: node scripts/agents/run-release-radar.mjs

      - name: Upload daily evidence and Steward queue
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hearthfire-agent-bundle-${{ steps.guard.outputs.local_date || github.run_id }}
          path: generated/hearthfire-agent-data/
          if-no-files-found: error
          retention-days: 90

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## Hearthfire Agent Fleet" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested schedule: 03:00 America/New_York" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: Node from .nvmrc, currently Node 24" >> "$GITHUB_STEP_SUMMARY"
          echo "- Guard accepted: ${{ steps.guard.outputs.run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local date: ${{ steps.guard.outputs.local_date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Governance: explicit trust contracts plus tamper-evident audit chain" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dependency updates: proposal-only Steward queue" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: generated evidence artifact, not a canonical code mutation" >> "$GITHUB_STEP_SUMMARY"
