name: Hearthgate lock refresh once

on:
  push:
    branches:
      - feat/arcsweep-os-v0-1-runtime-shell
    paths:
      - apps/starwell-server/package.json
      - .github/workflows/hearthgate-lock-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/starwell-server/package-lock.json

      - name: Refresh only the required production lock entries
        working-directory: apps/starwell-server
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update @xmldom/xmldom qs --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/starwell-server/package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/starwell-server/package-lock.json
          git commit -m "chore(hearthgate): refresh secure production lock"
          git push origin HEAD:${GITHUB_REF_NAME}
