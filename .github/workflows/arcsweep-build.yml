name: Arcsweep authoritative gate

on:
  push:
    branches:
      - feature/react-ion-engine-v0.1
    paths:
      - 'apps/arcsweep/**'
      - 'apps/starwell/src/math-spine/**'
      - 'apps/starwell/src/world-tone-fold-approval.js'
      - 'starwell/deep-observer/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/arcsweep-build.yml'
  pull_request:
    branches:
      - codex/arcsweep-feedback-loop
    paths:
      - 'apps/arcsweep/**'
      - 'apps/starwell/src/math-spine/**'
      - 'apps/starwell/src/world-tone-fold-approval.js'
      - 'starwell/deep-observer/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/arcsweep-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcsweep-authoritative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-arcsweep:
    name: Test, audit and build Arcsweep
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - name: Pin npm 11.16.0
        run: npm install --global npm@11.16.0

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify engine contracts
        run: npm run contracts:verify

      - name: Test Arcsweep
        run: npm run arcsweep:test

      - name: Build Arcsweep
        run: npm run arcsweep:build
