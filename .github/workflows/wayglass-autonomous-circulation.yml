name: Wayglass Autonomous Circulation
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/wayglass-autonomous-circulation.mjs'
      - 'scripts/wayglass-circulation-policy.mjs'
      - 'test/wayglass-autonomous-circulation.test.mjs'
      - '.github/workflows/wayglass-autonomous-circulation.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: wayglass-autonomous-circulation
  cancel-in-progress: false
jobs:
  choose-and-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Verify selection policy
        run: node --test test/wayglass-autonomous-circulation.test.mjs
      - name: Select next task and preserve idempotent receipt
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAYGLASS_APPLY: 'true'
        run: node scripts/wayglass-autonomous-circulation.mjs
