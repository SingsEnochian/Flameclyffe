name: Wayglass Autonomous Circulation
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: wayglass-autonomous-circulation
  cancel-in-progress: false
jobs:
  choose-and-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Select verified next task and preserve idempotent receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAYGLASS_APPLY: 'true'
        run: node scripts/wayglass-autonomous-circulation.mjs
