name: STARWELL Workshop Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One bounded STARWELL workshop task"
        required: true
        type: string
      mode:
        description: "Agent operating mode"
        required: true
        default: "build"
        type: choice
        options:
          - build
          - design
          - ingest
          - audit
          - release
      base_branch:
        description: "Branch to work from"
        required: false
        default: "main"
        type: string
  issues:
    types: [labeled]

concurrency:
  group: starwell-workshop-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  authorise:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       contains(fromJSON('["agent:build","agent:design","agent:ingest","agent:audit","agent:release"]'), github.event.label.name) &&
       (github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    outputs:
      task: ${{ steps.context.outputs.task }}
      mode: ${{ steps.context.outputs.mode }}
      issue_number: ${{ steps.context.outputs.issue_number }}
      branch_name: ${{ steps.context.outputs.branch_name }}
      base_branch: ${{ steps.context.outputs.base_branch }}
    steps:
      - id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_BASE: ${{ inputs.base_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABEL: ${{ github.event.label.name }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            task=$(printf '%s\n\n%s' "$ISSUE_TITLE" "$ISSUE_BODY")
            issue="$ISSUE_NUMBER"
            mode="${ISSUE_LABEL#agent:}"
            branch="agent/starwell-${mode}-issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
            base="main"
          else
            task="$INPUT_TASK"
            issue=""
            mode="${INPUT_MODE:-build}"
            branch="agent/starwell-${mode}-dispatch-${GITHUB_RUN_ID}"
            base="${INPUT_BASE:-main}"
          fi
          {
            echo "task<<STARWELL_TASK"
            echo "$task"
            echo "STARWELL_TASK"
            echo "mode=$mode"
            echo "issue_number=$issue"
            echo "branch_name=$branch"
            echo "base_branch=$base"
          } >> "$GITHUB_OUTPUT"

  workshop:
    needs: authorise
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TASK: ${{ needs.authorise.outputs.task }}
      AGENT_MODE: ${{ needs.authorise.outputs.mode }}
      ISSUE_NUMBER: ${{ needs.authorise.outputs.issue_number }}
      BRANCH_NAME: ${{ needs.authorise.outputs.branch_name }}
      BASE_BRANCH: ${{ needs.authorise.outputs.base_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/starwell/package-lock.json

      - name: Install STARWELL dependencies
        working-directory: apps/starwell
        run: npm ci

      - name: Create workshop branch
        run: git switch -c "$BRANCH_NAME"

      - name: Run STARWELL Workshop Agent
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/agents/starwell-builder.md
          codex-args: "--sandbox workspace-write"
        env:
          STARWELL_BUILD_TASK: ${{ env.TASK }}
          STARWELL_AGENT_MODE: ${{ env.AGENT_MODE }}

      - name: Validate STARWELL tests
        working-directory: apps/starwell
        run: npm test

      - name: Validate STARWELL production build
        working-directory: apps/starwell
        run: npm run build

      - name: Check for workshop changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit workshop changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "STARWELL Workshop Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(STARWELL): complete automated ${AGENT_MODE} task"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_SUMMARY: ${{ steps.codex.outputs.final-message }}
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<EOF
          ## Workshop task

          **Mode:** $AGENT_MODE

          $TASK

          ## Agent receipt

          $CODEX_SUMMARY

          ## Validation

          - `npm test`
          - `npm run build`

          Generated by the gated STARWELL Workshop Agent. Human review and merge remain required.
          EOF
          pr_url=$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "feat(STARWELL): automated ${AGENT_MODE} task" \
            --body-file /tmp/pr-body.md)
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Post issue receipt
        if: always() && env.ISSUE_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          CODEX_SUMMARY: ${{ steps.codex.outputs.final-message }}
        shell: bash
        run: |
          if [ "$CHANGED" = "true" ]; then
            message="STARWELL Workshop Agent completed the $AGENT_MODE slice and opened: $PR_URL"
          else
            message="STARWELL Workshop Agent completed the $AGENT_MODE run but produced no repository changes."
          fi
          printf '%s\n\n%s\n' "$message" "$CODEX_SUMMARY" | gh issue comment "$ISSUE_NUMBER" --body-file -