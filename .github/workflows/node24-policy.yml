name: Node 24 Policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node 24 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify repository policy
        shell: bash
        run: |
          set +e
          npm run node24:check 2>&1 | tee node24-policy-report.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node24-policy-report-${{ github.sha }}
          path: node24-policy-report.txt
          if-no-files-found: error
          retention-days: 14
