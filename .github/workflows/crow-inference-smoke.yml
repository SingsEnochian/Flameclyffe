name: Crow inference smoke

on:
  push:
    branches:
      - codex/bluebird-home-v0-1
    paths:
      - '.github/workflows/crow-inference-smoke.yml'
      - 'scripts/crow-inference-smoke.mjs'
      - 'apps/starwell-server/flames/model-candidates.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Invoke The Crow without exposing private continuity
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HFTOKEN: ${{ secrets.HFTOKEN }}
          CROW_MODEL: Crownelius/The-Crow-9B-Creative-Writing-Opus4.6-DISTILL-Heretic
        run: node scripts/crow-inference-smoke.mjs
