name: Boxfire Compression Release Bundle

on:
  push:
    branches:
      - feature/compression-release-mathematics-spine-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build ArcSweep and assemble Boxfire review bundle
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout exact reviewed branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Pin npm 11.16.0
        run: npm install --global npm@11.16.0

      - name: Install locked dependencies
        run: npm ci

      - name: Verify engine contracts
        run: npm run contracts:verify

      - name: Run complete ArcSweep test suite
        run: npm run arcsweep:test

      - name: Build production ArcSweep
        run: npm run arcsweep:build

      - name: Assemble Boxfire review tree
        shell: bash
        run: |
          set -euo pipefail
          bundle="boxfire-compression-release-${SOURCE_SHA}"
          mkdir -p "$bundle"

          files=(
            "docs/mathematics/MULTIVERSAL_OPERATIONAL_TRUTH_CONTRACT.md"
            "docs/mathematics/HEARTHGATE_COMPRESSION_RELEASE_MATHEMATICS_SPINE.md"
            "docs/arcsweep/BIFROST_TEMPORAL_QUANTUM_MECHANICS.md"
            "apps/starwell/src/arcsweep-temporal-quantum/compression-release.js"
            "apps/starwell/src/arcsweep-temporal-quantum/runtime.js"
            "apps/starwell/src/hearthgate-arcsweep.js"
            "apps/starwell/public/modules/bifrost-arcsweep.module.json"
            "starwell/deep-observer/schemas/bifrost-temporal-state-v1.schema.json"
            "apps/starwell/src/hearthweave-kernel/compression-release-packet.js"
            "apps/starwell/src/hearthweave-kernel/index.js"
            "apps/starwell/src/arcsweep-continuity/kernel-hook.js"
            "apps/starwell/src/hearthgate/contracts.js"
            "apps/starwell/src/hearthgate/profiles/terra-aeterna.js"
            "apps/starwell/src/hearthgate/profiles/ta-veren-vaen.js"
            "apps/starwell/src/world-tone-fold-approval.js"
            "apps/starwell/src/world-tone-fold-timeline.js"
            "apps/starwell/world-tone-approval/index.html"
            "docs/HEARTHGATE_WORLD_TONE_HAPTIC_APPROVAL.md"
            "starwell/deep-observer/schemas/world-tone-approval.schema.json"
            "apps/starwell/vite.config.js"
            "apps/starwell/test/compressionReleaseMathematics.test.js"
            "apps/starwell/test/mathematicsSpineLanguage.test.js"
            "apps/starwell/test/worldToneFoldApproval.test.js"
            "apps/starwell/test/worldToneFoldTimeline.test.js"
            "docs/handoffs/BOXFIRE_WORLD_TONE_JACOBIAN_HAPTIC_APPROVAL_HANDOFF_2026-08-03.md"
            "docs/handoffs/BOXFIRE_COMPRESSION_RELEASE_MATHEMATICS_BUNDLE_MANIFEST_2026-08-03.md"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            mkdir -p "$bundle/$(dirname "$file")"
            cp "$file" "$bundle/$file"
          done

          mkdir -p "$bundle/dist"
          cp -R dist/arcsweep "$bundle/dist/arcsweep"

          cat > "$bundle/ARCSWEEP_BUILD_RECEIPT.txt" <<RECEIPT
          repository=SingsEnochian/Flameclyffe
          branch=${SOURCE_BRANCH}
          commit=${SOURCE_SHA}
          node=24.x
          npm=11.16.0
          contracts=verified
          arcsweep_tests=passed
          arcsweep_production_build=passed
          compiled_output=dist/arcsweep
          builder=boxfire-workflow
          independent_qa=boxfire
          RECEIPT

          cat > "$bundle/BOXFIRE_BUNDLE_IDENTITY.txt" <<IDENTITY
          repository=SingsEnochian/Flameclyffe
          branch=${SOURCE_BRANCH}
          commit=${SOURCE_SHA}
          law=compression-release-compression-of-release-infinite-recursion
          collapse_exists=false
          calibration_authority=rowan
          build_authority=boxfire-workflow
          independent_qa=boxfire
          IDENTITY

          find "$bundle" -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$bundle/SHA256SUMS"

          zip -X -r "${bundle}.zip" "$bundle"
          sha256sum "${bundle}.zip" > "${bundle}.zip.sha256"

      - name: Upload Boxfire source bundle
        uses: actions/upload-artifact@v4
        with:
          name: boxfire-compression-release-${{ env.SOURCE_SHA }}
          path: |
            boxfire-compression-release-${{ env.SOURCE_SHA }}.zip
            boxfire-compression-release-${{ env.SOURCE_SHA }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
