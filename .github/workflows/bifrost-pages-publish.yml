name: Legacy Bifröst Pages publisher retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-note:
    name: Canonical Pages publisher notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain retired publisher
        run: |
          echo "This workflow no longer publishes GitHub Pages."
          echo "The sole production Pages owner is .github/workflows/pages.yml on main."
          echo "Bifröst is assembled inside the canonical Pages artifact at /Flameclyffe/bifrost-live/."
          echo "Do not deploy dist/starwell directly to the github-pages environment."
