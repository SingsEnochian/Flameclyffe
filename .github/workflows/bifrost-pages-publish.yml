name: Publish Bifröst Arcsweep Live

on:
  push:
    branches:
      - pages/bifrost-live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bifrost-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build verified Bifröst source
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sealed live source branch
        uses: actions/checkout@v6
        with:
          ref: pages/bifrost-live

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify contracts and full STARWELL suite
        run: |
          npm run contracts:verify
          npm run starwell:test

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build for the Flameclyffe project-site path
        env:
          STARWELL_BASE: /Flameclyffe/
        run: npm run starwell:build

      - name: Verify required live systems
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/starwell/index.html
          test -f dist/starwell/bifrost/index.html
          test -f dist/starwell/modules/bifrost-arcsweep.module.json
          grep -R "two-shore-mythframe" dist/starwell/assets >/dev/null
          grep -R "two-shore-coil-release" dist/starwell/assets >/dev/null
          grep -R "premaq-shokz" dist/starwell/assets >/dev/null
          touch dist/starwell/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/starwell

  deploy:
    name: Publish live site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
