name: Dabble Bridge Tests
on:
  pull_request:
    paths:
      - 'starwell/writing-room/**'
      - '.github/workflows/dabble-bridge-tests.yml'
  workflow_dispatch:
jobs:
  read-only-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check bridge modules
        run: |
          node --check starwell/writing-room/dabble-import.mjs
          node --check starwell/writing-room/dabble-shelf.mjs
      - name: Run Dabble importer tests
        run: node --test starwell/writing-room/test/dabble-import.test.mjs
