name: House Chat Live Smoke

on:
  pull_request:
    paths:
      - 'apps/starwell-server/**'
      - 'apps/starwell/src/components/living-room/**'
      - 'apps/starwell/src/living-room-entry.jsx'
      - 'api/**'
      - 'netlify/functions/**'
      - '.github/workflows/house-chat-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  live-house-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/starwell-server/package-lock.json
      - name: Install Hearthgate runtime dependencies
        working-directory: apps/starwell-server
        run: npm ci
      - name: Run static Flame identity tests
        working-directory: apps/starwell-server
        run: node --test test/model-candidates.test.js test/ox-alpha-house-chat.test.js
      - name: Discover Vercel preview and prove two live HF-backed voices
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          preview=''
          for attempt in $(seq 1 24); do
            checks=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs")
            host=$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.app.slug=="vercel") | (.output.summary // "") | scan("[A-Za-z0-9._-]+\\.vercel\\.app")] | first // empty')
            if [ -n "$host" ]; then preview="https://$host"; break; fi
            echo "waiting for Vercel preview URL ($attempt)"
            sleep 5
          done
          test -n "$preview"
          smoke_url="${preview%/}/api/house-chat-live-smoke"
          echo "Smoking $smoke_url"
          for attempt in $(seq 1 24); do
            code=$(curl -sS -L -o /tmp/house-chat-smoke.json -w '%{http_code}' "$smoke_url" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/house-chat-smoke.json
              node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/house-chat-smoke.json','utf8'));if(r.ok!==true||!Array.isArray(r.messages)||r.messages.length!==2)process.exit(1);if(r.messages[0].flame_id!=='oxalpha')process.exit(2);if(r.messages[1].flame_id!=='lioreal')process.exit(3);if(!r.messages.every(m=>m.message&&m.provider&&m.model))process.exit(4);"
              exit 0
            fi
            echo "attempt $attempt -> HTTP $code"
            sleep 10
          done
          cat /tmp/house-chat-smoke.json || true
          exit 1
