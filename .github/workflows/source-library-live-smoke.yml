name: Source Library Live Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/source-library-live-smoke.yml'
      - 'api/v1/library/**'
      - 'netlify/functions/source-library.mts'
      - 'netlify/functions/_shared/source-library-runtime.mjs'
      - 'netlify/functions/_shared/source-library-live-smoke.mjs'
      - 'apps/starwell/src/components/living-room/SourceLibrary.jsx'
      - 'apps/starwell/src/living-room-entry.jsx'
      - 'supabase/migrations/202608270001_source_sync_spine_v1.sql'
      - 'supabase/migrations/202608270002_source_library_query_v1.sql'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: source-library-live-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: singsenochian-2527s-projects
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Mint trusted GitHub OIDC token for Vercel protection
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Syntax-check consolidated live smoke route
        run: |
          node --check 'api/v1/library/[action].js'
          node --check netlify/functions/_shared/source-library-live-smoke.mjs

      - name: Discover exact-head Vercel preview
        id: preview
        shell: bash
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs"
          SAW_VERCEL=0
          PREVIEW_URL=''
          for attempt in $(seq 1 36); do
            HTTP_STATUS=$(curl -sS --retry 2 --retry-delay 1 -o check-runs.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' "${API}") || HTTP_STATUS='000'
            if [[ "${HTTP_STATUS}" == '200' ]]; then
              read -r VERCEL_COUNT PREVIEW_HOST < <(node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('check-runs.json', 'utf8'));
          const checks = (data.check_runs || []).filter((run) => run.app?.slug === 'vercel');
          const hosts = [];
          for (const run of checks) {
            for (const value of [run.details_url, run.output?.title, run.output?.summary, run.output?.text]) {
              for (const host of String(value || '').match(/[a-z0-9][a-z0-9.-]*\.vercel\.app/gi) || []) {
                if (!hosts.includes(host)) hosts.push(host);
              }
            }
          }
          console.log(`${checks.length} ${hosts[0] || ''}`);
          NODE
              )
              if [[ "${VERCEL_COUNT:-0}" -gt 0 ]]; then SAW_VERCEL=1; fi
              if [[ -n "${PREVIEW_HOST:-}" ]]; then PREVIEW_URL="https://${PREVIEW_HOST}"; break; fi
            fi
            sleep 10
          done
          if [[ -z "${PREVIEW_URL}" ]]; then
            echo "- exact_head: \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- saw_vercel_check: \`${SAW_VERCEL}\`" >> "$GITHUB_STEP_SUMMARY"
            if [[ "${SAW_VERCEL}" -eq 0 ]]; then
              echo '::error title=NO_VERCEL_CHECK::No exact-head Vercel check appeared before timeout.'
            else
              echo '::error title=NO_PREVIEW_URL::Vercel checks appeared, but no .vercel.app preview hostname was discoverable.'
            fi
            exit 1
          fi
          echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "Discovered exact-head preview: ${PREVIEW_URL}"

      - name: Prove list search compare and Ox Alpha Author Lens
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -uo pipefail
          ENDPOINT_PATH='/api/v1/library/live-smoke'
          ENDPOINT="${PREVIEW_URL}${ENDPOINT_PATH}"
          rm -f smoke-body.json smoke-headers.txt vercel-curl.err

          CURL_ARGS=(-sS -L --max-time 180 -D smoke-headers.txt -o smoke-body.json -w '%{http_code}' -H 'accept: application/json')
          if [[ -n "${VERCEL_TRUSTED_OIDC_TOKEN:-}" ]]; then
            CURL_ARGS+=( -H "x-vercel-trusted-oidc-idp-token: ${VERCEL_TRUSTED_OIDC_TOKEN}" )
          fi
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            CURL_ARGS+=( -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" -H 'x-vercel-set-bypass-cookie: true' )
          fi

          FINAL_STATUS=$(curl "${CURL_ARGS[@]}" "${ENDPOINT}") || FINAL_STATUS='000'
          ACCESS_METHOD='direct'

          if [[ "${FINAL_STATUS}" == '401' || "${FINAL_STATUS}" == '403' ]]; then
            if [[ -n "${VERCEL_TOKEN:-}" ]]; then
              ACCESS_METHOD='vercel-cli'
              rm -f smoke-body.json
              npx --yes vercel@latest curl "${ENDPOINT_PATH}" \
                --deployment "${PREVIEW_URL}" \
                --token "${VERCEL_TOKEN}" \
                --scope "${VERCEL_SCOPE}" \
                > smoke-body.json 2> vercel-curl.err
              CLI_EXIT=$?
              if [[ ${CLI_EXIT} -ne 0 ]]; then
                tail -n 30 vercel-curl.err >> "$GITHUB_STEP_SUMMARY" || true
                echo '::error title=VERCEL_CLI_ACCESS_FAILED::Vercel CLI could not reach the protected exact-head preview.'
                exit 1
              fi
              FINAL_STATUS='cli'
            else
              echo '### Source Library Live Acceptance — BLOCKED, NOT PASSED' >> "$GITHUB_STEP_SUMMARY"
              echo "- exact_head: \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- preview: \`${PREVIEW_URL}\`" >> "$GITHUB_STEP_SUMMARY"
              echo '- blocker: `PREVIEW_PROTECTED_NO_AUTHORITY`' >> "$GITHUB_STEP_SUMMARY"
              echo '- promotion: **FORBIDDEN until the hosted OA receipt exists.**' >> "$GITHUB_STEP_SUMMARY"
              echo '::warning title=PREVIEW_PROTECTED_NO_AUTHORITY::Vercel rejected trusted GitHub OIDC and no automation bypass or Vercel token is configured. This gate is BLOCKED, not passed.'
              exit 0
            fi
          fi

          if [[ "${FINAL_STATUS}" == '000' || "${FINAL_STATUS}" == '404' ]]; then
            echo '::error title=PREVIEW_ROUTE_UNAVAILABLE::Exact-head preview did not expose the consolidated Source Library smoke route.'
            exit 1
          fi
          if [[ "${ACCESS_METHOD}" == 'direct' && "${FINAL_STATUS}" != '200' ]]; then
            if node -e "const d=require('./smoke-body.json'); process.exit(d && d.code ? 0 : 1)" 2>/dev/null; then
              CODE=$(node -e "const d=require('./smoke-body.json'); process.stdout.write(String(d.code))")
              ERROR=$(node -e "const d=require('./smoke-body.json'); process.stdout.write(String(d.error || 'Hosted smoke failed').slice(0,700))")
              echo "::error title=${CODE}::${ERROR}"
            else
              echo '::error title=PREVIEW_HTTP_FAILURE::Preview returned a non-success response before a valid smoke receipt was produced.'
            fi
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          let data;
          try {
            data = JSON.parse(fs.readFileSync('smoke-body.json', 'utf8').trim());
          } catch (error) {
            console.error(`::error title=INVALID_JSON::Authenticated preview probe did not return the smoke JSON envelope: ${error.message}`);
            process.exit(1);
          }
          if (data?.ok !== true) {
            console.error(`::error title=${data?.code || 'LIVE_SMOKE_FAILED'}::${String(data?.error || 'Hosted smoke failed').slice(0, 900)}`);
            process.exit(1);
          }
          const required = [
            data?.schema === 'source-library-live-smoke/v1',
            data?.proof?.list?.indexed_document_count >= 2,
            data?.proof?.search?.result_count >= 1,
            data?.proof?.compare?.item_ids?.length === 2,
            data?.proof?.compare?.evidence_counts?.every((count) => count >= 1),
            data?.proof?.author_lens?.mode === 'author_reconstruction',
            data?.proof?.author_lens?.simulated_author === true,
            data?.proof?.author_lens?.flame_id === 'oxalpha',
            data?.proof?.author_lens?.provider === 'huggingface-inference-providers',
            data?.proof?.author_lens?.model === 'zai-org/GLM-5.3-Flash',
            data?.proof?.author_lens?.response_char_count > 0,
            data?.proof?.author_lens?.evidence_segment_ids?.length >= 1,
            data?.proof?.author_lens?.evidence_text_hashes?.length >= 1,
          ];
          if (!required.every(Boolean)) {
            console.error(`::error title=LIVE_SMOKE_CONTRACT_FAILED::${JSON.stringify(data).slice(0, 1800)}`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n\`\`\`json\n${JSON.stringify(data.proof, null, 2)}\n\`\`\`\n`);
          console.log('Source Library live smoke PASSED: list → FTS → compare → Ox Alpha Author Lens → provenance receipt.');
          NODE
