name: iPad Somatic PWA Check

on:
  push:
    branches:
      - feature/ipad-somatic-haptics-v1
    paths:
      - 'apps/starwell/**'
      - 'starwell/deep-observer/schemas/ipad-somatic-haptic-receipt.schema.json'
      - 'docs/ipad/**'
      - 'docs/handoffs/BOXFIRE_IPAD_SOMATIC_HAPTICS_HANDOFF_2026-08-03.md'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ipad-somatic-check.yml'
  pull_request:
    branches:
      - feature/compression-release-mathematics-spine-v1
    paths:
      - 'apps/starwell/**'
      - 'starwell/deep-observer/schemas/ipad-somatic-haptic-receipt.schema.json'
      - 'docs/ipad/**'
      - 'docs/handoffs/BOXFIRE_IPAD_SOMATIC_HAPTICS_HANDOFF_2026-08-03.md'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ipad-somatic-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify iPad somatic renderer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Node and npm contract
        shell: bash
        run: |
          set -euo pipefail
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 24) { throw new Error('Expected Node 24, received '+process.versions.node); }"
          node -e "const {execFileSync}=require('node:child_process'); const major=Number(execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.')[0]); if (major !== 11) { throw new Error('Expected npm 11, received npm '+major); }"
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Test STARWELL and somatic contracts
        run: npm run starwell:test

      - name: Build STARWELL
        run: npm run starwell:build

      - name: Verify iPad PWA artefacts and truth binding
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/starwell/world-tone-approval/index.html
          test -f dist/starwell/world-tone-approval/manifest.webmanifest
          test -f dist/starwell/world-tone-approval/service-worker.js
          test -f dist/starwell/world-tone-approval/hearthgate-somatic-icon.svg
          test -f dist/starwell/schemas/ipad-somatic-haptic-receipt.schema.json
          grep -q 'Hearthgate iPad Somatic Tone Gate' dist/starwell/world-tone-approval/index.html
          grep -q 'ROWAN APPROVAL GATE' dist/starwell/world-tone-approval/index.html
          grep -q 'BoundIPadSomaticHapticSession' apps/starwell/world-tone-approval/index.html
          grep -q 'source_state_fingerprint' apps/starwell/src/ipad-somatic-bound-session.js
          grep -q 'compression_release_receipt_id' apps/starwell/src/ipad-somatic-lineage.js
          grep -q 'publishIPadSomaticLineage' apps/starwell/src/arcsweep-continuity/kernel-hook.js
          grep -q 'internal_haptic_actuator' apps/starwell/src/ipad-somatic-haptics.js
          grep -q 'compression -> release -> compression of the release' apps/starwell/src/ipad-somatic-haptics.js
          grep -q '"collapseExists": false' apps/starwell/public/modules/bifrost-arcsweep.module.json
          if grep -q 'user-scalable=no' apps/starwell/world-tone-approval/index.html; then
            echo 'iPad viewport disables user zoom'
            exit 1
          fi
          node -e "JSON.parse(require('node:fs').readFileSync('starwell/deep-observer/schemas/ipad-somatic-haptic-receipt.schema.json','utf8'))"
