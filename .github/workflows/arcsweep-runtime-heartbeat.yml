name: ArcSweep Runtime Heartbeat

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  prove-runtime-heartbeat:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[heartbeat-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://flameclyffe.vercel.app
      OIDC_AUDIENCE: flameclyffe-house-smoke/v1
    steps:
      - name: Wait for exact production SHA and prove durable model receipt
        shell: bash
        run: |
          node <<'NODE' | tee runtime-heartbeat.json
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function oidcToken() {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', process.env.OIDC_AUDIENCE);
            const response = await fetch(url, {
              headers: { authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            });
            if (!response.ok) throw new Error(`GitHub OIDC token request failed: ${response.status}`);
            const body = await response.json();
            if (!body.value) throw new Error('GitHub OIDC token response was empty.');
            return body.value;
          }

          const token = await oidcToken();
          let last = null;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            let response;
            let body;
            try {
              response = await fetch(`${process.env.BASE_URL.replace(/\/$/, '')}/api/v1/house/runtime-heartbeat`, {
                method: 'POST',
                headers: { authorization: `Bearer ${token}` },
                redirect: 'manual',
              });
              const text = await response.text();
              try { body = JSON.parse(text); } catch { body = { error: text.slice(0, 500) || 'non-json response' }; }
            } catch (error) {
              last = { attempt, transport_error: error.message };
              console.error(JSON.stringify(last));
              await sleep(10_000);
              continue;
            }

            last = { attempt, http_status: response.status, ...body };
            const exactProduction = body?.production_sha === process.env.GITHUB_SHA;
            const receipt = body?.runtime_receipt;
            const passed = response.ok
              && body?.ok === true
              && exactProduction
              && receipt?.persisted === true
              && receipt?.readback_verified === true
              && receipt?.voice_id === 'atlas'
              && Boolean(receipt?.event_id)
              && Boolean(receipt?.packet_fingerprint);

            if (passed) {
              console.log(JSON.stringify(last, null, 2));
              process.exit(0);
            }

            console.error(JSON.stringify({
              attempt,
              http_status: response.status,
              production_sha: body?.production_sha || null,
              expected_sha: process.env.GITHUB_SHA,
              stage_error: body?.stage_error || body?.error || null,
              persisted: receipt?.persisted ?? null,
              readback_verified: receipt?.readback_verified ?? null,
            }));
            await sleep(10_000);
          }

          console.log(JSON.stringify(last || { ok: false, error: 'No heartbeat response received.' }, null, 2));
          process.exit(1);
          NODE

      - name: Record heartbeat receipt in job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## ArcSweep Runtime Heartbeat'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            cat runtime-heartbeat.json 2>/dev/null || echo '{"ok":false,"error":"heartbeat proof failed before receipt"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
