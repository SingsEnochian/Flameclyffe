name: ArcSweep RC8 Production Integration Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  dispatch-trusted-rc8-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[rc8-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch trusted rc8 smoke run
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch('https://api.github.com/repos/SingsEnochian/Flameclyffe/actions/workflows/arcsweep-rc8-production-integration-smoke.yml/dispatches', {
            method: 'POST',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'content-type': 'application/json',
              'x-github-api-version': '2026-03-10',
            },
            body: JSON.stringify({ ref: 'main' }),
          });
          const text = await response.text();
          if (![200, 204].includes(response.status)) {
            throw new Error(`RC8 smoke dispatch failed: ${response.status} ${text}`);
          }
          console.log('Trusted rc8 production smoke dispatched as workflow_dispatch.');
          NODE

  rc8-production-integration-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      BASE_URL: https://flameclyffe.vercel.app
      OIDC_AUDIENCE: flameclyffe-house-smoke/v1
    steps:
      - name: Checkout exact smoke code
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Prove rc.8 route, Magic Book, Settings, Glyph Forge, and Observer/DEEP crossing
        shell: bash
        run: node scripts/arcsweep-rc8-production-integration-smoke.mjs | tee rc8-production-integration-smoke.json

      - name: Publish smoke summary
        if: always()
        shell: bash
        run: |
          STATUS='PASSED'
          if [[ '${{ job.status }}' != 'success' ]]; then STATUS='FAILED'; fi
          {
            echo "## ArcSweep rc.8 production integration smoke: ${STATUS}"
            echo
            echo 'Production: `https://flameclyffe.vercel.app/arcsweep/`'
            echo "Workflow commit: \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            cat rc8-production-integration-smoke.json 2>/dev/null || echo '{"ok":false,"error":"smoke failed before receipt"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcsweep-rc8-production-integration-smoke
          path: rc8-production-integration-smoke.json
          if-no-files-found: warn
