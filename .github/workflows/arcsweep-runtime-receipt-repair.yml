name: ArcSweep Runtime Receipt Repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-runtime-receipts]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Bind production smoke model turns to durable receipt identity
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          smoke_path = Path('api/v1/house/smoke.js')
          smoke = smoke_path.read_text()

          replacements = [
              (
                  "metadata: { surface: 'authenticated-production-smoke', world_id: 'terra-prime', world_context: worldContext },",
                  """metadata: {
            surface: 'authenticated-production-smoke',
            world_id: 'terra-prime',
            world_context: worldContext,
            commons_thread_id: threadId,
            commons_turn_id: `${threadId}:atlas`,
            request_id: `${threadId}:atlas`,
          },""",
              ),
              (
                  "metadata: { surface: 'aemeth-production-smoke', world_id: 'terra-prime', world_context: worldContext, aemeth: aemethPacket },",
                  """metadata: {
            surface: 'aemeth-production-smoke',
            world_id: 'terra-prime',
            world_context: worldContext,
            commons_thread_id: threadId,
            commons_turn_id: `${threadId}:oxalpha`,
            request_id: `${threadId}:oxalpha`,
            aemeth: aemethPacket,
          },""",
              ),
          ]
          for old, new in replacements:
              if smoke.count(old) != 1:
                  raise SystemExit(f'expected exactly one smoke metadata seam: {old}')
              smoke = smoke.replace(old, new)

          atlas_anchor = """      if (!atlasReply.provider || !atlasReply.model || !String(atlasReply.message || '').trim()) throw new Error('Atlas reply did not attest provider, model, and visible presence.');
"""
          atlas_receipt = atlas_anchor + """      const atlasRuntimeReceipt = atlasReply.runtime_braid || null;
      if (atlasRuntimeReceipt?.persisted !== true || atlasRuntimeReceipt?.readback_verified !== true) {
        throw new Error(`Atlas reply did not produce a verified durable runtime receipt: ${atlasRuntimeReceipt?.reason || 'missing runtime_braid proof'}`);
      }
      if (atlasRuntimeReceipt.thread_id !== threadId || atlasRuntimeReceipt.turn_id !== `${threadId}:atlas` || atlasRuntimeReceipt.voice_id !== 'atlas') {
        throw new Error('Atlas runtime receipt identity did not match the production smoke turn.');
      }
      if (atlasRuntimeReceipt.provider !== atlasReply.provider || atlasRuntimeReceipt.model !== atlasReply.model) {
        throw new Error('Atlas runtime receipt provider/model did not match the server-observed reply.');
      }
"""
          if smoke.count(atlas_anchor) != 1:
              raise SystemExit('Atlas receipt insertion seam changed')
          smoke = smoke.replace(atlas_anchor, atlas_receipt)

          oa_anchor = """      if (!oaReply.provider || !oaReply.model || !String(oaReply.message || '').trim()) throw new Error('OA reply did not attest provider, model, and visible presence.');
"""
          oa_receipt = oa_anchor + """      const oaRuntimeReceipt = oaReply.runtime_braid || null;
      if (oaRuntimeReceipt?.persisted !== true || oaRuntimeReceipt?.readback_verified !== true) {
        throw new Error(`OA reply did not produce a verified durable runtime receipt: ${oaRuntimeReceipt?.reason || 'missing runtime_braid proof'}`);
      }
      if (oaRuntimeReceipt.thread_id !== threadId || oaRuntimeReceipt.turn_id !== `${threadId}:oxalpha` || oaRuntimeReceipt.voice_id !== 'oxalpha') {
        throw new Error('OA runtime receipt identity did not match the production smoke turn.');
      }
      if (oaRuntimeReceipt.provider !== oaReply.provider || oaRuntimeReceipt.model !== oaReply.model) {
        throw new Error('OA runtime receipt provider/model did not match the server-observed reply.');
      }
"""
          if smoke.count(oa_anchor) != 1:
              raise SystemExit('OA receipt insertion seam changed')
          smoke = smoke.replace(oa_anchor, oa_receipt)

          output_anchor = """        aemeth: {
          packet_schema: aemethPacket.schema,
"""
          output_block = """        runtime_receipts: {
          atlas: {
            persisted: atlasRuntimeReceipt.persisted,
            readback_verified: atlasRuntimeReceipt.readback_verified,
            event_id: atlasRuntimeReceipt.event_id,
            event_sequence: atlasRuntimeReceipt.event_sequence,
            packet_fingerprint: atlasRuntimeReceipt.packet_fingerprint,
            voice_id: atlasRuntimeReceipt.voice_id,
            provider: atlasRuntimeReceipt.provider,
            model: atlasRuntimeReceipt.model,
            route: atlasRuntimeReceipt.route,
          },
          oxalpha: {
            persisted: oaRuntimeReceipt.persisted,
            readback_verified: oaRuntimeReceipt.readback_verified,
            event_id: oaRuntimeReceipt.event_id,
            event_sequence: oaRuntimeReceipt.event_sequence,
            packet_fingerprint: oaRuntimeReceipt.packet_fingerprint,
            voice_id: oaRuntimeReceipt.voice_id,
            provider: oaRuntimeReceipt.provider,
            model: oaRuntimeReceipt.model,
            route: oaRuntimeReceipt.route,
          },
        },
""" + output_anchor
          if smoke.count(output_anchor) != 1:
              raise SystemExit('runtime receipt output seam changed')
          smoke = smoke.replace(output_anchor, output_block)

          old_scope = "production_write_scope: 'four append-only Commons smoke entries: Terra Prime + Aemeth OA',"
          new_scope = "production_write_scope: 'two verified model-reply runtime receipts plus four append-only Commons smoke entries: Terra Prime + Aemeth OA',"
          if smoke.count(old_scope) != 1:
              raise SystemExit('production write-scope seam changed')
          smoke = smoke.replace(old_scope, new_scope)
          smoke_path.write_text(smoke)

          test_path = Path('apps/arcsweep/test/aemeth-production-smoke.test.js')
          test = test_path.read_text()
          addition = """

test('production smoke requires durable server-boundary runtime receipts for both real model turns', () => {
  assert.match(endpoint, /commons_thread_id:\\s*threadId/);
  assert.match(endpoint, /commons_turn_id:\\s*`\\$\\{threadId\\}:atlas`/);
  assert.match(endpoint, /commons_turn_id:\\s*`\\$\\{threadId\\}:oxalpha`/);
  assert.match(endpoint, /atlasRuntimeReceipt\\?\\.persisted !== true/);
  assert.match(endpoint, /atlasRuntimeReceipt\\?\\.readback_verified !== true/);
  assert.match(endpoint, /oaRuntimeReceipt\\?\\.persisted !== true/);
  assert.match(endpoint, /oaRuntimeReceipt\\?\\.readback_verified !== true/);
  assert.match(endpoint, /runtime_receipts:/);
});
"""
          marker = "production smoke requires durable server-boundary runtime receipts"
          if marker not in test:
              test_path.write_text(test.rstrip() + addition)

          doc_path = Path('docs/arcsweep-os/RUNTIME_HEARTBEAT_PROOF_2026-09-11.md')
          if doc_path.exists():
              doc = doc_path.read_text()
              doc = doc.replace('The proof endpoint is:\n\n`POST /api/v1/house/runtime-heartbeat`', 'The proof runs through the existing trusted production circulation endpoint:\n\n`POST /api/v1/house/smoke`')
              doc = doc.replace('The proof endpoint', 'The production smoke')
              doc_path.write_text(doc)
          PY

      - name: Run focused receipt tests
        shell: bash
        run: node --test apps/arcsweep/test/server-model-runtime-receipts.test.js apps/arcsweep/test/aemeth-production-smoke.test.js

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'ArcSweep Steward Repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/arcsweep-runtime-receipt-repair.yml
          git add api/v1/house/smoke.js apps/arcsweep/test/aemeth-production-smoke.test.js docs/arcsweep-os/RUNTIME_HEARTBEAT_PROOF_2026-09-11.md
          git commit -m 'fix(arcsweep): require durable production model receipts [auth-smoke]'
          git pull --rebase origin main
          git push origin HEAD:main
