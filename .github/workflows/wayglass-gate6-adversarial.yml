name: Gate 6 · Wyrdrune Adversarial Integrity
on:
  push:
    branches: ['wayglass/current']
    paths:
      - 'lib/wyrdrune/**'
      - 'lib/wayglass-wyrdrune-ritual*'
      - 'apps/wayglass/src/wyrdrune-*.js'
      - 'apps/wayglass/test/eightfold-adversarial.test.js'
      - '.github/workflows/wayglass-gate6-adversarial.yml'
  pull_request:
    branches: ['wayglass/current']
    paths:
      - 'lib/wyrdrune/**'
      - 'lib/wayglass-wyrdrune-ritual*'
      - 'apps/wayglass/src/wyrdrune-*.js'
      - 'apps/wayglass/test/eightfold-adversarial.test.js'
      - '.github/workflows/wayglass-gate6-adversarial.yml'
permissions:
  contents: read
jobs:
  adversarial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Gate 6 · mutate source, rituals, phases, and linked receipts
        run: |
          set -euo pipefail
          node --check lib/wyrdrune/ritual-ledger.cjs
          node --test --test-reporter=tap apps/wayglass/test/eightfold-adversarial.test.js | tee gate6.tap
      - name: Record Gate 6 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayglass-gate6-adversarial-${{ github.sha }}
          path: gate6.tap
          if-no-files-found: warn
          retention-days: 30
