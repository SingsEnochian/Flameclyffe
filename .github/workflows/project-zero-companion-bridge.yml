name: Project Zero Companion Bridge Gate

on:
  pull_request:
    paths:
      - 'apps/project-zero-companion/**'
      - 'docs/project-zero-companion.md'
      - 'docs/project-zero-connector-contract.md'
      - '.github/workflows/project-zero-companion-bridge.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build Flameclyffe Companion bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin npm 11.16.0
        run: npm install --global npm@11.16.0
      - name: Install locked dependencies
        run: npm ci
      - name: Run Companion bridge contract tests
        run: node --test apps/project-zero-companion/test/*.test.js
      - name: Build Companion bridge
        run: npm run project-zero:build
