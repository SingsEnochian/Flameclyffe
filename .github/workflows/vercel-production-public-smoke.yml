name: Vercel Production Public Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  production-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://flameclyffe.vercel.app
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for canonical Arcsweep production bundle
        shell: bash
        run: |
          node <<'NODE'
          const url = `${process.env.BASE_URL.replace(/\/$/, '')}/arcsweep/assets/spessasynth_processor.min.js`;
          for (let attempt = 1; attempt <= 18; attempt += 1) {
            try {
              const response = await fetch(url, { redirect: 'manual' });
              if (response.status === 200) {
                console.log(`Arcsweep worklet ready on attempt ${attempt}.`);
                process.exit(0);
              }
              console.log(`Attempt ${attempt}: ${response.status}`);
            } catch (error) {
              console.log(`Attempt ${attempt}: ${error.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          throw new Error('Canonical Arcsweep worklet did not become available in production.');
          NODE

      - name: Probe production shell and runtime boundaries
        shell: bash
        run: |
          node <<'NODE' | tee smoke.json
          const base = process.env.BASE_URL.replace(/\/$/, '');
          const checks = [];
          const failures = [];

          async function hit(path, expected, init = {}, validate = null) {
            try {
              const response = await fetch(`${base}${path}`, { redirect: 'manual', ...init });
              const type = response.headers.get('content-type') || '';
              const text = await response.text();
              checks.push({ path, status: response.status, content_type: type, sample: text.slice(0, 120) });
              if (response.status !== expected) failures.push(`${path}: expected ${expected}, got ${response.status}`);
              if (validate) {
                const problem = validate({ response, text, type });
                if (problem) failures.push(`${path}: ${problem}`);
              }
            } catch (error) {
              checks.push({ path, status: null, error: error.message });
              failures.push(`${path}: ${error.message}`);
            }
          }

          await hit('/arcsweep/', 200, {}, ({ type }) => /text\/html/i.test(type) ? null : 'expected HTML');
          await hit('/arcsweep/assets/spessasynth_processor.min.js', 200, {}, ({ type }) => /javascript|ecmascript/i.test(type) ? null : 'expected JavaScript');
          await hit('/api/v1/house/session', 401, {}, ({ text }) => /connected/.test(text) ? null : 'session contract missing');
          await hit('/api/v1/house/session', 401, {
            method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ credential: 'deliberately-invalid-smoke-credential' })
          });
          await hit('/api/v1/house/commons', 401);
          await hit('/api/v1/house/observations', 401);
          await hit('/api/v1/house/braid/stream', 401);
          await hit('/api/v1/flames/atlas/status', 401);

          const receipt = { ok: failures.length === 0, base, production_sha: process.env.GITHUB_SHA, checks, failures };
          console.log(JSON.stringify(receipt, null, 2));
          if (failures.length) process.exitCode = 1;
          NODE

      - name: Publish receipt to hosting PR
        if: always()
        shell: bash
        run: |
          STATUS='PASSED'
          if [[ '${{ job.status }}' != 'success' ]]; then STATUS='FAILED'; fi
          {
            echo "### Vercel production public smoke: ${STATUS}"
            echo
            echo 'Production: `https://flameclyffe.vercel.app`'
            echo "Production commit: \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            cat smoke.json 2>/dev/null || echo '{"ok":false,"error":"probe failed before receipt"}'
            echo '```'
          } > receipt.md
          gh pr comment 184 --repo SingsEnochian/Flameclyffe --body-file receipt.md
