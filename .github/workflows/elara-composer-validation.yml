name: Validate Elara Composer

on:
  pull_request:
    paths:
      - 'assets/elara-composer-core.js'
      - 'assets/elara-composer-export.js'
      - 'assets/elara-temporal-2027-adapter.js'
      - 'scripts/validate-elara-composer.mjs'
      - '.nvmrc'
      - '.github/workflows/elara-composer-validation.yml'
  push:
    branches:
      - 'vee/elara-composer-core-v0.1'
    paths:
      - 'assets/elara-composer-core.js'
      - 'assets/elara-composer-export.js'
      - 'assets/elara-temporal-2027-adapter.js'
      - 'scripts/validate-elara-composer.mjs'
      - '.nvmrc'
      - '.github/workflows/elara-composer-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate deterministic score and export laws
        run: node scripts/validate-elara-composer.mjs
