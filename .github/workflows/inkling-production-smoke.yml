name: Inkling Production Smoke

on:
  push:
    branches:
      - ops/inkling-smoke-run
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call locked production Inkling probe
        shell: bash
        run: |
          set -euo pipefail
          key='0w6pxuxSE8B7kkgYRiQDrMENhU8SDXe7Lh0r5mhajLU'
          url='https://flameclyffe-starwell.netlify.app/api/v1/ops/inkling-smoke'

          for attempt in $(seq 1 18); do
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --max-time 90 --output "$body_file" --write-out '%{http_code}' "${url}?key=${key}")"
            printf 'attempt=%s status=%s body=' "$attempt" "$status"
            cat "$body_file"
            printf '\n'

            if [[ "$status" == '200' ]] && node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.ok!==true) process.exit(1); if(!String(x.reply||"").toLowerCase().includes("trenchcoat online")) process.exit(2)' "$body_file"; then
              rm -f "$body_file"
              exit 0
            fi

            rm -f "$body_file"
            sleep 10
          done

          echo 'Inkling production smoke did not converge within the retry window.' >&2
          exit 1
