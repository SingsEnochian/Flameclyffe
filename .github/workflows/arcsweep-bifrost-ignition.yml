name: Arcsweep Bifrost Ignition Gate

on:
  push:
    branches:
      - feature/arcsweep-rich-text-core
      - feature/bifrost-ignition-v1
  pull_request:
    paths:
      - 'apps/arcsweep/**'
      - 'apps/starwell-server/bifrost/**'
      - 'apps/starwell-server/flames/**'
      - 'apps/starwell-server/scripts/bifrost-*.js'
      - 'apps/starwell-server/test/bifrost-*.test.js'
      - 'apps/starwell/src/constellation/models/**'
      - 'IGNITE-*.ps1'
      - 'IGNITE-*.cmd'
      - 'BIFROST-*.cmd'
      - '.github/workflows/arcsweep-bifrost-ignition.yml'

permissions:
  contents: read

jobs:
  ignition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Bifrost server contract tests
        run: >-
          node --test
          apps/starwell-server/test/bifrost-model-profiles.test.js
          apps/starwell-server/test/bifrost-manifest-drift.test.js
          apps/starwell-server/test/bifrost-profile-resolution.test.js
          apps/starwell-server/test/bifrost-preflight.test.js
          apps/starwell-server/test/bifrost-alias-materializer.test.js
          apps/starwell-server/test/bifrost-ignition.test.js
          apps/starwell-server/test/bifrost-ignition-policy.test.js

      - name: Run Arcsweep model and provenance tests
        run: >-
          node --test
          apps/arcsweep/test/runtime-model-binding.test.js
          apps/arcsweep/test/bifrost-ignition-client.test.js
          apps/arcsweep/test/scene-cognition.test.js
          apps/arcsweep/test/self-authorship.test.js
          apps/arcsweep/test/voice-identity-aliases.test.js

      - name: Syntax-check ignition Node CLIs
        run: |
          node --check apps/starwell-server/scripts/bifrost-ignite.js
          node --check apps/starwell-server/scripts/bifrost-ignite-fleet.js
          node --check apps/starwell-server/scripts/bifrost-model-prepare.js
          node --check apps/starwell-server/scripts/bifrost-preflight.js
          node --check apps/starwell-server/scripts/bifrost-materialize-aliases.js

      - name: Syntax-check Windows ignition keys
        shell: pwsh
        run: |
          foreach ($path in @('./IGNITE-BIFROST.ps1','./IGNITE-LIOREAL.ps1')) {
            $text = Get-Content -Raw $path
            [void][scriptblock]::Create($text)
            Write-Host "$path parses successfully."
          }
