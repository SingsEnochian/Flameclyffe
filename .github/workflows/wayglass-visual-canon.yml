name: Wayglass visual canon
on:
  push:
    branches: [wayglass/current]
    paths:
      - 'apps/wayglass/**'
      - 'scripts/wayglass-visual-canon.mjs'
      - '.github/workflows/wayglass-visual-canon.yml'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run wayglass:build
      - name: Capture visual evidence
        shell: bash
        run: |
          npm run wayglass:preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/wayglass-preview.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/wayglass-visual-canon.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayglass-visual-evidence
          path: |
            artifacts/wayglass-visual/
            /tmp/wayglass-preview.log
