name: Vercel Production Authenticated Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  authenticated-production-circulation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[auth-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://flameclyffe.vercel.app
      OIDC_AUDIENCE: flameclyffe-house-smoke/v1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run authenticated production circulation
        shell: bash
        run: |
          node <<'NODE' | tee authenticated-smoke.json
          async function mintToken() {
            const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            requestUrl.searchParams.set('audience', process.env.OIDC_AUDIENCE);
            const tokenResponse = await fetch(requestUrl, {
              headers: { authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            });
            if (!tokenResponse.ok) throw new Error(`GitHub OIDC token request failed: ${tokenResponse.status}`);
            const { value } = await tokenResponse.json();
            if (!value) throw new Error('GitHub OIDC token response was empty.');
            return value;
          }

          const base = process.env.BASE_URL.replace(/\/$/, '');
          let finalReceipt = null;
          for (let attempt = 1; attempt <= 18; attempt += 1) {
            const token = await mintToken();
            const response = await fetch(`${base}/api/v1/house/smoke`, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}` },
              redirect: 'manual',
            });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { error: text.slice(0, 500) || 'non-json response' }; }
            finalReceipt = { attempt, http_status: response.status, ...body };
            if (response.ok && body.ok === true) break;
            if (![401, 404].includes(response.status)) break;
            console.log(`Production smoke endpoint not ready on attempt ${attempt}: ${response.status}`);
            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }
          console.log(JSON.stringify(finalReceipt, null, 2));
          if (!finalReceipt || finalReceipt.http_status !== 200 || finalReceipt.ok !== true) process.exitCode = 1;
          NODE

      - name: Publish authenticated receipt to hosting PR
        if: always()
        shell: bash
        run: |
          STATUS='PASSED'
          if [[ '${{ job.status }}' != 'success' ]]; then STATUS='FAILED'; fi
          {
            echo "### Vercel production authenticated circulation: ${STATUS}"
            echo
            echo 'Production: `https://flameclyffe.vercel.app`'
            echo "Workflow commit: \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            cat authenticated-smoke.json 2>/dev/null || echo '{"ok":false,"error":"authenticated probe failed before receipt"}'
            echo '```'
          } > receipt.md
          gh pr comment 184 --repo SingsEnochian/Flameclyffe --body-file receipt.md
