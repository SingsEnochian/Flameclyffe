name: Vercel Production Authenticated Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  dispatch-authenticated-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[auth-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch trusted workflow run
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch('https://api.github.com/repos/SingsEnochian/Flameclyffe/actions/workflows/vercel-production-authenticated-smoke.yml/dispatches', {
            method: 'POST',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'content-type': 'application/json',
              'x-github-api-version': '2026-03-10',
            },
            body: JSON.stringify({ ref: 'main' }),
          });
          if (response.status !== 204) throw new Error(`Authenticated smoke dispatch failed: ${response.status} ${await response.text()}`);
          console.log('Authenticated production smoke dispatched as workflow_dispatch.');
          NODE

  authenticated-production-circulation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://flameclyffe.vercel.app
      OIDC_AUDIENCE: flameclyffe-house-smoke/v1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run authenticated production circulation
        shell: bash
        run: |
          node <<'NODE' | tee authenticated-smoke.json
          const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          requestUrl.searchParams.set('audience', process.env.OIDC_AUDIENCE);
          const tokenResponse = await fetch(requestUrl, {
            headers: { authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!tokenResponse.ok) throw new Error(`GitHub OIDC token request failed: ${tokenResponse.status}`);
          const { value: token } = await tokenResponse.json();
          if (!token) throw new Error('GitHub OIDC token response was empty.');

          const base = process.env.BASE_URL.replace(/\/$/, '');
          const probes = [
            ['house', '/api/v1/house/smoke'],
            ['aemeth_oa', '/api/v1/house/aemeth-smoke'],
          ];
          const results = {};
          let failed = false;
          for (const [name, path] of probes) {
            const response = await fetch(`${base}${path}`, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}` },
              redirect: 'manual',
            });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { error: text.slice(0, 500) || 'non-json response' }; }
            results[name] = { http_status: response.status, ...body };
            if (!response.ok || body.ok !== true) failed = true;
          }
          console.log(JSON.stringify({ ok: !failed, production: base, probes: results }, null, 2));
          if (failed) process.exitCode = 1;
          NODE

      - name: Publish authenticated receipt to hosting PR
        if: always()
        shell: bash
        run: |
          STATUS='PASSED'
          if [[ '${{ job.status }}' != 'success' ]]; then STATUS='FAILED'; fi
          {
            echo "### Vercel production authenticated circulation: ${STATUS}"
            echo
            echo 'Production: `https://flameclyffe.vercel.app`'
            echo "Workflow commit: \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            cat authenticated-smoke.json 2>/dev/null || echo '{"ok":false,"error":"authenticated probe failed before receipt"}'
            echo '```'
          } > receipt.md
          gh pr comment 184 --repo SingsEnochian/Flameclyffe --body-file receipt.md
