name: BSENG RSE Live Harvest

on:
  pull_request:
    branches:
      - codex/arcsweep-feedback-loop
    paths:
      - '.github/workflows/bseng-rse-live-harvest.yml'
      - 'apps/arcsweep/scripts/bseng-rse-ingest.mjs'
      - 'apps/arcsweep/skills/sources/bseng-rse/site-ingest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    name: Crawl public BSENG corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ingest branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Crawl BSENG public corpus
        run: |
          node apps/arcsweep/scripts/bseng-rse-ingest.mjs \
            --out ingests/bseng-rse-live \
            --max-pages 2500

      - name: Summarise harvest
        if: always()
        run: |
          if [ -f ingests/bseng-rse-live/crawl-report.json ]; then
            cat ingests/bseng-rse-live/crawl-report.json
          fi
          if [ -f ingests/bseng-rse-live/source-index.json ]; then
            node - <<'NODE'
            const fs = require('fs');
            const rows = JSON.parse(fs.readFileSync('ingests/bseng-rse-live/source-index.json','utf8'));
            const counts = rows.reduce((a,r) => ((a[r.source_class]=(a[r.source_class]||0)+1),a),{});
            console.log(JSON.stringify({source_count: rows.length, classes: counts}, null, 2));
            NODE
          fi

      - name: Upload BSENG corpus snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bseng-rse-live-harvest
          path: ingests/bseng-rse-live
          if-no-files-found: error
          retention-days: 14
