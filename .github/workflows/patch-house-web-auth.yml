name: Patch House Web Steward Auth

on:
  push:
    branches:
      - feature/house-web-steward-auth

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/house-web-steward-auth
      - name: Patch House Runtime browser session restore
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/arcsweep/src/house-runtime.js')
          text = path.read_text()
          old = '''export async function restoreHouseRuntimeSession(fetchImpl = fetch) {
            try {
              const { response } = await sessionRequest({}, fetchImpl);
              return response.ok ? HOUSE_COOKIE_SESSION : '';
            } catch { return ''; }
          }
          '''
          new = '''async function signedInSupabaseAccessToken() {
            try {
              const { getKelyranSupabase } = await import('./kelyran-supabase.js');
              const client = await getKelyranSupabase();
              const { data, error } = await client.auth.getSession();
              if (error) return '';
              return data.session?.access_token || '';
            } catch { return ''; }
          }

          export async function restoreHouseRuntimeSession(fetchImpl = fetch, accessTokenProvider = signedInSupabaseAccessToken) {
            try {
              const current = await sessionRequest({}, fetchImpl);
              if (current.response.ok) return HOUSE_COOKIE_SESSION;
              const accessToken = String(await accessTokenProvider() || '').trim();
              if (!accessToken) return '';
              const exchanged = await sessionRequest({
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ supabase_access_token: accessToken }),
              }, fetchImpl);
              return exchanged.response.ok ? HOUSE_COOKIE_SESSION : '';
            } catch { return ''; }
          }
          '''
          if old not in text:
              raise SystemExit('restoreHouseRuntimeSession contract not found; refusing broad patch')
          path.write_text(text.replace(old, new, 1))
      - name: Remove one-shot patch workflow
        run: rm .github/workflows/patch-house-web-auth.yml
      - name: Commit focused patch
        run: |
          git config user.name 'Boxfire CI'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/arcsweep/src/house-runtime.js .github/workflows/patch-house-web-auth.yml
          git commit -m 'feat(house): auto-seal web session from signed-in Steward'
          git push origin HEAD:feature/house-web-steward-auth
