name: Observer Array CI

on:
  pull_request:
    paths:
      - 'apps/starwell-server/**'
      - 'apps/starwell/**'
      - '.github/workflows/observer-array-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  observer-array:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install STARWELL dependencies
        run: npm install

      - name: Check local Observer server syntax
        run: |
          node --check apps/starwell-server/observer-api.js
          node --check apps/starwell-server/routes/observer-scoop.routes.js
          node --check apps/starwell-server/services/observer-scoop/normalization.js
          node --check apps/starwell-server/services/observer-scoop/noaa-swpc.adapter.js
          node --check apps/starwell-server/services/observer-scoop/observer-scoop.runtime.js
          node --check apps/starwell-server/services/observer-scoop/observer-scoop.service.js
          node --check apps/starwell-server/services/observer-scoop/supabase.store.js

      - name: Run Observer normalization and runtime tests
        shell: bash
        run: |
          set +e
          node --test apps/starwell-server/services/observer-scoop/*.test.js > /tmp/observer-tests.log 2>&1
          status=$?
          tail -n 200 /tmp/observer-tests.log
          exit $status

      - name: Run STARWELL helper tests
        id: starwell_tests
        shell: bash
        run: |
          set +e
          npm run starwell:test > /tmp/starwell-tests.log 2>&1
          status=$?
          tail -n 200 /tmp/starwell-tests.log
          exit $status

      - name: Post concise failure receipt
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- observer-array-ci-failure -->';
            const files = ['/tmp/observer-tests.log', '/tmp/starwell-tests.log'];
            const sections = [];
            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              const lines = fs.readFileSync(file, 'utf8').trim().split('\n').slice(-140);
              sections.push(`### ${file.split('/').pop()}\n\n\`\`\`text\n${lines.join('\n')}\n\`\`\``);
            }
            const body = `${marker}\n## Observer Array CI failure receipt\n\n${sections.join('\n\n')}`.slice(0, 60000);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Build STARWELL including Veil Observatory
        run: npm run starwell:build
