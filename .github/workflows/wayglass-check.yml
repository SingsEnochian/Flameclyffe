name: Wayglass Check

on:
  pull_request:
    paths:
      - 'apps/wayglass/**'
      - 'apps/starwell-server/wayglass/**'
      - 'apps/starwell-server/test/wayglass-*.test.js'
      - 'apps/starwell-server/test/security-boundary.test.js'
      - 'apps/starwell-server/server.js'
      - 'lib/wayglass-*'
      - 'api/_shared/wayglass-gateway.mjs'
      - 'api/v1/wayglass/**'
      - 'vercel.json'
      - 'test/wayglass/**'
      - 'scripts/wayglass-return-trial-001.mjs'
      - 'apps/starwell-server/package*.json'
      - 'docs/architecture/WAYGLASS_OS_V0_1.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wayglass-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wayglass:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax-check Wayglass server ingress
        run: node --check apps/starwell-server/wayglass/router.js
      - name: Install host dependencies for HTTP integration tests
        run: npm ci --prefix apps/starwell-server --omit=dev --ignore-scripts
      - run: npm run wayglass:test
      - name: Run Return Trial 001 paired continuation
        run: node scripts/wayglass-return-trial-001.mjs
      - name: Preserve Return Trial 001 outcome receipts
        uses: actions/upload-artifact@v4
        with:
          name: wayglass-return-trial-001-${{ github.sha }}
          path: artifacts/wayglass/return-trial-001.json
          if-no-files-found: error
          retention-days: 30
      - name: Run authenticated Wayglass host tests
        run: node --test apps/starwell-server/test/wayglass-*.test.js apps/starwell-server/test/security-boundary.test.js
      - run: npm run wayglass:build
      - run: npm run wayglass:stage:server
      - name: Verify staged host
        run: test -f apps/starwell-server/public/wayglass/index.html

      - run: npm run wayglass:stage:vercel
      - name: Verify preview browser bundle
        run: test -f dist/starwell/wayglass/index.html
