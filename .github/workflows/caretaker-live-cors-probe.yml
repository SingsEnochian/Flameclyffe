name: Caretaker live CORS probe

on:
  push:
    branches:
      - probe/caretaker-live-cors

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect direct shared Caretaker route
        shell: bash
        run: |
          set -euo pipefail
          for method in OPTIONS GET; do
            headers="$(mktemp)"
            body="$(mktemp)"
            if [ "$method" = OPTIONS ]; then
              code="$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' -X OPTIONS \
                -H 'Origin: https://singsenochian.github.io' \
                -H 'Access-Control-Request-Method: POST' \
                -H 'Access-Control-Request-Headers: authorization,content-type' \
                'https://flameclyffe.vercel.app/api/v1/house/rooms?house_action=caretaker')"
            else
              code="$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' \
                -H 'Origin: https://singsenochian.github.io' \
                'https://flameclyffe.vercel.app/api/v1/house/rooms?house_action=caretaker')"
            fi
            echo "=== $method $code ==="
            cat "$headers"
            cat "$body"
            echo
          done
