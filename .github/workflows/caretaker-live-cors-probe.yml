name: Caretaker live CORS probe

on:
  push:
    branches:
      - probe/caretaker-live-cors

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Caretaker Edge preflight
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://rufrmjyusalnifpegllj.supabase.co/functions/v1/arcsweep-caretaker'
          headers="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://singsenochian.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            "$endpoint")"
          cat "$headers"
          test "$code" = '204'
          grep -qi '^access-control-allow-origin: https://singsenochian.github.io' "$headers"
          grep -qi '^access-control-allow-headers:.*authorization' "$headers"

      - name: Probe unauthenticated Edge error visibility
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://rufrmjyusalnifpegllj.supabase.co/functions/v1/arcsweep-caretaker'
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -D "$headers" -w '%{http_code}' \
            -H 'Origin: https://singsenochian.github.io' \
            "$endpoint")"
          cat "$headers"
          cat "$body"
          test "$code" = '401'
          grep -qi '^access-control-allow-origin: https://singsenochian.github.io' "$headers"
          grep -q 'ArcSweep Steward sign-in required' "$body"
