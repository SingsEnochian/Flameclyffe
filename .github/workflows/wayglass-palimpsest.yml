name: Wayglass Mobius Palimpsest
on:
  push:
    branches: [wayglass/current]
    paths:
      - 'lib/wayglass-mobius-palimpsest.mjs'
      - 'lib/wayglass-mobius-palimpsest.test.mjs'
      - '.github/workflows/wayglass-palimpsest.yml'
  pull_request:
    paths:
      - 'lib/wayglass-mobius-palimpsest.mjs'
      - 'lib/wayglass-mobius-palimpsest.test.mjs'
      - '.github/workflows/wayglass-palimpsest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test lib/wayglass-mobius-palimpsest.test.mjs
