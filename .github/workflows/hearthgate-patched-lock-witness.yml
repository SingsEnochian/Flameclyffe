name: Hearthgate Patched Lockfile Witness

on:
  pull_request:
    paths:
      - 'apps/starwell-server/package.json'
      - '.github/workflows/hearthgate-patched-lock-witness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate deterministic npm lock from patched manifest
        working-directory: apps/starwell-server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install from generated lock
        working-directory: apps/starwell-server
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Enforce real production dependency security audit
        working-directory: apps/starwell-server
        run: npm audit --omit=dev --audit-level=high
      - name: Record patched version evidence
        working-directory: apps/starwell-server
        run: |
          node -e "const p=require('./package-lock.json'); for(const n of ['body-parser','multer','qs']) console.log(n,p.packages['node_modules/'+n]?.version)"
      - name: Emit source-audited lockfile chunks for connected repository write
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('apps/starwell-server/package-lock.json', 'utf8');
          console.log('WAYGLASS_LOCK_BEGIN');
          for (let i = 0; i < lock.length; i += 200) {
            console.log('WAYGLASS_LOCK_CHUNK:' + JSON.stringify(lock.slice(i, i + 200)));
          }
          console.log('WAYGLASS_LOCK_END:' + lock.length);
          NODE
      - name: Preserve generated lockfile for source-reviewed commit
        uses: actions/upload-artifact@v4
        with:
          name: hearthgate-patched-package-lock
          path: apps/starwell-server/package-lock.json
          retention-days: 7
          if-no-files-found: error
