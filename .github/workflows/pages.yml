name: Deploy Flameclyffe Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build STARWELL React Observatory Lab
        env:
          STARWELL_BASE: /Flameclyffe/starwell-react-lab/
        run: npm run starwell:build

      - name: Build Pocket Concordance Lens
        run: npm run pocket:build

      - name: Assemble static Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'apps' \
            --exclude 'dist' \
            --exclude 'node_modules' \
            --exclude 'sandbox' \
            --exclude 'package-lock.json'

          mkdir -p _site/starwell-react-lab
          cp -R dist/starwell/* _site/starwell-react-lab/

          test -f _site/starwell-react-lab/unit-resonance-lab.html
          for route in unit-resonance-lab resonance-lab; do
            mkdir -p "_site/starwell-react-lab/${route}"
            cp _site/starwell-react-lab/unit-resonance-lab.html "_site/starwell-react-lab/${route}/index.html"
          done

          mkdir -p _site/pocket-concordance-lens
          cp -R dist/pocket-concordance-lens/* _site/pocket-concordance-lens/

          test -f _site/pocket-concordance-lens/index.html
          for route in concordance pocket-lens pocket-concordance pocket; do
            mkdir -p "_site/${route}"
            cp -R dist/pocket-concordance-lens/* "_site/${route}/"
          done

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
