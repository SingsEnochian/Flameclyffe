name: Deploy Flameclyffe Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Flameclyffe Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify canonical Pages ownership
        shell: bash
        run: |
          set -euo pipefail
          offenders="$(grep -R -l 'actions/deploy-pages@' .github/workflows --include='*.yml' --include='*.yaml' | grep -v '^.github/workflows/pages.yml$' || true)"
          if [ -n "$offenders" ]; then
            echo 'Competing GitHub Pages publisher detected:' >&2
            echo "$offenders" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify current engine contracts and suites
        run: |
          npm run contracts:verify
          npm run starwell:test
          npm run arcsweep:test
          node scripts/verify-arcsweep-organ-routes.mjs

      - name: Build existing STARWELL React Observatory Lab
        env:
          STARWELL_BASE: /Flameclyffe/starwell-react-lab/
        run: |
          npm run starwell:build
          test -f dist/starwell/glyph-studio/index.html
          test -f dist/starwell/living-glyph/index.html
          test -f dist/starwell/font-foundry/index.html
          test -f dist/starwell/arcsweep-continuity/index.html
          rm -rf /tmp/starwell-react-lab
          mkdir -p /tmp/starwell-react-lab
          cp -a dist/starwell/. /tmp/starwell-react-lab/

      - name: Build current Bifröst Live layer
        env:
          STARWELL_BASE: /Flameclyffe/bifrost-live/
        run: |
          npm run starwell:build
          test -f dist/starwell/index.html
          test -f dist/starwell/bifrost/index.html
          test -f dist/starwell/arcsweep-continuity/index.html
          grep -R -F "two-shore-loop-playback" dist/starwell/assets >/dev/null
          grep -R -F "two-shore-shokz-confirm" dist/starwell/assets >/dev/null
          grep -R -F "hearthgate.two-shore-coil-release-spiral/v0.1" dist/starwell/assets >/dev/null
          grep -R -F "hearthgate.two-shore-eleven-year-wav/v0.1" dist/starwell/assets >/dev/null
          rm -rf /tmp/bifrost-live
          mkdir -p /tmp/bifrost-live
          cp -a dist/starwell/. /tmp/bifrost-live/
          printf '%s\n' \
            "Flameclyffe Pages · Bifröst Live" \
            "Source commit: $GITHUB_SHA" \
            "Source branch: $GITHUB_REF_NAME" \
            "Both web Arcsweep and Hearthgate Bifröst load the same sensory bundle." \
            "Formalism: compression → release → compression of the release" \
            > /tmp/bifrost-live/LIVE-BUILD-RECEIPT.txt

      - name: Build Arcsweep Worldseed Foundry
        run: |
          npm run arcsweep:build
          test -f dist/arcsweep/index.html
          test -d dist/arcsweep/assets

      - name: Verify Arcsweep production module boundary
        run: |
          set -euo pipefail
          if grep -Fq './src/main-bootstrap.js' dist/arcsweep/index.html; then
            echo 'ArcSweep production index still references source main-bootstrap.js' >&2
            exit 1
          fi
          if grep -Fq './src/startup-fetch-guard.js' dist/arcsweep/index.html; then
            echo 'ArcSweep production index still references source startup-fetch-guard.js' >&2
            exit 1
          fi
          if grep -R -Fq "import './styles.css'" dist/arcsweep; then
            echo 'ArcSweep production output still contains raw CSS-as-module source import' >&2
            exit 1
          fi
          grep -Eq '<script[^>]+type="module"[^>]+src="\./assets/[^\"]+\.js"' dist/arcsweep/index.html
          grep -Eq '<link[^>]+rel="stylesheet"[^>]+href="\./assets/[^\"]+\.css"' dist/arcsweep/index.html

      - name: Build Pocket Concordance Lens
        run: npm run pocket:build

      - name: Assemble static Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'apps' \
            --exclude 'dist' \
            --exclude 'node_modules' \
            --exclude 'sandbox' \
            --exclude 'package-lock.json'

          mkdir -p _site/apps/arcsweep
          cp -a dist/arcsweep/. _site/apps/arcsweep/
          test -f _site/apps/arcsweep/index.html
          if grep -Fq './src/main-bootstrap.js' _site/apps/arcsweep/index.html; then
            echo 'Pages artifact contains ArcSweep source module entrypoint' >&2
            exit 1
          fi
          if grep -R -Fq "import './styles.css'" _site/apps/arcsweep; then
            echo 'Pages artifact contains raw ArcSweep CSS module import' >&2
            exit 1
          fi
          grep -Eq '<script[^>]+type="module"[^>]+src="\./assets/[^\"]+\.js"' _site/apps/arcsweep/index.html

          mkdir -p _site/starwell-react-lab
          cp -a /tmp/starwell-react-lab/. _site/starwell-react-lab/
          test -f _site/starwell-react-lab/unit-resonance-lab.html
          for route in unit-resonance-lab resonance-lab; do
            mkdir -p "_site/starwell-react-lab/${route}"
            cp _site/starwell-react-lab/unit-resonance-lab.html "_site/starwell-react-lab/${route}/index.html"
          done

          node scripts/verify-arcsweep-organ-routes.mjs --site _site

          mkdir -p _site/bifrost-live
          cp -a /tmp/bifrost-live/. _site/bifrost-live/
          test -f _site/bifrost-live/index.html
          test -f _site/bifrost-live/bifrost/index.html
          test -f _site/bifrost-live/arcsweep-continuity/index.html
          test -f _site/bifrost-live/LIVE-BUILD-RECEIPT.txt

          mkdir -p _site/pocket-concordance-lens
          cp -R dist/pocket-concordance-lens/* _site/pocket-concordance-lens/
          test -f _site/pocket-concordance-lens/index.html
          for route in concordance pocket-lens pocket-concordance pocket; do
            mkdir -p "_site/${route}"
            cp -R dist/pocket-concordance-lens/* "_site/${route}/"
          done

          cat > _site/PAGES-BUILD-RECEIPT.txt <<EOF
          Flameclyffe GitHub Pages
          Source commit: $GITHUB_SHA
          Source branch: $GITHUB_REF_NAME
          Publisher: .github/workflows/pages.yml
          Arcsweep: /Flameclyffe/apps/arcsweep/
          Bifröst Live: /Flameclyffe/bifrost-live/
          STARWELL Lab: /Flameclyffe/starwell-react-lab/
          Glyph Lab: /Flameclyffe/starwell-react-lab/glyph-studio/
          Living Glyph: /Flameclyffe/starwell-react-lab/living-glyph/
          Font Foundry: /Flameclyffe/starwell-react-lab/font-foundry/
          Continuity Gate: /Flameclyffe/starwell-react-lab/arcsweep-continuity/
          EOF

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
