name: Deploy Flameclyffe Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build STARWELL React Observatory
        run: npm run starwell:build

      - name: Assemble static Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'apps' \
            --exclude 'dist' \
            --exclude 'node_modules' \
            --exclude 'sandbox' \
            --exclude 'package-lock.json'

          mkdir -p _site/starwell
          if [ -f starwell/index.html ]; then
            cp starwell/index.html _site/starwell/branch-door.html
          fi

          rm -rf _site/starwell
          mkdir -p _site/starwell
          cp -R dist/starwell/* _site/starwell/

          if [ -f starwell/index.html ]; then
            cp starwell/index.html _site/starwell/branch-door.html
          fi

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
