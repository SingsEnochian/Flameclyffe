name: Wayglass Vite dependency repair (temporary)

on:
  push:
    branches:
      - wayglass/spelling-wtl-model-routes-20261106
    paths:
      - .github/workflows/wayglass-dependency-repair.yml

permissions:
  contents: write

jobs:
  pinned-vite-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wayglass/spelling-wtl-model-routes-20261106
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin a patched Vite release and regenerate the real npm lockfile
        run: |
          npm install -g npm@11.16.0
          npm install vite@8.3.6 --save-exact --ignore-scripts --no-fund --no-audit
      - name: Verify high-severity dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Wayglass build with patched Vite
        run: npm run wayglass:build
      - name: Preserve exact published integrity in source control
        run: |
          git config user.name "Wayglass dependency repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already patched"
          else
            git commit -m "security(vite): pin audited 8.3.6 with regenerated lockfile"
            git push origin HEAD:wayglass/spelling-wtl-model-routes-20261106
          fi
