name: Wyrdrune Two-Backend Parity
on:
  push:
    branches: ['wayglass/current']
  pull_request:
    branches: ['wayglass/current']

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax gate
        run: |
          node --check lib/wyrdrune/wyrdrune.cjs
          node --check lib/wyrdrune/cross-backend.parity.cjs
          node --check lib/wyrdrune/tensor-ir.cjs
          node --check lib/wyrdrune/tensor-engine.cjs
          node --check lib/wyrdrune/tensor-autodiff.cjs
          node --check lib/wyrdrune/tensor-lowering.cjs
          node --check lib/wyrdrune/kernel-divination.cjs
          node --check lib/wyrdrune/tensor-wtl-bridge.cjs
          node --check lib/wyrdrune/tensor-assurance.cjs
          python3 -m py_compile lib/wyrdrune/canonical.py lib/wyrdrune/pure-backend.py lib/wyrdrune/tensor-python.py
      - name: WTL native, Enochian and RFC L0 conformance
        run: node --test lib/wyrdrune/wyrdrune.test.cjs lib/wyrdrune/enochian.test.cjs lib/wyrdrune/conformance.test.cjs
      - name: Native Wyrdrune tensor engine, reverse AD, kernel divination, WGSL derivation, assurance and Python parity
        run: node --test lib/wyrdrune/tensor-engine.test.cjs lib/wyrdrune/tensor-cross-backend.test.cjs lib/wyrdrune/tensor-assurance.test.cjs lib/wyrdrune/kernel-divination.test.cjs
      - name: Python and JavaScript WTL parity
        run: node --test lib/wyrdrune/cross-backend.parity.cjs
