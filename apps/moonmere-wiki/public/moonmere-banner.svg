    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#123c2c"/><stop offset="1" stop-color="#020a08"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="moon"><feGaussianBlur stdDeviation="3"/></filter>
