<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" role="img" aria-labelledby="title desc">
  <title id="title">Moonmere Archive banner</title>
  <desc id="desc">An emerald forest surrounds a gold-lit moon gate reflected in dark water beneath three moons.</desc>
