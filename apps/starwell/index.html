<!doctype html>
<html>
<head>
  <meta charset='UTF-8'/>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover'/>
  <meta name='theme-color' content='#07100d'/>
  <meta name='apple-mobile-web-app-capable' content='yes'/>
  <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'/>
  <meta name='mobile-web-app-capable' content='yes'/>
  <title>ARCSWEEP · Hearthgate</title>
  <meta name='description' content='ARCSWEEP in Hearthgate: a shared shell between STARWELL rooms, worlds, instruments, continuity, and records.'/>
  <style>
    #arcsweep-boot-status{margin:1rem;padding:.8rem 1rem;border:1px solid #d8b56a66;border-radius:.8rem;background:#071411;color:#f0eadb;font:600 .86rem/1.4 system-ui,sans-serif}
    #arcsweep-boot-status[data-state='failed']{border-color:#df8d78;color:#ffd8cf}
  </style>
  <script>
    window.addEventListener('error', function (event) {
      var status = document.getElementById('arcsweep-boot-status');
      if (!status) return;
      status.dataset.state = 'failed';
      status.textContent = 'Arcsweep could not finish opening: ' + (event.message || 'unknown boot error');
    });
    window.addEventListener('unhandledrejection', function (event) {
      var status = document.getElementById('arcsweep-boot-status');
      if (!status) return;
      status.dataset.state = 'failed';
      status.textContent = 'Arcsweep live systems failed during opening: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason));
    });
  </script>
  <script type='module' src='./src/main.jsx'></script>
  <script type='module' src='./src/city-state-motion.jsx'></script>
  <script type='module' src='./src/deep-material-vars-bind.js'></script>
  <script type='module' src='./src/deep-hud-socket-bind.js'></script>
  <script type='module' src='./src/deep-hud-bounds-bind.js'></script>
  <script type='module'>
    if (import.meta.env.DEV) {
      import('./src/deep-hud-debug-bead.js');
      import('./src/deep-hud-socket-diagnostics.js');
      import('./src/deep-hud-dev-assertions.js');
    }
  </script>
  <script type='module' src='./src/hearthgate-arcsweep.js'></script>
  <script type='module' src='./src/arcsweep-continuity/session-context-indicator.js'></script>
  <script type='module' src='./src/premaq-shokz-soundfont.js'></script>
  <script type='module' src='./src/premaq-shokz-feather-stop-bridge.js'></script>
  <link rel='stylesheet' href='./src/starwell-hero-art.css'/>
  <link rel='stylesheet' href='./src/deep-observer-mobile.css'/>
  <link rel='stylesheet' href='./src/deep-hud-bounds.css'/>
  <link rel='stylesheet' href='./src/stonewood-themes.css'/>
  <link rel='stylesheet' href='./src/emerald-reliquary-hero.css'/>
  <link rel='stylesheet' href='./src/stonewood-typography.css'/>
  <link rel='stylesheet' href='./src/starwell-desktop-containment.css'/>
</head>
<body>
  <div id='arcsweep-boot-status' role='status'>Opening Arcsweep and seating the shared Math Spine…</div>
  <div id='root'></div>
  <div id='city-state-motion-root'></div>
</body>
</html>
