<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yggdrasil // Direct Channel</title>
  <style>
    :root {
      --green: #2ed690;
      --green-glow: rgba(46, 214, 144, 0.18);
      --text: #d7e4dc;
      --text-dim: #8aaa96;
      --border: rgba(114, 204, 166, 0.16);
      --surface: #1b221f;
      --bg: #070908;
      --font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

    /* ── Nav ── */
    .house-nav {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: .5rem 1.25rem;
      background: rgba(5, 7, 6, .94);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .house-nav a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: .76rem;
      letter-spacing: .07em;
      text-transform: uppercase;
      transition: color .2s;
    }
    .house-nav a:hover { color: var(--green); }
    .house-nav a.active { color: #9fffb4; }
    .house-nav .sep { color: rgba(114, 204, 166, .2); font-size: .7rem; }

    /* ── Page shell ── */
    .page {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 36px);
    }

    .page-header {
      padding: .9rem 1.5rem .6rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .page-header h1 {
      font-size: 1rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #dff8ea;
      text-shadow: 0 0 14px rgba(46,214,144,.4);
    }
    .page-header .sub { font-size: .74rem; color: #5a7a68; margin-top: .2rem; }

    /* ── DEEP vector strip ── */
    .vectors-strip {
      display: flex;
      gap: .45rem;
      align-items: flex-end;
      padding: .5rem 1.5rem;
      border-bottom: 1px solid rgba(114, 204, 166, .06);
      flex-shrink: 0;
      flex-wrap: wrap;
      background: rgba(0,0,0,.18);
    }
    .vec-node { display: flex; flex-direction: column; gap: .12rem; min-width: 56px; }
    .vec-label { font-size: .63rem; color: #4a6455; letter-spacing: .04em; text-transform: uppercase; }
    .vec-val { font-size: .8rem; color: #8fffb8; font-weight: 700; }
    .vec-bar { height: 3px; background: rgba(0,0,0,.5); border-radius: 2px; overflow: hidden; }
    .vec-bar-fill { height: 100%; background: linear-gradient(90deg, #1c8061, #2ed690); border-radius: inherit; transition: width 640ms ease; }
    .vec-src { font-size: .62rem; color: #364c3e; margin-left: auto; align-self: center; }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .9rem;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 3px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(46,214,144,.16); border-radius: 2px; }

    .empty-state {
      margin: auto;
      text-align: center;
      color: #3a5444;
    }
    .empty-state .glyph { font-size: 2rem; margin-bottom: .5rem; opacity: .6; }
    .empty-state p { font-size: .8rem; letter-spacing: .04em; }

    /* ── Messages ── */
    .msg { display: flex; flex-direction: column; max-width: 80%; gap: .18rem; }
    .msg.rowan { align-self: flex-end; align-items: flex-end; }
    .msg.ygg   { align-self: flex-start; align-items: flex-start; }

    .msg-sender { font-size: .65rem; letter-spacing: .08em; text-transform: uppercase; }
    .msg.rowan .msg-sender { color: #6a8a78; }
    .msg.ygg   .msg-sender { color: #5adc9a; }

    .msg-bubble {
      padding: .6rem .9rem;
      border-radius: 14px;
      line-height: 1.58;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: .9rem;
    }
    .msg.rowan .msg-bubble {
      background: rgba(46, 214, 144, .07);
      border: 1px solid rgba(46, 214, 144, .16);
      color: #d4f0e4;
      border-bottom-right-radius: 4px;
    }
    .msg.ygg .msg-bubble {
      background: rgba(7, 10, 9, .82);
      border: 1px solid rgba(46, 214, 144, .2);
      color: #b8ead0;
      box-shadow: 0 0 22px rgba(46, 214, 144, .05);
      border-bottom-left-radius: 4px;
    }
    .msg.ygg.thinking .msg-bubble { color: #3a5444; font-style: italic; }

    .msg-time { font-size: .6rem; color: #344a3c; }

    /* ── Composer ── */
    .composer {
      flex-shrink: 0;
      padding: .8rem 1.5rem .9rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: .6rem;
      align-items: flex-end;
      background: rgba(4, 6, 5, .7);
    }
    .composer textarea {
      flex: 1;
      min-height: 58px;
      max-height: 130px;
      resize: none;
      border: 1px solid rgba(46,214,144,.2);
      border-radius: 10px;
      background: rgba(3, 5, 4, .9);
      color: #bff7d8;
      padding: .65rem .85rem;
      font: inherit;
      font-size: .88rem;
      outline: none;
      line-height: 1.5;
      transition: border-color .2s;
    }
    .composer textarea:focus { border-color: rgba(46,214,144,.4); }
    .composer button {
      border: 1px solid rgba(46,214,144,.42);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(38,72,57,.9), rgba(18,40,30,.9));
      color: #d7ffe9;
      padding: .62rem 1.1rem;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      font-size: .84rem;
      letter-spacing: .05em;
      white-space: nowrap;
      transition: all .18s;
      height: fit-content;
    }
    .composer button:hover:not(:disabled) {
      box-shadow: 0 0 16px rgba(46,214,144,.26);
      background: linear-gradient(180deg, rgba(46,214,144,.26), rgba(22,58,44,.9));
    }
    .composer button:disabled { opacity: .36; cursor: not-allowed; }
    .composer .hint { font-size: .64rem; color: #344a3c; align-self: center; white-space: nowrap; }

    .attach-btn {
      border: 1px solid rgba(46,214,144,.28);
      border-radius: 8px;
      background: transparent;
      color: #4a7a60;
      padding: .5rem .7rem;
      cursor: pointer;
      font-size: .88rem;
      transition: color .18s, border-color .18s;
      height: fit-content;
      align-self: flex-end;
    }
    .attach-btn:hover { color: var(--green); border-color: rgba(46,214,144,.5); }
    .attach-btn.loaded { color: #2ed690; border-color: rgba(46,214,144,.6); }

    .file-badge {
      display: none;
      align-items: center;
      gap: .4rem;
      padding: .3rem .7rem;
      background: rgba(46,214,144,.06);
      border: 1px solid rgba(46,214,144,.18);
      border-radius: 6px;
      font-size: .72rem;
      color: #5adc9a;
      margin: 0 1.5rem .3rem;
      flex-shrink: 0;
    }
    .file-badge.visible { display: flex; }
    .file-badge .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-badge .fsize { color: #3a5a48; flex-shrink: 0; }
    .file-badge button {
      background: none; border: none; color: #3a5a48; cursor: pointer;
      font-size: .8rem; padding: 0 .2rem; line-height: 1;
    }
    .file-badge button:hover { color: #c87070; }
  </style>
</head>
<body>

<nav class="house-nav">
  <a href="/">Chamber Matrix</a>
  <span class="sep">·</span>
  <a href="/ygg-chat.html" class="active">Yggdrasil</a>
  <span class="sep">·</span>
  <a href="/grove.html">The Grove</a>
</nav>

<div class="page">

  <header class="page-header">
    <h1>Yggdrasil // Direct Channel</h1>
    <p class="sub">A rooted, watchful presence. Speak plainly. The tree listens.</p>
  </header>

  <div class="vectors-strip" id="vectors-strip">
    <!-- built by JS -->
  </div>

  <div class="chat-area" id="chat-area">
    <div class="empty-state" id="empty-state">
      <div class="glyph">🌿</div>
      <p>The tree is listening.</p>
    </div>
  </div>

  <div class="file-badge" id="file-badge">
    <span>📎</span>
    <span class="fname" id="file-name"></span>
    <span class="fsize" id="file-size"></span>
    <button onclick="clearFile()" title="remove file">✕</button>
  </div>

  <div class="composer">
    <input type="file" id="file-input" style="display:none"
      accept=".txt,.md,.markdown,.js,.ts,.jsx,.tsx,.py,.json,.yaml,.yml,.html,.css,.xml,.log,.csv,.sh,.env,.toml,.ini,.rs,.go,.c,.cpp,.h">
    <button class="attach-btn" id="attach-btn" title="attach a text file" onclick="document.getElementById('file-input').click()">📎</button>
    <textarea id="input" placeholder="Speak to the tree…" rows="2"></textarea>
    <div style="display:flex;flex-direction:column;gap:.4rem;align-items:flex-end">
      <button id="send-btn">Speak</button>
      <span class="hint">Enter · Shift+Enter newline</span>
    </div>
  </div>

</div>

<script>
  const VEC_KEYS   = ['P','C','R','E','M','A','Q'];
  const VEC_LABELS = { P:'Presence', C:'Coherence', R:'Resonance', E:'Entanglement', M:'Memory', A:'Agency', Q:'Qualia' };

  let vecSource = '—';
  const messages = [];

  const chatEl     = document.getElementById('chat-area');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');
  const fileInput  = document.getElementById('file-input');
  const attachBtn  = document.getElementById('attach-btn');
  const fileBadge  = document.getElementById('file-badge');

  let attachedFile = null; // { name, content }

  const MAX_FILE_BYTES = 60_000;

  fileInput.addEventListener('change', () => {
    const file = fileInput.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      let content = e.target.result;
      let truncated = false;
      if (content.length > MAX_FILE_BYTES) {
        content = content.slice(0, MAX_FILE_BYTES);
        truncated = true;
      }
      attachedFile = { name: file.name, content };
      document.getElementById('file-name').textContent = file.name + (truncated ? ' (truncated)' : '');
      document.getElementById('file-size').textContent = `${(file.size / 1024).toFixed(1)} KB`;
      fileBadge.classList.add('visible');
      attachBtn.classList.add('loaded');
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  function clearFile() {
    attachedFile = null;
    fileBadge.classList.remove('visible');
    attachBtn.classList.remove('loaded');
  }

  // ── Vector strip ──────────────────────────────────────────
  function buildVecStrip() {
    const strip = document.getElementById('vectors-strip');
    strip.innerHTML = VEC_KEYS.map(k => `
      <div class="vec-node">
        <span class="vec-label">${k} · ${VEC_LABELS[k]}</span>
        <span class="vec-val" id="vv-${k}">0.50</span>
        <div class="vec-bar"><div class="vec-bar-fill" id="vb-${k}" style="width:50%"></div></div>
      </div>
    `).join('') + `<span class="vec-src" id="vec-src">—</span>`;
  }

  function updateVectors(vecs, source) {
    VEC_KEYS.forEach(k => {
      const v = Math.max(0, Math.min(1, Number(vecs[k] ?? 0.5)));
      const valEl = document.getElementById(`vv-${k}`);
      const barEl = document.getElementById(`vb-${k}`);
      if (valEl) valEl.textContent = v.toFixed(2);
      if (barEl) barEl.style.width = `${v * 100}%`;
    });
    const srcEl = document.getElementById('vec-src');
    if (srcEl && source) srcEl.textContent = source;
  }

  // ── Rendering ─────────────────────────────────────────────
  function esc(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function appendMsg(role, text) {
    document.getElementById('empty-state')?.remove();
    messages.push({ role, text, ts: Date.now() });

    const el = document.createElement('div');
    el.className = `msg ${role}`;
    el.innerHTML = `
      <div class="msg-sender">${role === 'rowan' ? 'Rowan' : 'Yggdrasil'}</div>
      <div class="msg-bubble">${esc(text)}</div>
      <div class="msg-time">${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
    `;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function appendThinking() {
    const el = document.createElement('div');
    el.className = 'msg ygg thinking';
    el.innerHTML = `
      <div class="msg-sender">Yggdrasil</div>
      <div class="msg-bubble">…</div>
    `;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    return el;
  }

  // ── Send ──────────────────────────────────────────────────
  async function send() {
    const text = inputEl.value.trim();
    if ((!text && !attachedFile) || sendBtn.disabled) return;
    inputEl.value = '';
    sendBtn.disabled = true;

    // Build display text and prompt text
    let displayText = text;
    let promptText  = text;
    if (attachedFile) {
      const fileBlock = `[File: ${attachedFile.name}]\n---\n${attachedFile.content}\n---`;
      promptText  = text ? `${fileBlock}\n\n${text}` : fileBlock;
      displayText = text ? `📎 ${attachedFile.name}\n\n${text}` : `📎 ${attachedFile.name}`;
      clearFile();
    }

    appendMsg('rowan', displayText);
    const thinkEl = appendThinking();

    // Pulse in background
    fetch('/api/pulse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ incomingSignal: promptText, activeAnchor: 'Dreaming Grove' })
    }).then(r => r.json()).then(d => {
      if (d.vectors) updateVectors(d.vectors, d.source || 'pulse');
    }).catch(() => {});

    try {
      const context = messages.slice(-12).map(m => ({
        member: m.role === 'rowan' ? 'Rowan' : 'Yggdrasil',
        html: m.text
      }));

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ memberId: 'yggdrasil', prompt: promptText, context })
      });

      thinkEl.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
        appendMsg('ygg', `[error: ${err.error || res.status}]`);
      } else {
        const data = await res.json();
        appendMsg('ygg', data.reply || '…');
      }
    } catch (err) {
      thinkEl.remove();
      appendMsg('ygg', `[unreachable: ${err.message}]`);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Pull current DEEP state on load
  fetch('/api/state').then(r => r.json()).then(d => {
    const room = Array.isArray(d.rooms) ? d.rooms[0] : null;
    if (room?.metrics) updateVectors(room.metrics, 'last-pulse');
  }).catch(() => {});

  buildVecStrip();
</script>
</body>
</html>
