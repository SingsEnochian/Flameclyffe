<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Observer Almanac</title><style>*{box-sizing:border-box}:root{color-scheme:dark;--m:#70f0bd;--g:#f0ce70;--v:#b6a7ff;--line:rgba(126,235,198,.22)}body{margin:0;min-height:100dvh;padding:clamp(1rem,3vw,2.6rem);background:radial-gradient(circle at 15% 0,rgba(31,158,116,.29),transparent 30rem),radial-gradient(circle at 85% 5%,rgba(111,83,205,.22),transparent 30rem),#050a08;color:#eafff4;font:14px/1.5 ui-monospace,monospace}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2.6rem,5vw,4.8rem);margin:.1em 0}.eyebrow{color:var(--m);letter-spacing:.17em;text-transform:uppercase}.muted{color:#91aa9e}.tabs,.actions,.tags{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0}button{padding:.55rem .8rem;border:1px solid var(--line);border-radius:9px;background:rgba(2,15,11,.68);color:#dcf4e8;cursor:pointer}button.active,button:hover{border-color:var(--m);color:var(--m)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.75rem}.card,.metric{border:1px solid var(--line);border-radius:15px;padding:1rem;background:linear-gradient(140deg,rgba(255,255,255,.09),transparent 28%),rgba(10,29,23,.66);backdrop-filter:blur(24px) saturate(150%);box-shadow:inset 0 1px rgba(255,255,255,.13),0 17px 44px rgba(0,0,0,.22)}.card h2{color:#f3e7c4;margin:.2rem 0}.tag{border:1px solid var(--line);border-radius:99px;padding:.1rem .35rem;color:var(--m);font-size:.64rem}.vector{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem}.vector span{font-size:.65rem;color:#8ca398}.vector b{display:block;color:var(--g)}.metric strong{font-size:1.5rem;color:var(--g)}pre{white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:2rem;border:1px dashed var(--line);border-radius:13px;color:#91aa9e}</style></head><body><div class="eyebrow">Hearthgate · Observer Almanac</div><h1>Packets of witness</h1><p class="muted">Each packet keeps the observation, PREMAQ vector, glyph, narrative, privacy, locus, and source receipts together. Pattern views count recurrence; they do not declare cause.</p><div class="tabs"><button data-view="private" class="active">Private Almanac</button><button data-view="wiki">Wiki Export</button><button data-view="patterns">Pattern Lab</button><button id="refresh">Refresh</button></div><main id="content"></main><script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let packets=[],view='private';const dl=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
function vector(p){return `<div class="vector">${['P','C','R','E','M','A','Q'].map(k=>`<span>${k}<b>${Number.isFinite(p.vector?.[k])?Number(p.vector[k]).toFixed(2):'—'}</b></span>`).join('')}</div>`}function privateView(){return `<div class="grid">${packets.length?packets.map(p=>`<article class="card"><div class="tags"><span class="tag">${esc(p.register)}</span><span class="tag">${esc(p.privacy)}</span>${p.continuity?`<span class="tag">${esc(p.continuity)}</span>`:''}</div><h2>${esc(p.observation?.title||p.observation?.entity||p.glyphId)}</h2>${vector(p)}<p>${esc(p.narrative||'No narrative fragment.')}</p><div class="muted">${esc(p.capturedAt)} · ${esc(p.sourceRefs.join(' · '))}</div></article>`).join(''):'<div class="empty">Capture a sourced Observer reading to create the first packet.</div>'}</div>`}
function wiki(){const text=packets.map(p=>`## ${p.observation?.title||p.observation?.entity||p.glyphId}\n\n- Captured: ${p.capturedAt}\n- Continuity: ${p.continuity||'Unassigned'}\n- Dreaming locus: ${p.locus?.dreaming||'Not recorded'}\n- Register: ${p.register}\n- Sources: ${p.sourceRefs.join(', ')||'None recorded'}\n\n${p.narrative||''}\n\nPREMAQ: ${Object.entries(p.vector||{}).map(([k,v])=>`${k} ${v}`).join(' · ')}\n`).join('\n');return `<article class="card"><h2>Wiki-safe working export</h2><p class="muted">Review privacy and consent before sharing. Waking locations marked private are omitted.</p><button id="download">Download Markdown</button><pre>${esc(text||'No packets yet.')}</pre></article>`}
function patterns(){const counts={continuities:{},tags:{},registers:{}};for(const p of packets){if(p.continuity)counts.continuities[p.continuity]=(counts.continuities[p.continuity]||0)+1;for(const t of p.tags||[])counts.tags[t]=(counts.tags[t]||0)+1;counts.registers[p.register]=(counts.registers[p.register]||0)+1}const rows=Object.entries(counts).flatMap(([kind,items])=>Object.entries(items).map(([name,count])=>({kind,name,count}))).sort((a,b)=>b.count-a.count);return `<div class="grid">${rows.length?rows.map(r=>`<div class="metric"><span class="tag">${esc(r.kind)}</span><br><strong>${r.count}</strong><div>${esc(r.name)}</div><p class="muted">Descriptive recurrence only.</p></div>`).join(''):'<div class="empty">No recurrence set yet.</div>'}</div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#content').innerHTML=view==='private'?privateView():view==='wiki'?wiki():patterns();if(view==='wiki')$('#download').onclick=()=>dl('hearthgate-almanac-wiki.md',$('#content pre').textContent)}async function load(){const r=await fetch('/api/v1/almanac'),x=await r.json();packets=x.packets||[];render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#refresh').onclick=load;load();
</script></body></html>
