<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Writing Room · Hearthgate</title>
  <script>if(self!==top||new URLSearchParams(location.search).has('embedded'))document.documentElement.classList.add('embedded')</script>
  <style>
    :root{--bg:#080a09;--panel:#101612;--ink:#e8eee9;--dim:#8ca095;--green:#54d9a1;--gold:#d7b464;--line:rgba(160,220,190,.17);--danger:#e78979}*{box-sizing:border-box}html,body{height:100%;margin:0;background:radial-gradient(circle at 10% 0,#173126,transparent 32rem),var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}.top{height:58px;display:flex;align-items:center;gap:.55rem;padding:.6rem;border-bottom:1px solid var(--line);background:rgba(5,9,7,.92)}a,button,.file{border:1px solid var(--line);border-radius:7px;padding:.48rem .68rem;background:rgba(8,14,11,.8);color:var(--ink);text-decoration:none;cursor:pointer}.primary{border-color:var(--green);color:var(--green)}.danger{color:var(--danger)}.brand{margin-right:auto}.brand strong,.brand small{display:block}.brand small,.muted{color:var(--dim)}.app{height:calc(100% - 58px);display:grid;grid-template-columns:290px minmax(360px,1fr) 280px}.shelf,.meta{overflow:auto;padding:.8rem;background:rgba(8,13,10,.74)}.shelf{border-right:1px solid var(--line)}.meta{border-left:1px solid var(--line)}.search,input,select,textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:.58rem}.docs{display:grid;gap:.45rem;margin-top:.7rem}.doc{padding:.65rem;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:rgba(255,255,255,.018)}.doc.active,.doc:hover{border-color:var(--green)}.doc strong,.doc small{display:block}.doc small{color:var(--dim);margin-top:.25rem}.editor{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.title{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:1rem 1.2rem;font-family:Georgia,serif;font-size:clamp(1.5rem,3vw,2.4rem)}#content{border:0;border-radius:0;resize:none;padding:1.2rem clamp(1rem,5vw,4rem);font:1.08rem/1.72 Georgia,serif;background:rgba(6,9,7,.42);outline:none}.status{display:flex;justify-content:space-between;padding:.48rem .8rem;border-top:1px solid var(--line);color:var(--dim);font-size:.72rem}.meta label{display:grid;gap:.3rem;margin-bottom:.8rem;color:var(--dim);font-size:.72rem}.meta h2{font-family:Georgia,serif;color:var(--gold)}.source{padding:.7rem;border:1px solid var(--line);border-radius:8px;font-size:.72rem;overflow-wrap:anywhere}.file input{display:none}.empty{color:var(--dim);padding:1rem}.mobile-meta{display:none}@media(max-width:900px){.app{grid-template-columns:230px 1fr}.meta{display:none}.mobile-meta{display:inline-block}}@media(max-width:650px){.app{display:block;overflow:auto}.shelf{height:auto;border-right:0;border-bottom:1px solid var(--line)}.editor{height:calc(100vh - 250px)}.top{overflow-x:auto}.brand{min-width:145px}}
    html.embedded .top{display:none}html.embedded .app{height:100dvh}.shelf,.meta{background:linear-gradient(145deg,rgba(255,255,255,.07),transparent 30%),rgba(8,16,13,.64);backdrop-filter:blur(22px) saturate(145%);box-shadow:inset 0 1px rgba(255,255,255,.09)}
  </style>
</head>
<body>
  <header class="top"><a href="/laboratory.html#home">⌂ Home</a><div class="brand"><strong>Writing Room</strong><small>Hearthgate · long-form work</small></div><button id="new" class="primary">+ New</button><label class="file">Import document<input id="import" type="file" accept=".pdf,.docx,.txt,.md,.markdown,.rtf,.html,.htm,.json,.yaml,.yml,.xml,.csv,.png,.jpg,.jpeg,.webp,.tif,.tiff"></label><button id="export">Export</button></header>
  <main class="app">
    <aside class="shelf"><input id="search" class="search" type="search" placeholder="Search documents…"><div id="docs" class="docs"></div></aside>
    <section class="editor"><input id="title" class="title" placeholder="Untitled"><textarea id="content" spellcheck="true" placeholder="Begin writing…"></textarea><div class="status"><span id="save-status">Ready.</span><span id="counts">0 words · 0 characters</span></div></section>
    <aside class="meta"><h2>Document</h2><label>Type<select id="type"><option>story</option><option>DR script</option><option>lorebook</option><option>continuity</option><option>character profile</option><option>scene</option><option>research synthesis</option><option>source adaptation</option><option>notes</option></select></label><label>Status<select id="doc-status"><option>idea</option><option>outline</option><option selected>draft</option><option>revision</option><option>canon</option><option>archived</option></select></label><label>Continuity / universe<input id="continuity" placeholder="Between the Dreaming · July 2027"></label><label>Tone palette<input id="tone" list="tone-list" placeholder="lyrical, intimate, mythic"><datalist id="tone-list"><option value="lyrical, intimate, mythic"><option value="cinematic, adventurous"><option value="gothic, atmospheric"><option value="grounded, tender"><option value="romantic, sensual"><option value="wry, irreverent"><option value="suspenseful, uncanny"><option value="sacred, contemplative"></datalist></label><label>Point of view<select id="pov"><option>first person</option><option>first person plural</option><option>second person</option><option>third person limited</option><option>third person omniscient</option><option>epistolary / mixed</option></select></label><label>Tense<select id="tense"><option>past</option><option>present</option><option>future</option><option>mixed</option></select></label><label>Tags<input id="tags" placeholder="Sariel, Gabriel, Wayward Sons"></label><label>Synopsis<textarea id="synopsis" placeholder="What this document contains…"></textarea></label><label>Canon & continuity notes<textarea id="canon-notes" placeholder="Facts, boundaries, unresolved threads…"></textarea></label><div id="source" class="source muted">Original work · no imported source.</div><hr style="border:0;border-top:1px solid var(--line);margin:1rem 0"><button id="delete" class="danger">Delete document</button></aside>
  </main>
  <script>
  (()=>{const $=s=>document.querySelector(s);let documents=[],current=null,timer=null,saving=false;
    const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function payload(){return{title:$('#title').value.trim()||'Untitled',documentType:$('#type').value,status:$('#doc-status').value,continuity:$('#continuity').value.trim(),tone:$('#tone').value.trim(),pointOfView:$('#pov').value,tense:$('#tense').value,synopsis:$('#synopsis').value,canonNotes:$('#canon-notes').value,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),content:$('#content').value}}
    function counts(){const text=$('#content').value,w=text.trim()?text.trim().split(/\s+/).length:0;$('#counts').textContent=`${w} words · ${text.length} characters`}
    function renderShelf(){const q=$('#search').value.toLowerCase(),rows=documents.filter(d=>[d.title,d.documentType,d.status,d.continuity,d.tone,d.synopsis,...(d.tags||[])].join(' ').toLowerCase().includes(q));$('#docs').innerHTML=rows.map(d=>`<article class="doc ${d.id===current?.id?'active':''}" data-id="${d.id}"><strong>${esc(d.title)}</strong><small>${esc(d.documentType)} · ${esc(d.status||'draft')}${d.continuity?` · ${esc(d.continuity)}`:''}</small><small>${d.wordCount||0} words · ${new Date(d.updatedAt).toLocaleString()}</small></article>`).join('')||'<div class="empty">No writing documents yet.</div>'}
    function load(d){current=d;$('#title').value=d.title;$('#content').value=d.content||'';$('#type').value=[...$('#type').options].some(x=>x.value===d.documentType)?d.documentType:'notes';$('#doc-status').value=d.status||'draft';$('#continuity').value=d.continuity||'';$('#tone').value=d.tone||'';$('#pov').value=d.pointOfView||'first person';$('#tense').value=d.tense||'past';$('#synopsis').value=d.synopsis||'';$('#canon-notes').value=d.canonNotes||'';$('#tags').value=(d.tags||[]).join(', ');$('#source').textContent=d.sourceDocumentId?`Editable extraction from ${d.sourceName} · SHA-256 ${d.sourceSha256||'not recorded'} · source ${d.sourceDocumentId}`:'Original work · no imported source.';counts();renderShelf();$('#save-status').textContent=`Loaded · ${new Date(d.updatedAt).toLocaleString()}`}
    async function refresh(preferred){const q=await fetch('/api/v1/writer'),p=await q.json();documents=p.documents||[];renderShelf();const target=documents.find(d=>d.id===(preferred||current?.id))||documents[0];if(target)load(target);else await create()}
    async function create(seed={}){const q=await fetch('/api/v1/writer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'Untitled',documentType:'story',content:'',...seed})}),p=await q.json();if(!q.ok)throw new Error(p.error);documents.unshift(p.document);load(p.document);$('#title').focus();$('#title').select()}
    function schedule(){counts();$('#save-status').textContent='Unsaved changes…';clearTimeout(timer);timer=setTimeout(save,700)}
    async function save(){if(!current||saving)return;saving=true;$('#save-status').textContent='Saving…';try{const q=await fetch(`/api/v1/writer/${current.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())}),p=await q.json();if(!q.ok)throw new Error(p.error);current=p.document;documents=documents.map(d=>d.id===current.id?current:d);$('#save-status').textContent=`Saved · ${new Date(current.updatedAt).toLocaleTimeString()}`;renderShelf()}catch(e){$('#save-status').textContent=`Save failed: ${e.message}`}finally{saving=false}}
    $('#new').onclick=()=>create().catch(e=>alert(e.message));$('#docs').onclick=e=>{const id=e.target.closest('[data-id]')?.dataset.id,d=documents.find(x=>x.id===id);if(d){clearTimeout(timer);save().then(()=>load(d))}};['title','content','continuity','tone','tags','synopsis','canon-notes'].forEach(id=>$('#'+id).addEventListener('input',schedule));['type','doc-status','pov','tense'].forEach(id=>$('#'+id).onchange=schedule);$('#search').oninput=renderShelf;
    $('#delete').onclick=async()=>{if(!current||!confirm(`Delete “${current.title}”?`))return;await fetch(`/api/v1/writer/${current.id}`,{method:'DELETE'});current=null;refresh()};
    $('#export').onclick=()=>{if(!current)return;const base=(payload().title||'document').replace(/[^a-z0-9 _-]/gi,'').trim().replace(/\s+/g,'-'),format=prompt('Export format: md, txt, or json','md')?.toLowerCase();if(!format)return;const body=format==='json'?JSON.stringify({...current,...payload()},null,2):format==='md'?`# ${payload().title}\n\nType: ${payload().documentType}\nContinuity: ${payload().continuity||'—'}\nTags: ${payload().tags.join(', ')}\n\n${payload().content}`:payload().content,type=format==='json'?'application/json':'text/plain';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=`${base||'document'}.${format}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
    $('#import').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;$('#save-status').textContent=`Importing ${file.name}…`;try{const fd=new FormData();fd.append('file',file);const iq=await fetch('/api/v1/ingest',{method:'POST',body:fd}),ip=await iq.json();if(!iq.ok)throw new Error(ip.error);const q=await fetch(`/api/v1/writer/import-source/${ip.document.id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),p=await q.json();if(!q.ok)throw new Error(p.message||p.error);await refresh(p.document.id)}catch(err){$('#save-status').textContent=`Import failed: ${err.message}`}};
    addEventListener('visibilitychange',()=>{if(document.hidden&&timer){clearTimeout(timer);save()}});addEventListener('blur',()=>{if(timer){clearTimeout(timer);save()}});refresh().catch(e=>$('#save-status').textContent=e.message);
  })();
  </script>
</body></html>
