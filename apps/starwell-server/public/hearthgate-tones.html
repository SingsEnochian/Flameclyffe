<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tone Lab · Hearthgate</title><style>
*{box-sizing:border-box}:root{color-scheme:dark;--mint:#64ddb0;--gold:#e0bd68;--line:rgba(135,202,180,.2);--glass:rgba(13,25,22,.72)}body{margin:0;min-height:100dvh;padding:clamp(1rem,3vw,2.7rem);background:radial-gradient(circle at 10% 0,#173b30,transparent 34rem),radial-gradient(circle at 90% 0,#312343,transparent 30rem),#050807;color:#e5eee8;font:14px/1.5 ui-monospace,monospace}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2.5rem,5vw,4.8rem);margin:.05em 0}.eyebrow{color:var(--mint);letter-spacing:.16em;text-transform:uppercase;font-size:.72rem}.muted{color:#91a49a;max-width:80ch}.boundary{border-left:2px solid var(--gold);padding:.7rem 1rem;background:rgba(190,145,35,.07);color:#d9ca9e}.layout{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(390px,1.4fr);gap:1rem;margin-top:1rem}.pane,.patch{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.07),transparent 35%),var(--glass);backdrop-filter:blur(24px) saturate(145%);box-shadow:inset 0 1px rgba(255,255,255,.1),0 18px 45px rgba(0,0,0,.23)}.pane{padding:1rem}.patch-list{display:grid;gap:.6rem}.patch{padding:.9rem;width:100%;text-align:left;color:#e5eee8;cursor:pointer}.patch.active{border-color:var(--mint)}.patch strong{font:1.25rem Georgia,serif;color:#f1e7ca}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:.1rem .38rem;color:var(--mint);font-size:.65rem;margin:.15rem}.tabs,.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0}button,input,select,textarea{font:inherit}button{padding:.55rem .8rem;border:1px solid var(--line);border-radius:8px;background:rgba(5,13,11,.68);color:#dce9e2;cursor:pointer}button:hover,button.active{border-color:var(--mint);color:var(--mint)}button.primary{border-color:var(--mint);background:rgba(40,135,98,.2)}button.stop{border-color:#d76e6e;color:#ffabab}.fields{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.fields label{color:#a6b7af;font-size:.75rem}.fields .full{grid-column:1/-1}.fields input,.fields select,.fields textarea{display:block;width:100%;margin-top:.25rem;padding:.62rem;border:1px solid var(--line);border-radius:8px;background:rgba(2,8,7,.62);color:#e5eee8}.fields input[type=checkbox]{display:inline;width:auto;margin-right:.4rem}.fields input[type=range]{padding:0}.fields textarea{min-height:80px;resize:vertical}.consent{padding:.75rem;border:1px solid rgba(224,189,104,.35);border-radius:10px;background:rgba(150,110,20,.06)}.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}.readout div{padding:.6rem;border:1px solid var(--line);border-radius:9px}.readout strong{display:block;color:var(--gold);font-size:1.25rem}.warnings{color:#e2c688}.history{display:grid;gap:.5rem}.session{padding:.7rem;border:1px solid var(--line);border-radius:9px}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}}@media(max-width:520px){.fields,.readout{grid-template-columns:1fr}.fields .full{grid-column:auto}}
</style></head><body><div class="eyebrow">Hearthgate · consent-led sensory calibration</div><h1>Tone Lab</h1><p class="muted">Visual atmosphere, optional sound, and optional haptic rhythm live in one configurable patch. Nothing plays on selection or page load. Sound and vibration require explicit consent and a deliberate Start.</p><p id="boundary" class="boundary">Loading instrument boundary…</p><main class="layout"><aside class="pane"><div class="actions"><button id="new-patch">+ New patch</button><button id="history-btn">Response history</button><button id="export-patches">Export Runa patches</button><label><button type="button" id="import-button">Import patches</button><input id="import-patches" class="hidden" type="file" accept=".json"></label></div><div id="patch-list" class="patch-list"></div></aside><section class="pane"><div id="instrument"></div></section></main>
<script src="/assets/starwell-shared-audio-context.js"></script>
<script src="/assets/hearthgate-tone-engine-adapter.js"></script>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x??’’).replace(/[&<>"’]/g,c=>({‘&’:’&amp;’,’<’:’&lt;’,’>’:’&gt;’,’"’:’&quot;’,"’":’&#39;’}[c]));
let presets=[],profiles=[],consentProfiles=[],selected=null,mode=’play’,startedAt=null,lastRun=null;

// One engine coordinator for the lifetime of the page.
const adapter=new HearthgateToneEngineAdapter();

function updateStopUI(message=’Quiet. No output active.’){
  if(lastRun)lastRun.stoppedByUser=adapter.lastStop?.reason!==’natural-completion’;
  if(lastRun&&adapter.lastStop)lastRun.stopWord=adapter.lastStop.reason;
  $(‘#stop’)?.classList.add(‘hidden’);
  $(‘#start’)?.classList.remove(‘hidden’);
  if($(‘#status’))$(‘#status’).textContent=message;
}

function stopAllOutput(reason=’route-change’,message=’All Tone Lab output stopped.’){
  adapter.stopAll(reason);
  updateStopUI(message);
}

function haltAll(message=’All Tone Lab output stopped.’,stopWord=’stop’){
  stopAllOutput(stopWord,message);
}

function select(id){stopAllOutput(‘route-change’);selected=id;mode=’play’;renderList();renderInstrument();parent.postMessage({type:’hearthgate-tone’,tone:id},location.origin)}
function renderList(){const host=$(‘#patch-list’);host.innerHTML=presets.map(p=>`<button class="patch ${p.id===selected?’active’:’’}" data-id="${esc(p.id)}"><span class="tag">${esc(p.intensity)}</span>${p.custom?’<span class="tag">custom</span>’:’’}<strong>${esc(p.name)}</strong><div class="muted">${esc(p.description)}</div></button>`).join(‘’);host.querySelectorAll(‘[data-id]’).forEach(b=>b.onclick=()=>select(b.dataset.id))}
function patch(){return presets.find(p=>p.id===selected)}

function binauralAckField(){return `<label class="full consent" id="binaural-ack-row"><input id="binaural-ack" type="checkbox"> I acknowledge this patch uses binaural audio and will use headphones.</label>`}

function playView(p){
  const isBinaural=p.audio?.routingMode===’binaural’;
  return `<div class="eyebrow">${p.custom?’Custom patch’:’House patch’}</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><p class="muted">${esc(p.visual)}</p><div class="warnings">${p.warnings.map(w=>`<p>⚠ ${esc(w)}</p>`).join(‘’)||’<p>No patch-specific warning recorded.</p>’}</div><div class="readout"><div><strong>${p.audio.frequencyHz} Hz</strong>anchor</div><div><strong>${p.audio.overtoneHz} Hz</strong>upper tone</div><div><strong>${p.intensity}</strong>intensity</div></div><div class="tabs"><button data-mode="play" class="active">Experience</button><button data-mode="configure">Configure</button><button data-mode="response">Record response</button></div><div class="fields"><label class="full">Output/accessibility profile<select id="output-profile">${profiles.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · max ${Math.round(x.volumeCeiling*100)}%</option>`).join(‘’)}</select></label><label>Duration · <span id="duration-label">${p.defaultSeconds}s</span><input id="duration" type="range" min="5" max="${p.maxSeconds}" value="${p.defaultSeconds}" step="5"></label><label>Volume · <span id="volume-label">${Math.round(p.defaultVolume*100)}%</span><input id="volume" type="range" min="0" max="${p.maxVolume}" value="${p.defaultVolume}" step=".01"></label><label class="full consent"><input id="consent" type="checkbox"> I choose to begin this patch and understand that I can stop it immediately.</label>${isBinaural?binauralAckField():’’}<label><input id="audio-enabled" type="checkbox"> Enable audio</label><label><input id="haptics-enabled" type="checkbox"> Enable haptics, if supported</label></div><div id="applied-limits" class="hidden boundary" style="margin:.5rem 0"></div><div class="actions"><button id="start" class="primary">Start chosen patch</button><button id="stop" class="stop hidden">Stop now</button><span id="status" class="muted">Quiet. No output active.</span></div>`
}

function configureView(p){return `<div class="eyebrow">Patch configuration</div><h2>${esc(p.name)}</h2><p class="boundary">Configuration cannot bypass Hearthgate’s global safety limits: 20–16,000 Hz, volume ≤35%, and duration ≤30 minutes.</p><form id="config-form" class="fields"><label>Name<input name="name" value="${esc(p.name)}" required></label><label>Visual shell key<input name="id" value="${esc(p.id)}" ${p.custom?’’:’readonly’}></label><label class="full">Plain description<textarea name="description">${esc(p.description)}</textarea></label><label class="full">Visual description<input name="visual" value="${esc(p.visual)}"></label><label>Anchor frequency Hz<input name="frequencyHz" type="number" min="20" max="16000" step=".1" value="${p.audio.frequencyHz}"></label><label>Upper frequency Hz<input name="overtoneHz" type="number" min="20" max="16000" step=".1" value="${p.audio.overtoneHz}"></label><label>Default seconds<input name="defaultSeconds" type="number" min="5" max="1800" value="${p.defaultSeconds}"></label><label>Maximum seconds<input name="maxSeconds" type="number" min="5" max="1800" value="${p.maxSeconds}"></label><label>Default volume (0–.35)<input name="defaultVolume" type="number" min="0" max=".35" step=".01" value="${p.defaultVolume}"></label><label>Maximum volume (0–.35)<input name="maxVolume" type="number" min="0" max=".35" step=".01" value="${p.maxVolume}"></label><label>Intensity<select name="intensity"><option ${p.intensity===’gentle’?’selected’:’’}>gentle</option><option ${p.intensity===’moderate’?’selected’:’’}>moderate</option><option ${p.intensity===’intense’?’selected’:’’}>intense</option></select></label><label>Haptic milliseconds<input name="hapticPattern" value="${esc(p.haptics.pattern.join(‘, ‘))}"></label><label class="full">Warnings · one per line<textarea name="warnings">${esc(p.warnings.join(‘\n’))}</textarea></label><div class="actions full"><button class="primary" type="submit">Save patch</button>${p.custom?’<button id="delete-patch" class="stop" type="button">Delete patch</button>’:’<button id="reset-patch" type="button">Reset house patch</button>’}<button data-mode="play" type="button">Cancel</button></div></form>`}
function responseView(p){return `<div class="eyebrow">Perception record</div><h2>Reflect on ${esc(p.name)}</h2><p class="muted">This is your account, not an automated diagnosis. Leave any field blank.</p><form id="response-form" class="fields"><label>Comfort<select name="comfort"><option>not recorded</option><option>comfortable</option><option>mixed</option><option>uncomfortable</option><option>stopped immediately</option></select></label><label>Actual duration seconds<input name="durationSeconds" type="number" min="0" max="${p.maxSeconds}" value="0"></label><label class="full">Body / physical perception<textarea name="body"></textarea></label><label class="full">Emotion / mood<textarea name="emotion"></textarea></label><label class="full">Imagery, memory, or association<textarea name="imagery"></textarea></label><label class="full">Other notes<textarea name="notes"></textarea></label><button class="primary" type="submit">Save private response</button><button data-mode="play" type="button">Cancel</button></form>`}
function renderInstrument(){const p=patch();if(!p)return;const host=$(‘#instrument’);host.innerHTML=mode===’configure’?configureView(p):mode===’response’?responseView(p):playView(p);host.querySelectorAll(‘[data-mode]’).forEach(b=>b.onclick=()=>{mode=b.dataset.mode;renderInstrument()});if(mode===’play’)wirePlayer(p);if(mode===’configure’)wireConfig(p);if(mode===’response’)wireResponse(p)}

function wirePlayer(p){
  const duration=$(‘#duration’),volume=$(‘#volume’);
  duration.oninput=()=>$(‘#duration-label’).textContent=`${duration.value}s`;
  volume.oninput=()=>$(‘#volume-label’).textContent=`${Math.round(volume.value*100)}%`;

  $(‘#stop’).onclick=()=>{
    adapter.stopAll(‘stop’);
    updateStopUI(‘Stopped by you.’);
  };

  $(‘#start’).onclick=async()=>{
    const profile=profiles.find(x=>x.id===$(‘#output-profile’).value)||{volumeCeiling:.1,frequencyMinHz:20,frequencyMaxHz:16000,hapticsAllowed:false};
    const request={presetId:p.id,profileId:’default’,consent:$(‘#consent’).checked,durationSeconds:Number(duration.value),volume:Math.min(Number(volume.value),profile.volumeCeiling)};
    const gateResponse=await fetch(‘/api/v1/tones/preflight’,{method:’POST’,headers:{‘Content-Type’:’application/json’},body:JSON.stringify(request)});
    const gatePayload=await gateResponse.json();
    if(!gateResponse.ok||!gatePayload.preflight?.allowed){
      $(‘#status’).textContent=`Blocked: ${(gatePayload.preflight?.reasons||[gatePayload.error]).join(‘, ‘)}`;
      return;
    }
    const preflight=gatePayload.preflight;
    const limits=preflight.limits;

    // Show applied (server-approved) limits before any node is created
    const appliedEl=$(‘#applied-limits’);
    if(appliedEl){
      appliedEl.textContent=`Applied limits: ${limits.durationSeconds}s · ${Math.round(limits.volume*100)}% · routing: ${p.audio?.routingMode||’standard’}`;
      if(preflight.warnings?.length)appliedEl.textContent+=` · ⚠ ${preflight.warnings.join(‘, ‘)}`;
      appliedEl.classList.remove(‘hidden’);
    }

    const withAudio=$(‘#audio-enabled’).checked;
    const withHaptics=$(‘#haptics-enabled’).checked&&profile.hapticsAllowed;
    const binaural=p.audio?.routingMode===’binaural’;
    const acknowledgedBinaural=!binaural||!!$(‘#binaural-ack’)?.checked;

    const tonePatch={
      id:p.id,name:p.name,description:p.description,
      frequencyHz:p.audio.frequencyHz,overtoneHz:p.audio.overtoneHz,
      hapticPattern:p.haptics.pattern,intensity:p.intensity,
      routingMode:p.audio.routingMode||’standard’,
      binauralIntegrity:p.audio.binauralIntegrity||’none’,
      maxSeconds:p.maxSeconds,maxVolume:p.maxVolume,
      warnings:p.warnings||[],warningFlags:p.warningFlags||[]
    };

    if(withAudio){
      if(!window.AudioContext&&!window.webkitAudioContext){
        $(‘#status’).textContent=’Web Audio is not supported here.’;return;
      }
      try{
        adapter.applyPreflight(preflight,p.id);
        const result=await adapter.play(tonePatch,{consent:true,acknowledgedBinaural,hapticsEnabled:withHaptics});
        startedAt=new Date().toISOString();
        lastRun={...request,durationSeconds:result.durationSeconds,volume:result.volume,audioEnabled:true,hapticsEnabled:withHaptics,stoppedByUser:false};
        $(‘#start’).classList.add(‘hidden’);
        $(‘#stop’).classList.remove(‘hidden’);
        $(‘#status’).textContent=`Active · applied ${result.durationSeconds}s · ${Math.round(result.volume*100)}%. Stop, Feather, or Icarus halt all output.`;
        // Natural completion: adapter fires stopAll(‘natural-completion’) via its timer;
        // we just need to reflect that in the UI. Poll the adapter’s running state once
        // it transitions, using a single lightweight setTimeout as a deferred check.
        setTimeout(()=>{
          if(!adapter.running&&adapter.lastStop?.reason===’natural-completion’){
            updateStopUI(‘Patch completed and returned to quiet.’);
          }
        },(result.durationSeconds*1000)+500);
      }catch(err){
        if(err.code===’scfe-body-no’)$(‘#status’).textContent=’Output prevented: somatic veto is active.’;
        else if(err.code===’binaural-warning-acknowledgement-required’)$(‘#status’).textContent=’Tick the binaural acknowledgement above to continue.’;
        else $(‘#status’).textContent=`Engine: ${err.message}`;
      }
    }else{
      // Visual-only pass — haptics still allowed
      if(withHaptics&&navigator.vibrate&&p.haptics.pattern.length)navigator.vibrate(p.haptics.pattern);
      startedAt=new Date().toISOString();
      lastRun={...request,durationSeconds:limits.durationSeconds,volume:0,audioEnabled:false,hapticsEnabled:withHaptics,stoppedByUser:false};
      $(‘#start’).classList.add(‘hidden’);
      $(‘#stop’).classList.remove(‘hidden’);
      $(‘#status’).textContent=’Visual pass only; audio remains off.’;
      setTimeout(()=>{
        if(!adapter.running){$(‘#stop’)?.classList.add(‘hidden’);$(‘#start’)?.classList.remove(‘hidden’);$(‘#status’).textContent=’Visual pass completed.’;}
      },limits.durationSeconds*1000);
    }
  };
}

function formObject(form){return Object.fromEntries(new FormData(form))}
function wireConfig(p){const form=$(‘#config-form’);form.onsubmit=async e=>{e.preventDefault();const body=formObject(form);body.warnings=body.warnings.split(‘\n’);body.hapticPattern=body.hapticPattern.split(‘,’).map(Number);const r=await fetch(`/api/v1/tones/presets/${encodeURIComponent(p.id)}`,{method:’PUT’,headers:{‘Content-Type’:’application/json’},body:JSON.stringify(body)}),x=await r.json();if(!r.ok)throw new Error(x.error);await load();selected=x.preset.id;mode=’play’;renderList();renderInstrument()};$(‘#delete-patch’)?.addEventListener(‘click’,async()=>{await fetch(`/api/v1/tones/presets/${encodeURIComponent(p.id)}`,{method:’DELETE’});await load()});$(‘#reset-patch’)?.addEventListener(‘click’,async()=>{await fetch(`/api/v1/tones/presets/${encodeURIComponent(p.id)}`,{method:’DELETE’});await load();selected=p.id;renderList();renderInstrument()})}
function wireResponse(p){$(‘#response-form’).onsubmit=async e=>{e.preventDefault();const f=formObject(e.currentTarget),body={presetId:p.id,profileId:lastRun?.profileId||’default’,consent:true,startedAt,endedAt:new Date().toISOString(),durationSeconds:Number(f.durationSeconds),volume:lastRun?.volume||0,audioEnabled:lastRun?.audioEnabled===true,hapticsEnabled:lastRun?.hapticsEnabled===true,stoppedByUser:lastRun?.stoppedByUser===true,stopWord:lastRun?.stopWord,response:f};const r=await fetch(‘/api/v1/tones/sessions’,{method:’POST’,headers:{‘Content-Type’:’application/json’},body:JSON.stringify(body)}),x=await r.json();if(!r.ok)throw new Error(x.error);mode=’play’;renderInstrument();$(‘#status’).textContent=`Private response saved · ${x.session.state.stateLabel}.`}}
async function showHistory(){stopAllOutput(‘route-change’);const r=await fetch(‘/api/v1/tones/sessions’),x=await r.json();$(‘#instrument’).innerHTML=`<div class="eyebrow">Private device-local record</div><h2>Response history</h2><div class="history">${x.sessions?.length?x.sessions.map(s=>`<article class="session"><strong>${esc(s.presetName)}</strong><div class="muted">${esc(s.endedAt)} · ${esc(s.response.comfort)} · ${s.durationSeconds}s</div><p>${esc(s.response.notes||s.response.body||s.response.imagery||’No written reflection.’)}</p></article>`).join(‘’):’<p class="muted">No responses recorded.</p>’}</div>`}
async function load(){const[r,pr,cr]=await Promise.all([fetch(‘/api/v1/tones/presets’),fetch(‘/api/v1/tones/accessibility-profiles’),fetch(‘/api/v1/tones/consent-profiles’)]),x=await r.json(),px=await pr.json(),cx=await cr.json();presets=x.presets||[];profiles=px.profiles||[];consentProfiles=cx.profiles||[];$(‘#boundary’).textContent=`${x.boundary} ${px.boundary} Stop, Feather, and Icarus halt all active output.`;if(!selected||!presets.some(p=>p.id===selected))selected=presets[0]?.id;renderList();renderInstrument()}
$(‘#new-patch’).onclick=async()=>{const r=await fetch(‘/api/v1/tones/presets’,{method:’POST’,headers:{‘Content-Type’:’application/json’},body:JSON.stringify({name:’Untitled patch’,description:’Describe what this patch is intended to feel like.’,visual:’Custom glass atmosphere.’,warnings:[‘User-configured sensory patch. Begin gently.’]})}),x=await r.json();await load();selected=x.preset.id;mode=’configure’;renderList();renderInstrument()};
$(‘#history-btn’).onclick=showHistory;
$(‘#export-patches’).onclick=()=>{const a=document.createElement(‘a’);a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:’hearthgate.runa-tone-exchange/v1’,presets,profiles,consentProfiles},null,2)],{type:’application/json’}));a.download=’hearthgate-runa-tone-patches.json’;a.click()};
$(‘#import-button’).onclick=()=>$(‘#import-patches’).click();
$(‘#import-patches’).onchange=async e=>{const x=JSON.parse(await e.target.files[0].text());for(const p of x.presets||[])await fetch(‘/api/v1/tones/presets’,{method:’POST’,headers:{‘Content-Type’:’application/json’},body:JSON.stringify({...p,frequencyHz:p.audio?.frequencyHz,overtoneHz:p.audio?.overtoneHz,hapticPattern:p.haptics?.pattern})});if(x.profiles)await fetch(‘/api/v1/tones/accessibility-profiles’,{method:’PUT’,headers:{‘Content-Type’:’application/json’},body:JSON.stringify({profiles:x.profiles})});await load()};
addEventListener(‘keydown’,event=>{if(event.key===’Escape’){adapter.stopAll(‘feather’);updateStopUI(‘Feather Stop: all output halted.’)}});
addEventListener(‘beforeunload’,()=>adapter.stopAll(‘route-change’));
load().catch(e=>$(‘#boundary’).textContent=e.message);
</script></body></html>
