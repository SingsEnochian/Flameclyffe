<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEEPStory</title><style>*{box-sizing:border-box}:root{color-scheme:dark;--m:#76f1c0;--g:#efd078;--line:rgba(130,235,200,.22)}body{margin:0;min-height:100dvh;padding:clamp(1rem,3vw,2.6rem);background:radial-gradient(circle at 12% 0,rgba(41,170,125,.3),transparent 31rem),radial-gradient(circle at 88% 0,rgba(109,82,205,.24),transparent 30rem),#050908;color:#ebfff6;font:14px/1.5 ui-monospace,monospace}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2.6rem,5vw,4.8rem);margin:.05em 0}.eyebrow{color:var(--m);letter-spacing:.17em;text-transform:uppercase}.muted{color:#91aa9e}.layout{display:grid;grid-template-columns:minmax(250px,.7fr) minmax(430px,1.5fr);gap:1rem}.glass,.item{border:1px solid var(--line);border-radius:16px;background:linear-gradient(140deg,rgba(255,255,255,.09),transparent 28%),rgba(9,28,22,.67);backdrop-filter:blur(24px) saturate(150%);box-shadow:inset 0 1px rgba(255,255,255,.13),0 17px 45px rgba(0,0,0,.23)}.glass{padding:1rem}.item{padding:.8rem;width:100%;text-align:left;color:#eafff5;margin-bottom:.55rem;cursor:pointer}.item.active{border-color:var(--m)}button,input,select,textarea{font:inherit}button{padding:.55rem .8rem;border:1px solid var(--line);border-radius:9px;background:rgba(2,14,10,.68);color:#e2f6ec;cursor:pointer}button:hover,button.active{border-color:var(--m);color:var(--m)}button.primary{border-color:var(--m);background:rgba(45,160,116,.18)}.form{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}.form label{color:#a2b9ae;font-size:.75rem}.form .full{grid-column:1/-1}.form input,.form select,.form textarea{display:block;width:100%;margin-top:.25rem;padding:.62rem;border:1px solid var(--line);border-radius:8px;background:rgba(1,10,7,.65);color:#edfff6}.form textarea{min-height:88px;resize:vertical}.sources{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:.55rem}.sources label{display:block;padding:.25rem}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:.1rem .35rem;color:var(--m);font-size:.64rem}.event{padding:.7rem;border-left:2px solid var(--g);background:rgba(0,0,0,.14);margin:.5rem 0}.empty{padding:1.5rem;border:1px dashed var(--line);border-radius:12px;color:#91aa9e}@media(max-width:820px){.layout{grid-template-columns:1fr}}@media(max-width:520px){.form{grid-template-columns:1fr}.form .full{grid-column:auto}}</style></head><body><div class="eyebrow">DEEP Observer · parallel narrative dataset</div><h1>DEEPStory</h1><p class="muted">Theory records what is known, measured, witnessed, derived, or proposed. Story records how those records unfold through time and relation. Every event must retain at least one source.</p><div class="layout"><aside class="glass"><button id="new" class="primary">+ New story thread</button><div id="list"></div></aside><main id="main" class="glass"><div class="empty">Choose a story thread or begin one.</div></main></div><script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records=[],selected=null,sources=[];const lines=x=>String(x||'').split('\n').map(x=>x.trim()).filter(Boolean);
function renderList(){$('#list').innerHTML=records.map(r=>`<button class="item ${selected===r.id?'active':''}" data-id="${r.id}"><span class="tag">${esc(r.narrative_mode)}</span><span class="tag">${esc(r.canon_state)}</span><h3>${esc(r.title)}</h3><div class="muted">${r.events.length} events · ${r.source_refs.length} sources</div></button>`).join('')||'<div class="empty">No DEEPStory records.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()})}
function sourceOptions(active=[]){const set=new Set(active.map(x=>x.ref||x));return sources.map(s=>`<label><input type="checkbox" name="source_refs" value="${esc(s.ref)}" ${set.has(s.ref)?'checked':''}> ${esc(s.label)} <span class="tag">${esc(s.dataset)}</span></label>`).join('')}
function editor(r={}){const ev=r.events||[];return `<form id="form" class="form"><label>Title<input name="title" value="${esc(r.title||'')}"></label><label>Narrative mode<select name="narrative_mode">${['documentary','continuity','interpretive','mythic','speculative','fictionalised'].map(x=>`<option ${r.narrative_mode===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Canon state<select name="canon_state">${['draft','reviewed','accepted','superseded','retired'].map(x=>`<option ${r.canon_state===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Privacy<select name="privacy_scope"><option>private_local</option><option>private_account</option><option>named_constellation</option><option>project</option><option>export_only</option></select></label><label class="full">Summary<textarea name="summary">${esc(r.summary||'')}</textarea></label><label class="full">Events · one event per line<textarea name="events" required>${esc(ev.map(e=>e.text).join('\n'))}</textarea></label><label>Event epistemic status<select name="epistemic_status">${['witnessed','recorded','derived','interpreted','remembered','correlated','unknown'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Narrative treatment<select name="narrative_treatment">${['verbatim','paraphrased','sequenced','interpreted','mythologised','speculated','fictionalised'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="full">Motifs · comma separated<input name="motifs" value="${esc((r.motifs||[]).join(', '))}"></label><div class="full sources"><strong>Immutable source references</strong>${sourceOptions(r.source_refs||[])}</div><label class="full">Revision note<input name="revision_note" placeholder="What changed and why?"></label><button class="primary" type="submit">${r.id?'Append revision':'Create sourced story record'}</button></form>${r.id?`<h3>Ordered events</h3>${r.events.map(e=>`<article class="event"><span class="tag">${esc(e.epistemic_status)}</span><span class="tag">${esc(e.narrative_treatment)}</span><p>${esc(e.text)}</p><div class="muted">${esc(e.source_refs.join(' · '))}</div></article>`).join('')}<p class="muted">${r.append_only_revisions.length} append-only revisions.</p>`:''}`}
function render(){renderList();const r=records.find(x=>x.id===selected);$('#main').innerHTML=editor(r||{});$('#form').onsubmit=save}
async function save(e){e.preventDefault();const f=new FormData(e.currentTarget),refs=f.getAll('source_refs');if(!refs.length){alert('Choose at least one source.');return}const epistemic=f.get('epistemic_status'),treatment=f.get('narrative_treatment'),body={title:f.get('title'),narrative_mode:f.get('narrative_mode'),canon_state:f.get('canon_state'),privacy_scope:f.get('privacy_scope'),summary:f.get('summary'),motifs:f.get('motifs').split(',').map(x=>x.trim()).filter(Boolean),revision_note:f.get('revision_note'),source_refs:refs.map(ref=>sources.find(s=>s.ref===ref)),events:lines(f.get('events')).map(text=>({text,epistemic_status:epistemic,narrative_treatment:treatment,source_refs:refs}))};const url=selected?`/api/v1/deep-story/${selected}`:'/api/v1/deep-story',r=await fetch(url,{method:selected?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),x=await r.json();if(!r.ok){alert(x.error);return}selected=x.record.id;await load()}
async function load(){const [d,c,a,l]=await Promise.all([fetch('/api/v1/deep-story').then(r=>r.json()),fetch('/api/v1/continuity').then(r=>r.json()),fetch('/api/v1/almanac').then(r=>r.json()),fetch('/api/v1/library').then(r=>r.json())]);records=d.records||[];sources=[...(c.continuities||[]).flatMap(x=>x.sources.map(s=>({ref:s.ref,dataset:s.kind==='observer'?'observer_witness':s.kind==='archive-analysis'?'archive':'external',record_type:s.classification==='derived-interpretation'?'interpreted':'recorded',checksum:s.provenance?.sha256||null,label:`${x.name} · ${s.title}`}))),...(a.packets||[]).map(p=>({ref:`almanac:${p.id}`,dataset:'PREMAQ',record_type:'recorded',label:`Almanac · ${p.glyphId}`})),...(l.documents||[]).map(s=>({ref:`archive:${s.id}`,dataset:'archive',record_type:'recorded',checksum:s.sha256,label:s.name}))];const seen=new Set();sources=sources.filter(s=>!seen.has(s.ref)&&seen.add(s.ref));const requested=new URLSearchParams(location.search).get('record');if(requested&&records.some(r=>r.id===requested))selected=requested;render()}$('#new').onclick=()=>{selected=null;render()};load();
</script></body></html>
