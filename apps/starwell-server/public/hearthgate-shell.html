<!doctype html><html lang="en" data-tone="dreaming"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearthgate</title><style>
:root{--bg:#040a08;--ink:#eafff5;--dim:#8ea99e;--green:#65edb8;--gold:#f0ce72;--line:rgba(133,232,202,.22);--glow-a:#123f30;--glow-b:#25204c}html[data-tone=loch]{--green:#50e5c2;--gold:#a8efe0;--glow-a:#074b43;--glow-b:#123654}html[data-tone=hearth]{--green:#e99c68;--gold:#ffda88;--glow-a:#54281a;--glow-b:#431d39}html[data-tone=starfall]{--green:#a5b7ff;--gold:#f2d66d;--glow-a:#1d2d5d;--glow-b:#4d286d}html[data-tone=dreaming]{--green:#73f0bd;--gold:#dabdff;--glow-a:#164b39;--glow-b:#4a2e5e}html[data-tone=obsidian]{--green:#b6c4ca;--gold:#e4d6b7;--glow-a:#202d31;--glow-b:#211f2a}*{box-sizing:border-box}html,body{height:100%;margin:0;background:radial-gradient(circle at 14% -10%,var(--glow-a),transparent 36rem),radial-gradient(circle at 92% 0,var(--glow-b),transparent 32rem),linear-gradient(145deg,#06120e,var(--bg) 65%,#090713);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}.shell{height:100%;display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:42px minmax(0,1fr)}.rail{grid-row:1/-1;display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.45rem .2rem;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.085),transparent 34%),rgba(3,13,10,.70);backdrop-filter:blur(28px) saturate(170%);box-shadow:inset -1px 0 rgba(255,255,255,.08),5px 0 35px rgba(45,220,160,.035);scrollbar-width:thin;scrollbar-color:var(--green) #06100c}.mark{color:var(--gold);font-size:1.2rem;margin-bottom:.2rem;text-shadow:0 0 15px var(--gold)}.rail button{width:56px;min-height:48px;flex:0 0 auto;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--dim);font:8px/1.2 inherit;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.rail button span{display:block;font-size:15px;margin-bottom:3px}.rail button:hover,.rail button.active{color:var(--gold);border-color:color-mix(in srgb,var(--green) 38%,transparent);background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(62,135,110,.13),rgba(91,69,145,.15));box-shadow:inset 0 1px rgba(255,255,255,.17),0 0 24px rgba(78,232,177,.08)}.tabs{display:flex;align-items:stretch;gap:.05rem;overflow-x:auto;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),transparent),rgba(4,11,14,.68);backdrop-filter:blur(28px) saturate(165%);box-shadow:inset 0 1px rgba(255,255,255,.08),0 5px 30px rgba(46,210,157,.025);scrollbar-width:thin}.tabs button{flex:0 0 auto;padding:0 1rem;border:0;border-bottom:2px solid transparent;background:transparent;color:#938da8;font:11px inherit;letter-spacing:.05em;cursor:pointer}.tabs button:hover{color:var(--ink)}.tabs button.active{color:var(--gold);border-bottom-color:var(--green);text-shadow:0 0 14px color-mix(in srgb,var(--green) 50%,transparent)}.stage{position:relative;min-width:0;min-height:0;overflow:hidden}.stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 12%,rgba(145,255,215,.036) 40%,transparent 62%),radial-gradient(circle at 50% 110%,rgba(68,235,170,.09),transparent 42%);z-index:1}.stage:after{content:"";position:absolute;left:0;bottom:0;width:28%;height:34%;pointer-events:none;opacity:.16;background:radial-gradient(ellipse at bottom left,var(--green),transparent 68%);filter:blur(35px);z-index:1}.stage iframe{display:block;width:100%;height:100%;border:0;background:transparent;position:relative;z-index:2}.status{margin-left:auto;align-self:center;padding:0 1rem;color:#73a590;font-size:9px;white-space:nowrap;text-shadow:0 0 12px rgba(80,240,180,.25)}@media(max-width:760px){.shell{grid-template-columns:52px minmax(0,1fr)}.rail button{width:46px;font-size:7px}.tabs button{padding:0 .7rem}.status{display:none}}
</style></head><body><div class="shell"><nav class="rail"><div class="mark">✦</div><button data-route="home"><span>⌂</span>Hearth</button><button data-route="studio"><span>◇</span>Studio</button><button data-route="observer"><span>◉</span>Observe</button><button data-route="solar"><span>☼</span>Solar</button><button data-route="continuity"><span>∞</span>Continuity</button><button data-route="almanac"><span>✧</span>Almanac</button><button data-route="deepstory"><span>⌁</span>Story</button><button data-route="archive"><span>⬡</span>Archive</button><button data-route="writing"><span>✎</span>Writing</button><button data-route="apps"><span>⌘</span>Apps</button><a href="/grove.html" style="width:56px;min-height:48px;flex:0 0 auto;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--dim);font:8px/1.2 inherit;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px" onmouseover="this.style.borderColor='rgba(133,232,202,.22)';this.style.color='var(--gold)'" onmouseout="this.style.borderColor='transparent';this.style.color='var(--dim)'"><span style="font-size:15px">✿</span>Play</a></nav><header class="tabs"><button data-route="home">Hearth</button><button data-route="studio">Studio</button><button data-route="observer">Laboratory</button><button data-route="solar">Solar Observatory</button><button data-route="continuity">Continuity</button><button data-route="almanac">Almanac</button><button data-route="deepstory">DEEPStory</button><button data-route="archive">Archive</button><button data-route="writing">Writing Chamber</button><button data-route="tones">Tones</button><button data-route="concordance">Concordance</button><button data-route="apps">Apps</button><span class="status">Work · Hearthgate</span></header><main class="stage"><iframe id="room" title="Hearthgate room"></iframe></main></div><script>
const routes={home:'/laboratory.html?embedded=1#home',studio:'/hearthgate.html?embedded=1&pane=glyph',observer:'/laboratory.html?embedded=1#laboratory',solar:'/solar-observatory.html?embedded=1',continuity:'/continuity-room.html?embedded=1',almanac:'/almanac.html?embedded=1',deepstory:'/deep-story.html?embedded=1',archive:'/hearthgate-archive.html?embedded=1',writing:'/writer.html?embedded=1',tones:'/hearthgate-tones.html?embedded=1',concordance:'/concordance.html?embedded=1',apps:'/hearthgate-apps.html?embedded=1'};const buttons=[...document.querySelectorAll('[data-route]')],frame=document.getElementById('room');function openRoom(id,push=true){id=routes[id]?id:'home';buttons.forEach(b=>b.classList.toggle('active',b.dataset.route===id));frame.src=routes[id];if(push)history.replaceState(null,'',`#${id}`)}buttons.forEach(b=>b.onclick=()=>openRoom(b.dataset.route));addEventListener('message',event=>{if(event.data?.type==='hearthgate-tone'){document.documentElement.dataset.tone=event.data.tone;localStorage.setItem('hearthgate:shell-tone',event.data.tone)}});addEventListener('hashchange',()=>openRoom(location.hash.slice(1),false));document.documentElement.dataset.tone=localStorage.getItem('hearthgate:shell-tone')||'dreaming';openRoom(location.hash.slice(1)||'home',false);
</script></body></html>
