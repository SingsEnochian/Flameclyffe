<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f12" />
  <title>ArcSweep · Hearthgate</title>
  <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;--bg:#0b0f12;--glass:#ffffff09;--glass-2:#0000003d;--line:#ffffff1a;--text:#e8eef4;--muted:#91a0ad;--signal:#79f2d2;--signal-soft:#79f2d229;--warn:#ffd58a}*{box-sizing:border-box}body{background:radial-gradient(circle at 18% 12%, #79f2d212, transparent 34rem), radial-gradient(circle at 82% 80%, #688dff12, transparent 38rem), var(--bg);min-height:100vh;color:var(--text);margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}main{width:min(1180px,100% - 32px);margin:0 auto;padding:28px 0 42px}.shell{border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:22px;overflow:hidden;box-shadow:0 28px 80px #00000057}header{border-bottom:1px solid var(--line);justify-content:space-between;align-items:center;gap:20px;padding:20px 22px;display:flex}.eyebrow{color:var(--signal);text-transform:uppercase;letter-spacing:.16em;font-size:.72rem}h1{margin:4px 0 0;font-size:clamp(1.35rem,2vw,2rem);font-weight:620}.status{color:var(--muted);align-items:center;gap:9px;font:600 .76rem/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex}.status-dot{background:var(--warn);border-radius:50%;width:9px;height:9px;box-shadow:0 0 14px}.status[data-state=live] .status-dot{background:var(--signal)}.status[data-state=error] .status-dot{background:#ff8e8e}.content{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:18px;padding:22px;display:grid}.panel{background:var(--glass-2);border:1px solid var(--line);border-radius:16px;min-width:0;padding:16px}.panel h2{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:0 0 12px;font-size:.78rem;font-weight:620}#hearthgate-three{background:#0003;border-radius:12px;height:390px;overflow:hidden}#hearthgate-three canvas{width:100%;height:100%;display:block}.right-stack{gap:18px;display:grid}.metric-row{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;display:grid}.metric{border:1px solid var(--line);background:#ffffff06;border-radius:12px;padding:12px}.metric small{color:var(--muted);margin-bottom:7px;display:block}.metric strong{color:var(--signal);font:650 1.15rem/1 ui-monospace,SFMono-Regular,Menlo,monospace}.coordinate-box{min-height:112px;color:var(--signal);white-space:pre-wrap;word-break:break-word;background:#00000047;border-radius:12px;margin:0;padding:13px;font:.82rem/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}.spectrometer{border-bottom:1px solid var(--line);align-items:end;gap:5px;height:150px;padding-top:8px;display:flex}.bar{background:linear-gradient(to top, #5e8bffc7, var(--signal));border-radius:5px 5px 0 0;flex:1 1 0;min-width:4px;height:4%;transition:height .14s;box-shadow:0 0 12px #79f2d214}.footer{color:var(--muted);flex-wrap:wrap;justify-content:space-between;gap:14px;padding:13px 22px 18px;font:.72rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex}.footer a{color:var(--signal);text-decoration:none}@media (width<=820px){.content{grid-template-columns:1fr}#hearthgate-three{height:320px}}</style>
  <script type="module" crossorigin src="../assets/hearthgate-DNMmqWy8.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="../assets/three.module-rEeecLrv.js">
  <link rel="modulepreload" crossorigin href="../assets/preload-helper-DclECHGd.js">
</head>
<body>
  <main>
    <section class="shell" aria-label="Hearthgate live matrix stream">
      <header>
        <div>
          <div class="eyebrow">ArcSweep · Vala Work</div>
          <h1>Hearthgate Matrix Observatory</h1>
        </div>
        <div id="stream-status" class="status" data-state="connecting">
          <span class="status-dot"></span>
          <span id="stream-status-label">CONNECTING</span>
        </div>
      </header>

      <div class="content">
        <section class="panel">
          <h2>Projected spine field</h2>
          <div id="hearthgate-three" aria-label="Live three-dimensional projection"></div>
        </section>

        <div class="right-stack">
          <section class="panel">
            <h2>Frame</h2>
            <div class="metric-row">
              <div class="metric"><small>Step</small><strong id="step-counter">0000</strong></div>
              <div class="metric"><small>Frame</small><strong id="frame-counter">0</strong></div>
            </div>
            <pre id="matrix-spine-display" class="coordinate-box">Waiting for Vala Work…</pre>
          </section>

          <section class="panel">
            <h2>Structural harmonics</h2>
            <div id="spectrometer" class="spectrometer" aria-label="Coordinate amplitude spectrometer"></div>
          </section>
        </div>
      </div>

      <div class="footer">
        <span id="stream-provenance">source: Vala Work / matrix_stream</span>
        <span><a href="../">Return to ArcSweep</a></span>
      </div>
    </section>
  </main>
</body>
</html>
