<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Tesla Observatory — Hearthweave Templehouse</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0a0f1e;color:#e8e6dd;font-family:Georgia,serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;box-sizing:border-box}
    .loading strong{display:block;color:#ccccff;font-size:1.4rem;margin-bottom:.5rem}
    .loading span{color:#9aa3c0;font-style:italic}
  </style>
</head>
<body>
  <div class="loading"><div><strong>Lighting the Observatory</strong><span>The GPT apparatus is warming behind the brass wall…</span></div></div>
  <script>
    fetch('/templehouse/tesla-observatory.html',{cache:'no-store'})
      .then((response)=>{if(!response.ok)throw new Error('The Observatory shell did not answer.');return response.text();})
      .then((html)=>{
        const patch='<script src="/templehouse/tesla-gpt-patch.js"><\/script>';
        const wired=html.includes('</body>')?html.replace('</body>',patch+'</body>'):html+patch;
        document.open();
        document.write(wired);
        document.close();
      })
      .catch((error)=>{
        document.body.innerHTML='<div class="loading"><div><strong>The lamp would not catch.</strong><span>'+error.message+'</span></div></div>';
      });
  </script>
</body>
</html>
