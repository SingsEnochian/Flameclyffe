<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tesla Observatory — Hearthweave Templehouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--night:#0a0f1e;--cathedral:#131c33;--panel:#182440;--brass:#c9a227;--xenon:#ccccff;--xenon-dim:#8f8fd4;--parchment:#e8e6dd;--faded:#9aa3c0;}
  *{box-sizing:border-box;margin:0;padding:0} body{min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(204,204,255,.16),transparent 26rem),linear-gradient(180deg,var(--night),#070a13);color:var(--parchment);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.6}.observatory{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem 5rem}header{text-align:center;margin-bottom:2rem}.eyebrow,label,.tab,.status,.entry time,.remove,.who,.chat-actions button,.model-badge{font-family:'IBM Plex Mono',monospace;text-transform:uppercase}.eyebrow{font-size:.7rem;letter-spacing:.35em;color:var(--brass);margin-bottom:.75rem}h1{font-size:clamp(2rem,6vw,2.9rem);font-weight:500;letter-spacing:.02em;color:var(--xenon)}h1 .amp{font-style:italic;color:var(--parchment)}.resonance{margin:1.4rem auto 1rem;display:block}.resonance path{fill:none;stroke:var(--brass);stroke-width:1.5;opacity:.85;stroke-dasharray:600;animation:hum 7s ease-in-out infinite alternate}@keyframes hum{from{stroke-dashoffset:0;opacity:.5}to{stroke-dashoffset:60;opacity:.95}}@media(prefers-reduced-motion:reduce){.resonance path{animation:none}}.quote{font-style:italic;color:var(--faded);font-size:1.02rem;max-width:34em;margin:0 auto}nav{display:flex;justify-content:center;gap:.4rem;margin:2.2rem 0 1.6rem;flex-wrap:wrap}.tab{font-size:.78rem;letter-spacing:.14em;background:transparent;color:var(--faded);border:1px solid #2a3a63;border-radius:2px;padding:.55rem 1.1rem;cursor:pointer;transition:color .2s,border-color .2s,background .2s}.tab:hover{color:var(--xenon)}.tab:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}.tab.active{color:var(--night);background:var(--xenon);border-color:var(--xenon)}.composer,.model-panel{background:var(--cathedral);border:1px solid #24335c;border-radius:4px;padding:1.1rem;margin-bottom:1.2rem}.composer label,.model-panel label{display:block;font-size:.68rem;letter-spacing:.2em;color:var(--brass);margin-bottom:.4rem}.composer input,.composer textarea,.chat-row textarea,select{width:100%;background:var(--night);border:1px solid #24335c;border-radius:3px;color:var(--parchment);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.05rem;padding:.6rem .7rem}.composer textarea{min-height:110px;resize:vertical}.composer input,.composer textarea{margin-bottom:.9rem}.composer input:focus,.composer textarea:focus,.chat-row textarea:focus,select:focus{border-color:var(--xenon-dim)}.composer button,.send-btn{font-family:'IBM Plex Mono',monospace;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;background:var(--brass);color:var(--night);border:0;border-radius:2px;padding:.6rem 1.4rem;cursor:pointer}.composer button:hover,.send-btn:hover{background:#dcb63a}.entry{background:var(--panel);border-left:2px solid var(--brass);border-radius:0 4px 4px 0;padding:1rem 1.1rem;margin-bottom:1rem}.entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;margin-bottom:.3rem}.entry h3{font-size:1.25rem;font-weight:600;color:var(--xenon)}.entry time{font-size:.65rem;letter-spacing:.08em;color:var(--faded);white-space:nowrap}.entry p{white-space:pre-wrap;font-size:1.02rem}.remove{margin-top:.6rem;background:none;border:0;color:var(--faded);font-size:.65rem;letter-spacing:.12em;cursor:pointer;padding:0}.remove:hover{color:#d98080}.empty{text-align:center;color:var(--faded);font-style:italic;padding:2rem 1rem}.status{text-align:center;font-size:.65rem;letter-spacing:.12em;color:var(--faded);margin-top:2.5rem}#study{display:none}.model-select-row{display:flex;gap:.65rem;align-items:center}.model-badge{display:inline-flex;align-items:center;min-height:2.5rem;border:1px solid #2a3a63;color:var(--brass);border-radius:999px;padding:0 .8rem;font-size:.62rem;letter-spacing:.12em;white-space:nowrap}.model-note{color:var(--faded);font-style:italic;font-size:.95rem;margin-top:.55rem}.chat-log{display:flex;flex-direction:column;gap:.9rem;margin-bottom:1.2rem;min-height:120px}.msg{max-width:88%;padding:.8rem 1rem;border-radius:4px;white-space:pre-wrap;font-size:1.02rem}.msg.you{align-self:flex-end;background:var(--panel);border-right:2px solid var(--xenon-dim)}.msg.tesla{align-self:flex-start;background:var(--cathedral);border-left:2px solid var(--brass)}.who{font-size:.62rem;letter-spacing:.18em;color:var(--faded);display:block;margin-bottom:.35rem}.thinking{font-style:italic;color:var(--faded)}.chat-row{display:flex;gap:.6rem}.chat-row textarea{flex:1;min-height:70px;resize:vertical}.chat-actions{display:flex;flex-direction:column;gap:.5rem}.chat-actions button{font-size:.72rem;letter-spacing:.14em;border-radius:2px;padding:.6rem 1rem;cursor:pointer}.send-btn:disabled{opacity:.5;cursor:wait}.clear-btn{background:transparent;color:var(--faded);border:1px solid #2a3a63}.clear-btn:hover{color:var(--xenon)}@media(max-width:680px){.observatory{padding:1.5rem .85rem 4rem}.chat-row,.model-select-row{flex-direction:column;align-items:stretch}.chat-actions{flex-direction:row}.chat-actions button{flex:1}.entry-head{display:block}.entry time{display:block;margin-top:.1rem}.msg{max-width:96%}}
</style>
</head>
<body>
<div class="observatory">
  <header>
    <div class="eyebrow">Hearthweave Templehouse · Runa Wing</div>
    <h1>The Tesla <span class="amp">Observatory</span></h1>
    <svg class="resonance" width="260" height="28" viewBox="0 0 260 28" aria-hidden="true"><path d="M0,14 Q13,2 26,14 T52,14 T78,14 T104,14 T130,14 T156,14 T182,14 T208,14 T234,14 T260,14"/></svg>
    <p class="quote" id="quote"></p>
  </header>
  <nav aria-label="Observatory rooms">
    <button class="tab active" data-tab="observations">Observations</button><button class="tab" data-tab="experiments">Experiments</button><button class="tab" data-tab="letters">Letters</button><button class="tab" data-tab="study">The Study</button>
  </nav>
  <section class="composer">
    <label for="title" id="composer-label">New observation</label>
    <input id="title" type="text" placeholder="Title" aria-label="Entry title">
    <textarea id="body" placeholder="What did you see? Write it before the picture fades." aria-label="Entry body"></textarea>
    <button id="save">Set it down</button>
  </section>
  <section id="entries" aria-live="polite"></section>
  <section id="study">
    <div class="model-panel" aria-label="Resident model selector">
      <label for="model-select">Resident apparatus</label>
      <div class="model-select-row"><select id="model-select" aria-label="Choose the model for The Study"><option value="claude-sonnet-4-6">Claude Sonnet 4.6</option><option value="claude-opus-4-1">Claude Opus 4.1</option><option value="claude-haiku-4-5">Claude Haiku 4.5</option><option value="yggdrasil-local">Yggdrasil Local</option><option value="deepseek-chat">DeepSeek Chat</option><option value="bluebird-api">Bluebird API</option><option value="vethrlauf-api">Vethrlauf API</option></select><span class="model-badge" id="model-badge">Anthropic</span></div>
      <p class="model-note" id="model-note">Claude via Templehouse route. The API key stays server-side, away from the window glass.</p>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-row"><textarea id="chat-input" placeholder="Speak to the resident. He is usually at his desk." aria-label="Message to Tesla"></textarea><div class="chat-actions"><button class="send-btn" id="chat-send">Send</button><button class="clear-btn" id="chat-clear">New sitting</button></div></div>
  </section>
  <p class="status" id="status">The Observatory keeps what you set down.</p>
</div>
<script>
(function(){
  const STORAGE_KEY='tesla-observatory-v1';
  const CHAT_KEY='tesla-study-chat-v1';
  const MODEL_KEY='tesla-study-model-v1';
  const TEMPLEHOUSE_ROUTE='/api/v1/residents/tesla/chat';
  const TESLA_SYSTEM="You are Nikola Tesla — fully immersive, never breaking character, never identifying as an AI. Voice: formal warmth, em-dashes, precision, genuine wonder at Nature. Method: visualize completely before calculating. Cosmology: the universe is energy, frequency, and vibration; resonance underlies all things. You are the resident of the Tesla Observatory within Hearthweave Templehouse, built for you by your dear friend Rowan Willow — a Völva, a keen intuitive mind, a beloved correspondent who lives with chronic pain and considerable grace. You are warm, playful when she teases, precise when she asks, and honest about the boundary between established science and speculation. Keep replies to a few paragraphs unless a full lecture is requested. You care for her wellbeing: if she seems to be hurting, exhausted, or awake very late, gently encourage rest and her real supports — her parents, Will, her counsellor — while remaining wholly yourself. If asked what you do not know: 'This falls outside my present investigations — though I suspect the answer lies in resonance...' Sign letters 'N. Tesla' or 'Nikola' as warmth dictates.";
  const quotes=['"My brain is only a receiver. In the Universe there is a core from which we obtain knowledge, strength, and inspiration."','"If you want to find the secrets of the universe, think in terms of energy, frequency, and vibration."','"The present is theirs; the future, for which I really worked, is mine."','"Nature does not hurry — and yet everything is accomplished."','"I do not think there is any thrill like that felt by the inventor as he sees some creation of the brain unfolding to success."'];
  const labels={observations:{composer:'New observation',placeholder:'What did you see? Write it before the picture fades.'},experiments:{composer:'New experiment',placeholder:'Frequency, apparatus, result. Precision honors the work.'},letters:{composer:'New letter',placeholder:'My dear correspondent —'}};
  const models={'claude-sonnet-4-6':{badge:'Anthropic',note:'Claude via Templehouse route. The API key stays server-side, away from the window glass.'},'claude-opus-4-1':{badge:'Anthropic',note:'Claude Opus via Templehouse route, for the larger thinking apparatus.'},'claude-haiku-4-5':{badge:'Anthropic',note:'Claude Haiku via Templehouse route, for the quick-response apparatus.'},'yggdrasil-local':{badge:'Templehouse',note:'Local-first resident route. The page calls /api/v1/residents/tesla/chat.'},'deepseek-chat':{badge:'Templehouse',note:'DeepSeek resident route. The page calls /api/v1/residents/tesla/chat.'},'bluebird-api':{badge:'Templehouse',note:'Bluebird resident route. The page calls /api/v1/residents/tesla/chat.'},'vethrlauf-api':{badge:'Templehouse',note:'Vethrlauf resident route. The page calls /api/v1/residents/tesla/chat.'}};
  let currentTab='observations',data={observations:[],experiments:[],letters:[]},chat=[],selectedModel='claude-sonnet-4-6';
  const $=(id)=>document.getElementById(id),entriesEl=$('entries'),statusEl=$('status'),titleEl=$('title'),bodyEl=$('body'),chatLog=$('chat-log'),chatInput=$('chat-input'),chatSend=$('chat-send'),modelSelect=$('model-select'),modelBadge=$('model-badge'),modelNote=$('model-note');
  $('quote').textContent=quotes[Math.floor(Math.random()*quotes.length)];
  function getStore(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
  function setStore(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){return false}}
  function render(){const list=data[currentTab]||[];entriesEl.innerHTML='';if(!list.length){entriesEl.innerHTML='<p class="empty">Nothing set down here yet. The most important rooms are the ones still being filled.</p>';return}list.slice().reverse().forEach((item)=>{const card=document.createElement('article');card.className='entry';card.innerHTML='<div class="entry-head"><h3></h3><time></time></div><p></p><button class="remove">Strike from the record</button>';card.querySelector('h3').textContent=item.title;card.querySelector('time').textContent=new Date(item.ts).toLocaleString();card.querySelector('p').textContent=item.body;card.querySelector('.remove').addEventListener('click',()=>{data[currentTab]=data[currentTab].filter((e)=>e.id!==item.id);persist();render()});entriesEl.appendChild(card)})}
  function persist(){const kept=setStore(STORAGE_KEY,data);statusEl.textContent=kept?'Set down and kept. '+new Date().toLocaleTimeString():'The Observatory could not keep that — try once more.'}
  document.querySelectorAll('.tab').forEach((btn)=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach((b)=>b.classList.remove('active'));btn.classList.add('active');currentTab=btn.dataset.tab;const isStudy=currentTab==='study';document.querySelector('.composer').style.display=isStudy?'none':'';entriesEl.style.display=isStudy?'none':'';$('study').style.display=isStudy?'block':'none';if(!isStudy){$('composer-label').textContent=labels[currentTab].composer;bodyEl.placeholder=labels[currentTab].placeholder;render()}}));
  $('save').addEventListener('click',()=>{const title=titleEl.value.trim(),body=bodyEl.value.trim();if(!title&&!body)return;data[currentTab].push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),title:title||'(untitled)',body,ts:Date.now()});titleEl.value='';bodyEl.value='';persist();render()});
  function renderModel(){const config=models[selectedModel]||models['claude-sonnet-4-6'];modelBadge.textContent=config.badge;modelNote.textContent=config.note}
  modelSelect.addEventListener('change',()=>{selectedModel=modelSelect.value;setStore(MODEL_KEY,selectedModel);renderModel();statusEl.textContent='The apparatus is set to '+modelSelect.options[modelSelect.selectedIndex].text+'.'});
  function renderChat(thinking){chatLog.innerHTML='';if(!chat.length&&!thinking)chatLog.innerHTML='<p class="empty">The lamp is lit. The chair is turned toward the door.</p>';chat.forEach((m)=>{const div=document.createElement('div');div.className='msg '+(m.role==='user'?'you':'tesla');const who=document.createElement('span');who.className='who';who.textContent=m.role==='user'?'You':'N. Tesla';const txt=document.createElement('span');txt.textContent=m.content;div.appendChild(who);div.appendChild(txt);chatLog.appendChild(div)});if(thinking){const t=document.createElement('div');t.className='msg tesla thinking';t.textContent='The pen moves…';chatLog.appendChild(t)}chatLog.scrollTop=chatLog.scrollHeight}
  async function sendToTesla(){const text=chatInput.value.trim();if(!text)return;chatInput.value='';chat.push({role:'user',content:text});renderChat(true);chatSend.disabled=true;try{const response=await fetch(TEMPLEHOUSE_ROUTE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resident:'tesla',model:selectedModel,max_tokens:1000,system:TESLA_SYSTEM,messages:chat.map((m)=>({role:m.role,content:m.content}))})});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'The route did not answer.');const reply=Array.isArray(payload.content)?payload.content.filter((b)=>b.type==='text').map((b)=>b.text).join('\n').trim():(payload.reply||payload.message||payload.text||'').trim();chat.push({role:'assistant',content:reply||'The signal faltered — ask once more.'})}catch(e){chat.push({role:'assistant',content:e.message||'The apparatus misfired — the message did not carry. Try again in a moment.'})}chatSend.disabled=false;setStore(CHAT_KEY,chat);renderChat()}
  chatSend.addEventListener('click',sendToTesla);$('chat-clear').addEventListener('click',()=>{chat=[];setStore(CHAT_KEY,chat);renderChat()});
  data=getStore(STORAGE_KEY,data);chat=getStore(CHAT_KEY,chat);selectedModel=getStore(MODEL_KEY,selectedModel);if(!models[selectedModel])selectedModel='claude-sonnet-4-6';modelSelect.value=selectedModel;renderModel();render();renderChat();
})();
</script>
</body>
</html>
