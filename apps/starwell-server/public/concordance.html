<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concordance</title><style>*{box-sizing:border-box}:root{color-scheme:dark;--m:#73efbc;--g:#efd071;--line:rgba(130,235,200,.22)}body{margin:0;min-height:100dvh;padding:clamp(1rem,3vw,2.6rem);background:radial-gradient(circle at 12% 0,rgba(36,166,120,.3),transparent 31rem),radial-gradient(circle at 88% 0,rgba(108,83,204,.23),transparent 30rem),#050908;color:#ebfff6;font:14px/1.5 ui-monospace,monospace}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2.6rem,5vw,4.8rem);margin:.05em 0}.eyebrow{color:var(--m);letter-spacing:.17em;text-transform:uppercase}.muted{color:#91aa9e}.search{display:grid;grid-template-columns:1fr auto;gap:.5rem;margin:1rem 0}.search input{min-width:0;padding:.8rem;border:1px solid var(--line);border-radius:10px;background:rgba(2,13,9,.7);color:#edfff6;font:inherit}.search button{padding:.65rem 1rem;border:1px solid var(--m);border-radius:10px;background:rgba(42,155,111,.18);color:#eafff5;font:inherit;cursor:pointer}.results{display:grid;gap:.65rem}.card{padding:1rem;border:1px solid var(--line);border-radius:15px;background:linear-gradient(140deg,rgba(255,255,255,.09),transparent 28%),rgba(9,28,22,.67);backdrop-filter:blur(24px) saturate(150%);box-shadow:inset 0 1px rgba(255,255,255,.13),0 17px 44px rgba(0,0,0,.22)}.card h2{color:#f0e6c8;margin:.2rem 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:.1rem .35rem;color:var(--m);font-size:.64rem}.open{display:inline-block;padding:.45rem .65rem;border:1px solid var(--line);border-radius:8px;color:#ddf5e9;text-decoration:none}.empty{padding:2rem;border:1px dashed var(--line);border-radius:12px;color:#91aa9e}</style></head><body><div class="eyebrow">Hearthfire · cross-source concordance</div><h1>Find the thread</h1><p class="muted">Searches original extracted source text, analysis, Continuity, Almanac packets, Writing Chamber work, and DEEPStory without collapsing their epistemic classes.</p><form id="search" class="search"><input id="q" placeholder="Name, date, equation, place, motif, magical correspondence…" autofocus><button>Search all sources</button></form><p id="status" class="muted">Ready.</p><main id="results" class="results"></main><script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('#search').onsubmit=async e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#status').textContent='Following the thread through every source…';const r=await fetch(`/api/v1/concordance?q=${encodeURIComponent(q)}`),x=await r.json();if(!r.ok){$('#status').textContent=x.message||x.error;return}$('#status').textContent=`${x.results.length} results across ${x.searched.entries} indexed records. ${x.boundary}`;$('#results').innerHTML=x.results.length?x.results.map(y=>`<article class="card"><span class="tag">${esc(y.dataset)}</span><span class="tag">${esc(y.classification)}</span><span class="tag">score ${y.score}</span><h2>${esc(y.title)}</h2><p>${esc(y.snippet)}</p><div class="muted">${esc(y.ref)}</div><a class="open" href="${esc(y.route)}" target="_parent">Open source</a></article>`).join(''):'<div class="empty">No textual match. This does not establish that the concept is absent from unanalysed images, audio, or unsupplied sources.</div>'};
</script></body></html>
