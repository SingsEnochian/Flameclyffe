<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearthgate Rooms</title><style>*{box-sizing:border-box}:root{color-scheme:dark;--m:#73f0bd;--g:#efce72;--line:rgba(130,235,200,.22)}body{margin:0;min-height:100dvh;padding:clamp(1rem,3vw,2.7rem);background:radial-gradient(circle at 12% 0,rgba(38,166,123,.29),transparent 31rem),radial-gradient(circle at 88% 0,rgba(105,82,196,.22),transparent 30rem),#050908;color:#ebfff6;font:14px/1.5 ui-monospace,monospace}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2.6rem,5vw,4.8rem);margin:.05em 0}.eyebrow{color:var(--m);letter-spacing:.17em;text-transform:uppercase}.muted{color:#91aa9e}.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}button,input{font:inherit}button{padding:.55rem .8rem;border:1px solid var(--line);border-radius:9px;background:rgba(2,14,10,.68);color:#def5e9;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.7rem}.card{min-height:145px;padding:1rem;border:1px solid var(--line);border-radius:15px;background:linear-gradient(140deg,rgba(255,255,255,.09),transparent 28%),rgba(9,28,22,.67);backdrop-filter:blur(24px) saturate(150%);box-shadow:inset 0 1px rgba(255,255,255,.13),0 17px 45px rgba(0,0,0,.22)}.card.off{opacity:.48}.card h2{color:var(--g);margin:.2rem 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:.1rem .35rem;color:var(--m);font-size:.64rem}.actions{display:flex;gap:.4rem;flex-wrap:wrap}.open{text-decoration:none;color:#dff5ea;border:1px solid var(--line);border-radius:8px;padding:.45rem .65rem}.config{display:grid;grid-template-columns:1fr auto;gap:.4rem;margin-top:.5rem}.config input{min-width:0;padding:.45rem;border:1px solid var(--line);border-radius:7px;background:#06100c;color:#eafff5}.hidden{display:none}</style></head><body><div class="eyebrow">Hearthgate · configurable room registry</div><h1>The whole house</h1><p class="muted">Every room keeps a stable internal identity while its name, route, permissions, and enabled state remain configurable.</p><div class="toolbar"><button id="toggle">Configure rooms</button><button id="refresh">Refresh</button></div><main id="grid" class="grid"></main><script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let modules=[],configure=false;function render(){$('#grid').innerHTML=modules.map(m=>`<article class="card ${m.enabled?'':'off'}"><span class="tag">${esc(m.category)}</span><span class="tag">${esc(m.id)}</span><h2>${esc(m.name)}</h2><p>${esc(m.description)}</p><p class="muted">${esc((m.permissions||[]).join(' · ')||'no special permissions')}</p><div class="actions"><a class="open" href="${esc(m.route)}" target="_parent">Open room</a><button data-enable="${m.id}">${m.enabled?'Disable':'Enable'}</button></div><form class="config ${configure?'':'hidden'}" data-form="${m.id}"><input name="name" value="${esc(m.name)}" aria-label="Room name"><input name="route" value="${esc(m.route)}" aria-label="Room route"><input name="permissions" value="${esc((m.permissions||[]).join(', '))}" aria-label="Permissions"><button>Save</button></form></article>`).join('');document.querySelectorAll('[data-enable]').forEach(b=>b.onclick=()=>save(b.dataset.enable,{enabled:!modules.find(m=>m.id===b.dataset.enable).enabled}));document.querySelectorAll('[data-form]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));x.permissions=x.permissions.split(',').map(v=>v.trim()).filter(Boolean);save(f.dataset.form,x)})}async function save(id,body){const r=await fetch(`/api/v1/modules/${encodeURIComponent(id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),x=await r.json();if(!r.ok)return;Object.assign(modules.find(m=>m.id===id),x.module);render()}async function load(){const r=await fetch('/api/v1/modules'),x=await r.json();modules=x.modules||[];render()}$('#toggle').onclick=()=>{configure=!configure;render()};$('#refresh').onclick=load;load();
</script></body></html>
