<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — Hearthweave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #0f0e17;
      --panel:  #16152a;
      --raised: #1e1d33;
      --border: #2a2840;
      --text:   #e8dcc8;
      --dim:    #6b6480;
      --accent: #4fa8a0;
      --gold:   #c9a03c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      font-size: 14px;
    }

    #shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #toolbar-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.08em;
      flex: 1;
    }

    button {
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
      padding: 6px 14px;
      cursor: pointer;
      transition: color 120ms, border-color 120ms;
      white-space: nowrap;
    }

    button:hover { color: var(--accent); border-color: var(--accent); }
    button.danger:hover { color: #c06060; border-color: #c06060; }

    #status {
      font-size: 11px;
      color: var(--dim);
      font-family: 'IBM Plex Mono', monospace;
      min-width: 80px;
      text-align: right;
    }

    #ed {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      line-height: 1.7;
      padding: 1.5rem 0 4rem;
      caret-color: var(--accent);
    }

    #ed::selection { background: rgba(79, 168, 160, 0.25); }
    #ed::placeholder { color: var(--dim); font-style: italic; }

    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 18px;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--accent);
      opacity: 0;
      transition: opacity 200ms, transform 200ms;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="shell">
  <div id="toolbar">
    <span id="toolbar-title">hearthweave editor</span>
    <button onclick="copySelection()">copy</button>
    <button onclick="copyAll()">copy all</button>
    <button onclick="pasteIn()">paste</button>
    <button onclick="clearAll()" class="danger">clear</button>
    <span id="status"></span>
  </div>
  <textarea id="ed" placeholder="write here…" spellcheck="true" autocorrect="on"></textarea>
</div>
<div id="toast"></div>

<script>
const STORAGE_KEY = 'hearthweave.editor.v1';
const ed = document.getElementById('ed');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

function updateStatus() {
  const words = ed.value.trim() ? ed.value.trim().split(/\s+/).length : 0;
  const chars = ed.value.length;
  document.getElementById('status').textContent = words + 'w · ' + chars + 'c';
}

function save() {
  localStorage.setItem(STORAGE_KEY, ed.value);
  updateStatus();
}

function copySelection() {
  const sel = ed.value.substring(ed.selectionStart, ed.selectionEnd);
  const text = sel.length ? sel : ed.value;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => toast(sel.length ? 'copied selection' : 'nothing selected — copied all'));
}

function copyAll() {
  if (!ed.value) return;
  navigator.clipboard.writeText(ed.value).then(() => toast('copied all'));
}

async function pasteIn() {
  try {
    const text = await navigator.clipboard.readText();
    const start = ed.selectionStart;
    const end = ed.selectionEnd;
    ed.value = ed.value.slice(0, start) + text + ed.value.slice(end);
    ed.selectionStart = ed.selectionEnd = start + text.length;
    save();
    toast('pasted');
  } catch {
    toast('paste blocked — use Ctrl+V');
  }
}

function clearAll() {
  if (!ed.value) return;
  if (!confirm('Clear everything?')) return;
  ed.value = '';
  save();
  toast('cleared');
}

ed.addEventListener('input', save);
ed.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'a') {
    e.preventDefault();
    ed.select();
  }
});

// Load saved content
ed.value = localStorage.getItem(STORAGE_KEY) ?? '';
updateStatus();
ed.focus();
</script>
</body>
</html>
