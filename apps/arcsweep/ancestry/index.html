<body>
  <main class="shell" id="arcsweep-ancestral-reader" data-universal-codex-surface="ancestry">

      <p class="kicker">Universal Codex · Ancestral Reader v0.2</p>
      <h1>Root → Correspondence → Present System</h1>

    <section class="layout">
      <aside>
        <h2>Index</h2>
        <div id="ancestral-index" class="index"></div>
      </aside>

        <section class="pane" id="source-pane"></section>
        <section class="pane" id="fingerprint-pane"></section>
        <section class="pane" id="correspondence-pane"></section>
        <section class="pane boundary" id="boundary-pane"></section>
        <section class="pane" id="projection-pane" aria-live="polite"></section>

    </section>
  </main>
  <script type="module" src="./ancestry.js"></script>
