acity="0.6" stroke-width="3" stroke-linecap="round"/><circle cx="512" cy="512" r="132" fill="url(#glow)" filter="url(#soft)"/><circle cx="512" cy="512" r="52" fill="none" stroke="#f7f2df" stroke-width="5"/><circle cx="512" cy="512" r="7" fill="#f7f2df"/><g fill="none" stroke-linecap="round" stroke-width="7"><path d="M223 365 Q264 335 304 351" stroke="url(#warm)"/><path d="M720 350 Q764 333 804 365" stroke="url(#cool)"/><path d="M174 513 Q223 489 270 510" stroke="url(#cool)"/><path d="M754 510 Q801 489 850 513" stroke="url(#warm)"/><path d="M243 682 Q286 714 329 700" stroke="url(#warm)"/><path d="M695 700 Q738 714 781 682" stroke="url(#cool)"/></g><g fill="#f7f2df"><circle cx="223" cy="365" r="5"/><circle cx="804" cy="365" r="5"/><circle cx="174" cy="513" r="5"/><circle cx="850" cy="513" r="5"/><circle cx="243" cy="682" r="5"/><circle cx="781" cy="682" r="5"/></g><path d="M420 860 Q512 902 604 860" fill="none" stroke="#d9e7ff" stroke-opacity="0.35" stroke-width="2"/><path d="M448 862 Q512 887 576 862" fill="none" stroke="#f7f2df" stroke-opacity="0.55" stroke-width="3"/><circle cx="512" cy="512" r="420" fill="none" stroke="#d9e7ff" stroke-opacity="0.07" stroke-width="1"/></svg>