<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f12" />
  <title>ArcSweep · Hearthgate</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f12;
      --glass: rgba(255,255,255,.035);
      --glass-2: rgba(0,0,0,.24);
      --line: rgba(255,255,255,.10);
      --text: #e8eef4;
      --muted: #91a0ad;
      --signal: #79f2d2;
      --signal-soft: rgba(121,242,210,.16);
      --warn: #ffd58a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(121,242,210,.07), transparent 34rem),
        radial-gradient(circle at 82% 80%, rgba(104,141,255,.07), transparent 38rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 42px; }
    .shell {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--glass);
      backdrop-filter: blur(18px);
      box-shadow: 0 28px 80px rgba(0,0,0,.34);
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow { color: var(--signal); text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; }
    h1 { margin: 4px 0 0; font-size: clamp(1.35rem, 2vw, 2rem); font-weight: 620; }
    .status { display: flex; align-items: center; gap: 9px; color: var(--muted); font: 600 .76rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 14px currentColor; }
    .status[data-state="live"] .status-dot { background: var(--signal); }
    .status[data-state="error"] .status-dot { background: #ff8e8e; }
    .content { padding: 22px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); }
    .panel { background: var(--glass-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
    .panel h2 { margin: 0 0 12px; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 620; }
    #hearthgate-three { height: 390px; border-radius: 12px; overflow: hidden; background: rgba(0,0,0,.2); }
    #hearthgate-three canvas { width: 100%; height: 100%; display: block; }
    .right-stack { display: grid; gap: 18px; }
    .metric-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .metric { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.025); }
    .metric small { display: block; color: var(--muted); margin-bottom: 7px; }
    .metric strong { font: 650 1.15rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--signal); }
    .coordinate-box { min-height: 112px; margin: 0; padding: 13px; overflow: auto; border-radius: 12px; background: rgba(0,0,0,.28); color: var(--signal); font: .82rem/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    .spectrometer { height: 150px; display: flex; align-items: end; gap: 5px; padding-top: 8px; border-bottom: 1px solid var(--line); }
    .bar { flex: 1 1 0; min-width: 4px; height: 4%; border-radius: 5px 5px 0 0; background: linear-gradient(to top, rgba(94,139,255,.78), var(--signal)); transition: height 140ms ease; box-shadow: 0 0 12px rgba(121,242,210,.08); }
    .footer { display: flex; gap: 14px; justify-content: space-between; flex-wrap: wrap; padding: 13px 22px 18px; color: var(--muted); font: .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .footer a { color: var(--signal); text-decoration: none; }
    @media (max-width: 820px) {
      .content { grid-template-columns: 1fr; }
      #hearthgate-three { height: 320px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-label="Hearthgate live matrix stream">
      <header>
        <div>
          <div class="eyebrow">ArcSweep · Vala Work</div>
          <h1>Hearthgate Matrix Observatory</h1>
        </div>
        <div id="stream-status" class="status" data-state="connecting">
          <span class="status-dot"></span>
          <span id="stream-status-label">CONNECTING</span>
        </div>
      </header>

      <div class="content">
        <section class="panel">
          <h2>Projected spine field</h2>
          <div id="hearthgate-three" aria-label="Live three-dimensional projection"></div>
        </section>

        <div class="right-stack">
          <section class="panel">
            <h2>Frame</h2>
            <div class="metric-row">
              <div class="metric"><small>Step</small><strong id="step-counter">0000</strong></div>
              <div class="metric"><small>Frame</small><strong id="frame-counter">0</strong></div>
            </div>
            <pre id="matrix-spine-display" class="coordinate-box">Waiting for Vala Work…</pre>
          </section>

          <section class="panel">
            <h2>Structural harmonics</h2>
            <div id="spectrometer" class="spectrometer" aria-label="Coordinate amplitude spectrometer"></div>
          </section>
        </div>
      </div>

      <div class="footer">
        <span id="stream-provenance">source: Vala Work / matrix_stream</span>
        <span><a href="../">Return to ArcSweep</a></span>
      </div>
    </section>
  </main>
  <script type="module" src="../src/hearthgate.js"></script>
</body>
</html>
