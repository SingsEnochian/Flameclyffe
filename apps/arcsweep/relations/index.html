<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Codex · Relational Reader</title>
  <link rel="stylesheet" href="./relations.css" />
</head>
<body>
  <main class="shell" id="arcsweep-relational-reader" data-universal-codex-surface="relations">
    <header>
      <p class="kicker">Universal Codex · Relational Reader v0.1</p>
      <h1>A ≠ B ≠ R</h1>
      <p class="lede">Inspect persisted relationships as first-class state without collapsing participants, inferring Qualia, or mutating the relation.</p>
    </header>
    <section class="law" aria-label="Relational identity law">
      <span data-law-participant>A</span><strong>≠</strong><span data-law-relation>R</span><strong>≠</strong><span data-law-participant>B</span>
    </section>
    <section class="layout">
      <aside>
        <div class="aside-heading">
          <h2>Relations</h2>
          <span id="relation-count">0</span>
        </div>
        <div id="relation-index" class="index"></div>
      </aside>
      <article>
        <section class="pane" id="identity-pane"></section>
        <section class="pane" id="state-pane"></section>
        <section class="pane" id="history-pane"></section>
        <section class="pane projection" id="projection-pane" aria-live="polite"></section>
        <section class="pane boundary" id="boundary-pane"></section>
      </article>
    </section>
  </main>
  <script type="module" src="./relations.js"></script>
</body>
</html>
